  s4-3:
    text: "Disponibilidad"
  s4-3-p1:
    text: "Definimos la disponibilidad como la fracción de RPC “cualificadas” que el servicio responde con éxito dentro de unos umbrales de latencia: 5 segundos para una solicitud Safe y 15 segundos para una solicitud Recent, ya que la reelección del líder en Spanner puede tardar hasta 10 segundos. Para que una RPC esté cualificada, la solicitud debe estar bien formada y tener un plazo límite mayor que el umbral de latencia. Además, el cliente debe mantenerse dentro de su cuota de recursos."
  s4-3-p2:
    text: "Por estas razones, no podemos medir la disponibilidad directamente con tráfico real, ya que nuestros clientes envían a veces RPC con plazos límite cortos o cancelan sus RPC en curso. En su lugar, muestreamos una pequeña fracción de las solicitudes válidas del tráfico real y las reproducimos más tarde con nuestros propios sondeadores. Al reproducir las solicitudes, fijamos un tiempo de espera mayor que el umbral de disponibilidad. También ajustamos el zookie de la solicitud, si se especifica alguno, de modo que la antigüedad relativa del zookie siga siendo la misma que cuando se recibió la solicitud en el tráfico real. Por último, ejecutamos 3 sondeadores por clúster y excluimos los valores atípicos para eliminar las falsas alarmas causadas por fallos poco frecuentes de los sondeadores."
  s4-3-p3:
    text: "Para calcular la disponibilidad, agregamos las tasas de éxito en ventanas de 90 días promediadas entre clústeres. La [Figura 5](#fig-5) muestra la disponibilidad de Zanzibar medida por estos sondeadores. La disponibilidad se ha mantenido por encima del 99.999% durante los últimos 3 años de funcionamiento en Google. En otras palabras, en cada trimestre, Zanzibar tiene menos de 2 minutos de inactividad global y menos de 13 minutos en los que la tasa global de errores supera el 10%."
  fig-5:
    alt: "Gráfico de líneas de la disponibilidad desde diciembre de 2015 hasta diciembre de 2018 para las solicitudes Safe y Recent. Ambas se mantienen entre el 99.9995% y el 100% casi en todo momento, muy por encima de la línea discontinua del 99.999%."
    caption: "Figura 5: La disponibilidad de Zanzibar durante los últimos tres años se ha mantenido por encima del 99.999%."
  s4-4:
    text: "Funcionamiento interno"
  s4-4-p1:
    text: "Los servidores de Zanzibar se delegan entre sí comprobaciones y lecturas basándose en hashing consistente, y tanto el lado llamador como el lado llamado de las operaciones delegadas almacenan en caché los resultados para evitar puntos calientes ([§3.2.5](#s3-2-5)). En el pico, Zanzibar gestiona 22 millones de RPC internas “delegadas” por segundo, repartidas aproximadamente a partes iguales entre lecturas y comprobaciones. La caché en memoria gestiona aproximadamente 200 millones de búsquedas por segundo en el pico, 150 millones procedentes de comprobaciones y 50 millones procedentes de lecturas. La caché de las comprobaciones tiene una tasa de aciertos del 10% en el lado del delegado, con un 12% adicional ahorrado gracias a la tabla de bloqueos. Por su parte, la caché en el lado del delegante tiene una tasa de aciertos del 2%, con un 3% adicional procedente de la tabla de bloqueos. Aunque estas tasas de aciertos parecen bajas, evitan que 500K RPC internas por segundo creen puntos calientes."
  s4-4-p2:
    text: "Las lecturas delegadas presentan tasas de aciertos más altas en el lado del delegado (un 24% en la caché y un 9% en la tabla de bloqueos), pero la caché del delegante acierta menos del 1% de las veces. Para los grupos extremadamente calientes, Zanzibar optimiza aún más leyendo y almacenando en caché por adelantado el conjunto completo de miembros; esto ocurre con el 0.1% de los grupos, pero evita aún más puntos calientes."
  s4-4-p3:
    text: "Esta caché, junto con una agrupación agresiva de las solicitudes de lectura, permite a Zanzibar emitir solo 20 millones de RPC de lectura por segundo a Spanner. La mediana de estas solicitudes lee 1.5 filas por RPC, pero en el percentil 99 cada una lee cerca de mil filas."
  s4-4-p4:
    text: "Las lecturas de Zanzibar en Spanner tardan 0.5 ms en la mediana y 2 ms en el percentil 95. Observamos que el 1% de las lecturas de Spanner, es decir, 200K lecturas por segundo, se benefician de las solicitudes de cobertura. Señalamos que Zanzibar utiliza una instancia de Spanner que se ejecuta internamente en Google, no una instancia de Cloud Spanner [[6](#ref-6)]."
  s4-4-p5:
    text: "El índice Leopard realiza 1.56M QPS en la mediana, o 2.22M QPS en el percentil 99, según datos agregados a lo largo de 7 días. Durante esos mismos 7 días, los servidores de Leopard responden en menos de 150 μs en la mediana, o en menos de 1 ms en el percentil 99. La capa incremental de Leopard escribe durante esos 7 días aproximadamente 500 actualizaciones del índice por segundo en la mediana, y aproximadamente 1.5K actualizaciones por segundo en el percentil 99."
  s4-5:
    text: "Lecciones aprendidas"
  s4-5-p1:
    text: "Zanzibar ha evolucionado para satisfacer las demandas variadas e intensas de un conjunto creciente de clientes, entre ellos Google Calendar, Google Cloud, Google Drive, Google Maps, Google Photos y YouTube. Esta sección destaca las lecciones aprendidas de esta experiencia."
  s4-5-p2:
    text: "Un tema recurrente ha sido la importancia de la flexibilidad para adaptarse a las diferencias entre clientes. Por ejemplo:"
  s4-5-flex:
    items:
      - "*Los patrones de control de acceso varían ampliamente:* con el tiempo hemos añadido características para dar soporte a clientes concretos. Por ejemplo, añadimos `computed_userset` para permitir inferir el ID del propietario de un objeto a partir del prefijo del ID del objeto, lo que reduce los requisitos de espacio de clientes como Drive y Photos, que gestionan muchos objetos privados. Del mismo modo, añadimos `tuple_to_userset` para representar la jerarquía de objetos con una sola tupla de relación por salto. Los beneficios son tanto la reducción de espacio como la flexibilidad: permite a clientes como Cloud tanto expresar la herencia de ACL de forma compacta como cambiar las reglas de herencia de ACL sin tener que actualizar grandes cantidades de tuplas. Véase [§2.3.1](#s2-3-1)."
      - "*Los requisitos de frescura suelen ser laxos, pero no siempre:* los clientes a menudo admiten una desactualización moderada y no especificada durante la evaluación de las ACL, pero a veces requieren una frescura especificada con más precisión. Diseñamos nuestro protocolo de zookies en torno a esta propiedad, de modo que podamos servir la mayoría de las solicitudes a partir de una instantánea predeterminada ya replicada, permitiendo al mismo tiempo que los clientes acoten la desactualización cuando sea necesario. También ajustamos la granularidad de nuestras marcas de tiempo de instantánea para adecuarla a los requisitos de frescura de los clientes. Los cuantos gruesos de marca de tiempo resultantes nos permiten realizar la mayoría de las comprobaciones de autorización sobre un número reducido de instantáneas, lo que reduce en gran medida la frecuencia de las lecturas de la base de datos. Véase [§3.2.1](#s3-2-1)."
  s4-5-p3:
    text: "Otro tema ha sido la necesidad de añadir optimizaciones de rendimiento para dar soporte a los comportamientos de los clientes observados en producción. Por ejemplo:"
  s4-5-perf:
    items:
      - "*Las solicitudes de cobertura son clave para reducir la latencia de cola:* los clientes que ofrecen capacidades de búsqueda a sus usuarios, como Drive, emiten a menudo de decenas a cientos de comprobaciones de autorización para servir un único conjunto de resultados de búsqueda. Introdujimos las solicitudes de cobertura para las solicitudes a Spanner y a Leopard con el fin de evitar que una operación lenta ocasional ralentice la interacción global del usuario. Véase [§3.2.7](#s3-2-7)."
      - "*La mitigación de los puntos calientes es crítica para la alta disponibilidad:* algunas cargas de trabajo crean puntos calientes en los datos de las ACL que pueden desbordar los servidores de bases de datos subyacentes. Un patrón habitual es una ráfaga de comprobaciones de ACL para un objeto al que hacen referencia indirectamente las ACL de muchos objetos distintos. Surgen casos concretos del caso de uso de búsqueda mencionado anteriormente, donde los documentos de la búsqueda comparten indirectamente las ACL de un gran grupo social o de trabajo, y de los casos de uso de Cloud, donde muchos objetos comparten indirectamente las ACL de un mismo objeto situado en lo alto de una jerarquía. Zanzibar gestiona la mayoría de los puntos calientes con mecanismos generales como su caché distribuida y su tabla de bloqueos, pero hemos visto la necesidad de optimizar casos de uso concretos. Por ejemplo, añadimos la precarga en caché de todas las tuplas de relación de un objeto caliente. También retrasamos la cancelación de las comprobaciones de ACL secundarias cuando hay solicitudes concurrentes para los mismos datos de ACL. Véase [§3.2.5](#s3-2-5)."
      - "*El aislamiento de rendimiento es indispensable para protegerse de los clientes que se comportan mal:* incluso con medidas de mitigación de los puntos calientes, comportamientos inesperados, y a veces no intencionados, de los clientes podrían seguir sobrecargando nuestro sistema o su infraestructura subyacente. Algunos ejemplos son los casos en que los clientes lanzan nuevas funcionalidades que resultan inesperadamente populares o utilizan Zanzibar de formas no previstas. Con el tiempo, hemos añadido salvaguardas de aislamiento para garantizar que no se produzcan fallos en cascada entre clientes ni entre objetos de un mismo cliente. Estas salvaguardas incluyen una contabilidad de costes de grano fino, cuotas y limitación de la tasa de solicitudes. Véase [§3.2.6](#s3-2-6)."
  s5:
    text: "Trabajo relacionado"
  s5-p1:
    text: "Zanzibar es un sistema distribuido de almacenamiento y evaluación de ACL a escala planetaria. Muchos de sus conceptos de autorización se han explorado previamente en los ámbitos del control de acceso y de los grafos sociales, y sus desafíos de escalabilidad se han investigado en el campo de los sistemas distribuidos."
  s5-p2:
    text: "El control de acceso es una parte central de los sistemas operativos multiusuario. Multics [[23](#ref-23)] admite ACL sobre segmentos y directorios. Las entradas de las ACL constan de un identificador de principal y de un conjunto de bits de permisos. En la primera edición de UNIX [[9](#ref-9)], unos indicadores de archivo señalan si el propietario y quienes no son propietarios pueden leer o escribir el archivo. Para la 4.ª edición, los bits de permisos se habían ampliado a bits de lectura/escritura/ejecución para el propietario, el grupo y los demás. Las ACL de POSIX [[4](#ref-4)] añaden una lista arbitraria de usuarios y grupos, cada uno con hasta 32 bits de permisos. VMS [[7](#ref-7), [8](#ref-8)] admite la herencia de ACL para los archivos creados dentro de un árbol de directorios. El modelo de datos de Zanzibar admite permisos, usuarios, grupos y herencia tal como se encuentran en los sistemas anteriores."
  s5-p3:
    text: "Taos [[24](#ref-24), [10](#ref-10)] admite principales compuestos que incorporan cómo se ha transformado una identidad a medida que atraviesa un sistema distribuido. Por ejemplo, si el usuario $U$ iniciara sesión en la estación de trabajo $W$ para acceder al servidor de archivos $S$, $S$ vería solicitudes autenticadas como “$W$ en nombre de $U$” en lugar de simplemente $U$. Esto permitiría escribir una ACL sobre el correo electrónico de un usuario que solo fuera accesible para ese usuario, y solo si se accede a través del servidor de correo. Abadi et al. analizan en [[11](#ref-11)] un modelo de ACL basadas en grupos con soporte para identidades compuestas. Su noción de “blessings” es similar a las tuplas de Zanzibar. Sin embargo, Zanzibar adopta una representación unificada de las ACL y los grupos mediante usersets, mientras que en [[11](#ref-11)] son conceptos separados."
  s5-p4:
    text: "El control de acceso basado en roles (RBAC), propuesto por primera vez en [[17](#ref-17)], introdujo la noción de roles, que son similares a las relaciones de Zanzibar. Los roles pueden heredar unos de otros e implicar permisos. Varios clientes de Zanzibar han implementado políticas RBAC sobre el lenguaje de configuración de espacios de nombres de Zanzibar."
  s5-p5:
    text: "Un análisis de los almacenes de ACL en 2019 sería incompleto sin mencionar los sistemas de gestión de identidades y accesos (IAM) ofrecidos comercialmente por Amazon [[1](#ref-1)], Google [[5](#ref-5)], Microsoft [[2](#ref-2)] y otros. Estos sistemas permiten a los clientes de los productos en la nube de esas empresas configurar controles de acceso flexibles basados en diversas características, como: la asignación de usuarios a roles o grupos; lenguajes de políticas específicos del dominio; y API que permiten la creación y modificación de ACL. Lo que todos estos sistemas tienen en común es un almacenamiento unificado de ACL y una API basada en RPC, una filosofía también central en el diseño de Zanzibar. El sistema Cloud IAM de Google [[5](#ref-5)] está construido como una capa sobre el sistema de almacenamiento y evaluación de ACL de Zanzibar."
  s5-p6:
    text: "TAO [[13](#ref-13)] es un almacén de datos distribuido para el grafo social de Facebook. Varios clientes de Zanzibar también utilizan Zanzibar para almacenar sus grafos sociales. Tanto Zanzibar como TAO proporcionan comprobaciones de autorización a los clientes. Ambos se despliegan como servicios de instancia única, ambos operan a gran escala y ambos están optimizados para operaciones de solo lectura. TAO ofrece consistencia global eventual con replicación asíncrona y consistencia de lectura tras escritura en la medida de lo posible (best-effort) con actualizaciones síncronas de la caché. En cambio, Zanzibar proporciona consistencia externa y lecturas de instantánea con desactualización acotada, de modo que respeta el orden causal entre las actualizaciones de ACL y de contenido y, por tanto, protege frente al problema del “nuevo enemigo”."
  s5-p7:
    text: "Los relojes de Lamport [[22](#ref-22)] proporcionan marcas de tiempo vectoriales parcialmente ordenadas que pueden utilizarse para determinar el orden de los eventos. Sin embargo, los relojes de Lamport requieren la participación explícita de todos los “procesos”, mientras que en los casos de uso de Zanzibar algunos de los “procesos” pueden ser clientes externos o incluso usuarios humanos. En cambio, Zanzibar se apoya en su sistema de base de datos subyacente, Spanner [[15](#ref-15)], para ofrecer tanto consistencia externa como lecturas de instantánea con desactualización acotada. En particular, Zanzibar se basa en la abstracción TrueTime de Spanner [[15](#ref-15)] para proporcionar marcas de tiempo de confirmación linealizables codificadas como zookies."
  s5-p8:
    text: "Al mismo tiempo, Zanzibar añade varias características a las que proporciona Spanner. Por un lado, el protocolo de zookies *no* permite a los clientes leer o evaluar ACL en una instantánea arbitraria. Esta restricción permite a Zanzibar elegir una instantánea que facilite una evaluación rápida de las ACL. Además, Zanzibar proporciona resiliencia frente a los puntos calientes de la base de datos (p. ej., comprobaciones de autorización sobre un vídeo que se vuelve popular de repente) y una persecución de punteros segura a pesar de una recursión potencialmente profunda (p. ej., comprobaciones de pertenencia en grupos jerárquicos)."
  s5-p9:
    text: "El servicio de bloqueo distribuido Chubby [[14](#ref-14)] ofrece almacenamiento fiable, linealiza las escrituras y proporciona control de acceso, pero carece de características necesarias para dar soporte a los casos de uso de Zanzibar. En particular, no admite grandes volúmenes de datos, lecturas de rangos eficientes ni lecturas en una instantánea especificada por el cliente con desactualización acotada. Su mecanismo de invalidación de la caché también limita su rendimiento de escritura."
  s5-p10:
    text: "Por último, ZooKeeper ofrece un servicio de coordinación de alto rendimiento [[19](#ref-19)], pero también carece de características requeridas por Zanzibar. En comparación con Chubby, puede gestionar tasas de lectura y escritura más altas con una consistencia de caché más relajada. Sin embargo, no proporciona consistencia externa para las actualizaciones entre nodos distintos, ya que su linealizabilidad se da nodo por nodo. Tampoco proporciona lecturas de instantánea con desactualización acotada."
  s6:
    text: "Conclusión"
  s6-p1:
    text: "El sistema de autorización Zanzibar unifica los datos y la lógica de control de acceso de Google. Su modelo de datos y su lenguaje de configuración, sencillos pero flexibles, admiten una variedad de políticas de control de acceso tanto de aplicaciones de consumo como empresariales."
  s6-p2:
    text: "El modelo de consistencia externa de Zanzibar es una de sus características más destacadas. Respeta el orden de las acciones de los usuarios y, al mismo tiempo, permite evaluar las comprobaciones de autorización en ubicaciones distribuidas sin sincronización global."
  s6-p3:
    text: "Zanzibar emplea otras técnicas clave para proporcionar escalabilidad, baja latencia y alta disponibilidad. Por ejemplo, evalúa la pertenencia a grupos anidados en profundidad o en anchura con Leopard, un índice especializado para el cálculo eficiente de operaciones de conjuntos con consistencia de instantánea. Como otro ejemplo, combina una caché distribuida con un mecanismo para deduplicar las solicitudes en curso. De este modo mitiga los puntos calientes, un problema crítico en producción cuando se sirven datos sobre un almacenamiento normalizado y consistente. En conjunto, estas medidas dan como resultado un sistema que escala a billones de reglas de control de acceso y millones de solicitudes de autorización por segundo."
  s7:
    text: "Agradecimientos"
  s7-p1:
    text: "Muchas personas han realizado contribuciones técnicas a Zanzibar. Damos las gracias a los miembros anteriores y recientes del equipo de desarrollo, entre ellos Dan Barella, Miles Chaston, Daria Jung, Alex Mendes da Costa, Xin Pan, Scott Smith, Matthew Steffen, Riva Tropp y Yuliya Zabiyaka. También damos las gracias a los miembros anteriores y actuales del equipo de Site Reliability Engineering, entre ellos Randall Bosetti, Hannes Eder, Robert Geisberger, Tom Li, Massimo Maggi, Igor Oks, Aaron Peterson y Andrea Yu."
  s7-p2:
    text: "Además, varias personas han ayudado a mejorar este artículo. Recibimos comentarios perspicaces de David Bacon, Carolin Gäthke, Brad Krueger, Ari Shamash, Kai Shen y Lawrence You. También estamos agradecidos a Nadav Eiron y Royal Hansen por su apoyo. Por último, damos las gracias a los revisores anónimos y a nuestro revisor guía (shepherd), Eric Eide, por sus comentarios constructivos."
