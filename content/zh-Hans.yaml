  s4-3:
    text: "可用性"
  s4-3-p1:
    text: "我们将可用性定义为服务在延迟阈值内成功应答的“合格”RPC 所占的比例：Safe 请求的阈值为 5 秒，Recent 请求的阈值为 15 秒，因为 Spanner 中的领导者重新选举可能需要长达 10 秒。一个 RPC 要成为合格的，请求必须格式正确，且其截止时间长于延迟阈值。此外，客户端必须保持在其资源配额之内。"
  s4-3-p2:
    text: "由于这些原因，我们无法直接用实时流量来测量可用性，因为我们的客户端有时会发送截止时间很短的 RPC，或取消正在进行的 RPC。取而代之的是，我们从实时流量中抽取一小部分有效请求作为样本，随后用我们自己的探测器（prober）重放这些请求。重放请求时，我们将超时时间设置为长于可用性阈值。如果请求指定了 zookie，我们还会对其进行调整，使 zookie 的相对年龄与该请求在实时流量中被接收时保持一致。最后，我们在每个集群上运行 3 个探测器，并排除离群值，以消除由罕见的探测器故障引起的误报。"
  s4-3-p3:
    text: "为计算可用性，我们以 90 天为窗口汇总成功率，并在各集群之间取平均。[图 5](#fig-5) 展示了由这些探测器测得的 Zanzibar 可用性。在 Google 过去 3 年的运营中，可用性始终保持在 99.999% 以上。换言之，每个季度 Zanzibar 的全局停机时间不足 2 分钟，全局错误率超过 10% 的时间不足 13 分钟。"
  fig-5:
    alt: "2015 年 12 月至 2018 年 12 月 Safe 和 Recent 请求可用性的折线图。两者几乎始终处于 99.9995% 到 100% 之间，远高于 99.999% 的虚线。"
    caption: "图 5：过去三年中，Zanzibar 的可用性始终保持在 99.999% 以上。"
  s4-4:
    text: "内部机制"
  s4-4-p1:
    text: "Zanzibar 服务器基于一致性哈希相互委托检查和读取，被委托操作的调用方和被调用方都会缓存结果，以防止热点（[§3.2.5](#s3-2-5)）。在峰值时，Zanzibar 每秒处理 2,200 万次内部“委托”RPC，读取和检查大约各占一半。在峰值时，内存缓存每秒处理约 2 亿次查找，其中 1.5 亿次来自检查，5,000 万次来自读取。检查的缓存在被委托方一侧的命中率为 10%，另有 12% 由锁表节省。与此同时，委托方一侧的缓存命中率为 2%，另有 3% 来自锁表。尽管这些命中率看起来很低，但它们阻止了每秒 50 万次内部 RPC 形成热点。"
  s4-4-p2:
    text: "被委托的读取在被委托方一侧具有更高的命中率——缓存为 24%，锁表为 9%——但委托方的缓存命中率不到 1%。对于超热门的组，Zanzibar 会进一步优化，提前读取并缓存完整的成员集合——这种情况只发生在 0.1% 的组上，但进一步防止了热点。"
  s4-4-p3:
    text: "这种缓存再加上对读取请求的积极池化，使 Zanzibar 每秒只需向 Spanner 发出 2,000 万次读取 RPC。这些请求每个 RPC 读取行数的中位数为 1.5 行，但在第 99 百分位上，每个请求读取近 1,000 行。"
  s4-4-p4:
    text: "Zanzibar 的 Spanner 读取在中位数上耗时 0.5 毫秒，在第 95 百分位上耗时 2 毫秒。我们发现，1% 的 Spanner 读取（即每秒 20 万次读取）从对冲中受益。需要指出的是，Zanzibar 使用的是在 Google 内部运行的 Spanner 实例，而不是 Cloud Spanner [[6](#ref-6)] 的实例。"
  s4-4-p5:
    text: "基于 7 天汇总的数据，Leopard 索引在中位数上处理 1.56M QPS，在第 99 百分位上处理 2.22M QPS。在同样的 7 天内，Leopard 服务器在中位数上的响应时间不到 150 微秒，在第 99 百分位上不到 1 毫秒。在这 7 天中，Leopard 的增量层在中位数上每秒写入约 500 次索引更新，在第 99 百分位上每秒写入约 1.5K 次更新。"
  s4-5:
    text: "经验教训"
  s4-5-p1:
    text: "Zanzibar 不断演进，以满足日益增多的客户端的多样且繁重的需求，这些客户端包括 Google Calendar、Google Cloud、Google Drive、Google Maps、Google Photos 和 YouTube。本节着重介绍从这些经历中获得的经验教训。"
  s4-5-p2:
    text: "一个共同的主题是灵活性对于适应客户端之间差异的重要性。例如："
  s4-5-flex:
    items:
      - "*访问控制模式差异很大：*随着时间推移，我们增加了一些特性来支持特定的客户端。例如，我们增加了 `computed_userset`，以便根据对象 ID 前缀推断对象的所有者 ID，这降低了 Drive 和 Photos 等管理大量私有对象的客户端的空间需求。类似地，我们增加了 `tuple_to_userset`，使每一跳只需一个关系元组即可表示对象层级结构。其好处既在于节省空间，也在于灵活性——它使 Cloud 等客户端既能紧凑地表达 ACL 继承，又能在无需更新大量元组的情况下更改 ACL 继承规则。参见 [§2.3.1](#s2-3-1)。"
      - "*新鲜度要求通常（但并非总是）较为宽松：*客户端在 ACL 评估期间通常允许未指定的、适度的陈旧度，但有时也需要更精确指定的新鲜度。我们围绕这一特性设计了 zookie 协议，使我们能够从默认的、已复制的快照中处理大多数请求，同时允许客户端在需要时限定陈旧度。我们还调整了快照时间戳的粒度，以匹配客户端的新鲜度要求。由此得到的粗粒度时间戳量子使我们能够在少量快照上执行大多数授权检查，从而大大降低了数据库读取的频率。参见 [§3.2.1](#s3-2-1)。"
  s4-5-p3:
    text: "另一个主题是需要增加性能优化，以支持在生产环境中观察到的客户端行为。例如："
  s4-5-perf:
    items:
      - "*请求对冲是降低尾延迟的关键：*向其用户提供搜索功能的客户端（例如 Drive）为提供一组搜索结果，往往需要发出数十到数百次授权检查。我们引入了对 Spanner 和 Leopard 请求的对冲，以防止偶发的慢操作拖慢整体用户交互。参见 [§3.2.7](#s3-2-7)。"
      - "*热点缓解对于高可用性至关重要：*某些工作负载会在 ACL 数据中造成热点，可能压垮底层数据库服务器。一种常见模式是针对某个对象的 ACL 检查突发，而该对象被许多不同对象的 ACL 间接引用。具体实例出现在上文提到的搜索用例中（搜索中的文档间接共享某个大型社交群组或工作组的 ACL），以及 Cloud 用例中（许多对象间接共享层级结构中较高位置的同一对象的 ACL）。Zanzibar 通过其分布式缓存和锁表等通用机制处理大多数热点，但我们发现仍需针对特定用例进行优化。例如，我们增加了对热门对象所有关系元组的缓存预取。当存在针对同一 ACL 数据的并发请求时，我们还会推迟取消次级 ACL 检查。参见 [§3.2.5](#s3-2-5)。"
      - "*性能隔离对于防范行为异常的客户端不可或缺：*即使有热点缓解措施，客户端意外的、有时甚至是无意的行为仍可能使我们的系统或其底层基础设施过载。例子包括客户端推出意外受欢迎的新功能，或以非预期的方式使用 Zanzibar。随着时间推移，我们增加了隔离保护措施，以确保客户端之间或同一客户端的对象之间不会发生级联故障。这些保护措施包括细粒度的成本核算、配额和限流。参见 [§3.2.6](#s3-2-6)。"
  s5:
    text: "相关工作"
  s5-p1:
    text: "Zanzibar 是一个行星级的分布式 ACL 存储与评估系统。它的许多授权概念此前已在访问控制和社交图谱领域中得到探讨，其扩展性挑战也已在分布式系统领域中得到研究。"
  s5-p2:
    text: "访问控制是多用户操作系统的核心组成部分。Multics [[23](#ref-23)] 支持针对段和目录的 ACL。ACL 条目由一个主体标识符和一组权限位组成。在 UNIX 第一版 [[9](#ref-9)] 中，文件标志指示所有者和非所有者能否读取或写入文件。到第 4 版时，权限位已扩展为针对所有者、组和其他用户的读/写/执行位。POSIX ACL [[4](#ref-4)] 增加了任意的用户和组列表，每个用户或组最多可有 32 个权限位。VMS [[7](#ref-7), [8](#ref-8)] 支持对在目录树中创建的文件进行 ACL 继承。Zanzibar 的数据模型支持上述系统中的权限、用户、组和继承。"
  s5-p3:
    text: "Taos [[24](#ref-24), [10](#ref-10)] 支持复合主体，用以体现身份在穿过分布式系统时所经历的变换。例如，如果用户 $U$ 登录工作站 $W$ 来访问文件服务器 $S$，$S$ 看到的请求将被认证为“$W$ 代表 $U$”，而不仅仅是 $U$。这使得人们可以为用户的电子邮件编写一条 ACL，使其只能由该用户访问，且只能经由邮件服务器访问。Abadi 等人在 [[11](#ref-11)] 中讨论了一种支持复合身份的基于组的 ACL 模型。他们的“blessings”概念与 Zanzibar 元组类似。然而，Zanzibar 使用用户集对 ACL 和组采用统一的表示，而在 [[11](#ref-11)] 中二者是相互独立的概念。"
  s5-p4:
    text: "基于角色的访问控制（RBAC）最早在 [[17](#ref-17)] 中提出，引入了角色的概念，角色与 Zanzibar 的关系类似。角色之间可以相互继承，并蕴含权限。许多 Zanzibar 客户端已在 Zanzibar 的命名空间配置语言之上实现了 RBAC 策略。"
  s5-p5:
    text: "在 2019 年讨论 ACL 存储，就不能不提及 Amazon [[1](#ref-1)]、Google [[5](#ref-5)]、Microsoft [[2](#ref-2)] 等公司商业化提供的身份与访问管理（IAM）系统。这些系统允许这些公司云产品的客户基于多种特性配置灵活的访问控制，例如：将用户分配到角色或组；特定领域的策略语言；以及允许创建和修改 ACL 的 API。所有这些系统的共同之处在于统一的 ACL 存储和基于 RPC 的 API，这一理念也是 Zanzibar 设计的核心。Google 的 Cloud IAM 系统 [[5](#ref-5)] 是作为 Zanzibar 的 ACL 存储与评估系统之上的一层构建的。"
  s5-p6:
    text: "TAO [[13](#ref-13)] 是用于 Facebook 社交图谱的分布式数据存储。一些 Zanzibar 客户端也使用 Zanzibar 来存储其社交图谱。Zanzibar 和 TAO 都为客户端提供授权检查。二者都以单实例服务的形式部署，都以大规模运行，且都针对只读操作进行了优化。TAO 通过异步复制提供最终全局一致性，并通过同步缓存更新提供尽力而为的写后读一致性。相比之下，Zanzibar 提供外部一致性和有界陈旧度的快照读，从而遵循 ACL 更新与内容更新之间的因果顺序，并由此防范“new enemy”问题。"
  s5-p7:
    text: "Lamport 时钟 [[22](#ref-22)] 提供偏序的向量时间戳，可用于确定事件的顺序。然而，Lamport 时钟要求所有“进程”显式参与，而在 Zanzibar 的用例中，某些“进程”可能是外部客户端，甚至是人类用户。相比之下，Zanzibar 依赖其底层数据库系统 Spanner [[15](#ref-15)] 来同时提供外部一致性和有界陈旧度的快照读。特别地，Zanzibar 基于 Spanner 的 TrueTime 抽象 [[15](#ref-15)] 构建，以提供编码为 zookie 的可线性化提交时间戳。"
  s5-p8:
    text: "与此同时，Zanzibar 在 Spanner 所提供功能的基础上增加了许多特性。其一，zookie 协议*不*允许客户端在任意快照上读取或评估 ACL。这一限制使 Zanzibar 能够选择有利于快速评估 ACL 的快照。此外，Zanzibar 还提供了对数据库热点（例如针对突然走红的视频的授权检查）的韧性，以及在可能深度递归的情况下仍然安全的指针追逐（例如针对层级组的成员关系检查）。"
  s5-p9:
    text: "Chubby 分布式锁服务 [[14](#ref-14)] 提供可靠的存储、对写入进行线性化，并提供访问控制，但它缺少支持 Zanzibar 用例所需的特性。具体而言，它不支持大数据量、高效的范围读取，也不支持在客户端指定的快照上进行有界陈旧度的读取。其缓存失效机制也限制了它的写入吞吐量。"
  s5-p10:
    text: "最后，ZooKeeper 提供了高性能的协调服务 [[19](#ref-19)]，但同样缺少 Zanzibar 所需的特性。与 Chubby 相比，它能以更宽松的缓存一致性处理更高的读写速率。然而，由于它的可线性化是按节点保证的，它并不为跨不同节点的更新提供外部一致性。它也不提供有界陈旧度的快照读。"
  s6:
    text: "结论"
  s6-p1:
    text: "Zanzibar 授权系统为 Google 统一了访问控制数据和逻辑。其简单而灵活的数据模型和配置语言支持来自消费级和企业级应用的各种访问控制策略。"
  s6-p2:
    text: "Zanzibar 的外部一致性模型是其最突出的特性之一。它遵循用户操作的顺序，同时又允许在分布式位置评估授权检查，而无需全局同步。"
  s6-p3:
    text: "Zanzibar 还采用了其他关键技术来提供可扩展性、低延迟和高可用性。例如，它使用 Leopard 评估深度或广度嵌套的组成员关系，Leopard 是一种专用索引，能够以快照一致性高效地计算集合运算。又如，它将分布式缓存与对进行中的请求去重的机制相结合，从而缓解了热点问题，而这是在规范化的一致性存储之上提供数据服务时一个关键的生产问题。这些措施共同造就了一个可扩展至数万亿条访问控制规则和每秒数百万次授权请求的系统。"
  s7:
    text: "致谢"
  s7-p1:
    text: "许多人为 Zanzibar 做出了技术贡献。我们感谢开发团队的前任和现任成员，包括 Dan Barella、Miles Chaston、Daria Jung、Alex Mendes da Costa、Xin Pan、Scott Smith、Matthew Steffen、Riva Tropp 和 Yuliya Zabiyaka。我们还感谢站点可靠性工程（Site Reliability Engineering）团队的前任和现任成员，包括 Randall Bosetti、Hannes Eder、Robert Geisberger、Tom Li、Massimo Maggi、Igor Oks、Aaron Peterson 和 Andrea Yu。"
  s7-p2:
    text: "此外，许多人帮助改进了本文。我们收到了 David Bacon、Carolin Gäthke、Brad Krueger、Ari Shamash、Kai Shen 和 Lawrence You 富有见地的意见。我们也感谢 Nadav Eiron 和 Royal Hansen 的支持。最后，我们感谢匿名审稿人以及我们的论文指导人（shepherd）Eric Eide 提出的建设性反馈。"
