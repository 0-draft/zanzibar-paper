# zh-Hans translation of content/en.yaml. Translate the values; keep ids, keys and order.
lang: zh-Hans
meta:
  title: "Zanzibar：Google 的一致性全球授权系统"
blocks:
  author-note:
    text: "本工作完成于作者在 Google 任职期间。"
  abstract:
    text: "摘要"
  abstract-p1:
    text: "判定在线用户是否有权访问数字对象，是保护隐私的核心。本文介绍 Zanzibar 的设计、实现与部署。Zanzibar 是一个用于存储和评估访问控制列表的全球性系统，它提供统一的数据模型和配置语言，用于表达来自 Google 数百个客户端服务（包括 Calendar、Cloud、Drive、Maps、Photos 和 YouTube）的各类访问控制策略。其授权决策遵循用户操作的因果顺序，因而在访问控制列表和对象内容发生变化时仍能提供外部一致性。Zanzibar 可扩展至数万亿条访问控制列表和每秒数百万次授权请求，支撑着数十亿人使用的服务。在 3 年多的生产使用中，它始终保持第 95 百分位延迟低于 10 毫秒、可用性高于 99.999%。"
  s1:
    text: "引言"
  s1-p1:
    text: "许多在线交互都需要进行授权检查，以确认用户有权对某个数字对象执行某项操作。例如，基于 Web 的照片存储服务通常允许照片所有者将部分照片分享给朋友，同时将其他照片设为私密。此类服务在允许某个用户查看照片之前，必须检查该照片是否已分享给该用户。健壮的授权检查是保护在线隐私的核心。"
  s1-p2:
    text: "本文介绍 Zanzibar，一个用于存储权限并基于所存储的权限执行授权检查的系统。Google 提供的众多服务都在使用它，包括 Calendar、Cloud、Drive、Maps、Photos 和 YouTube。其中有若干服务代表超过十亿用户管理着数十亿个对象。"
  s1-p3:
    text: "与为各个应用分别维护独立的访问控制机制相比，统一的授权系统具有重要优势。第一，它有助于在各应用之间建立一致的语义和用户体验。第二，它使应用之间更易于互操作，例如当一个应用的对象嵌入另一个应用的对象时协调二者的访问控制。第三，可以在统一的访问控制系统之上构建有用的公共基础设施，特别是遵循访问控制且跨应用工作的搜索索引。最后，正如下文所示，授权在数据一致性和可扩展性方面带来了独特的挑战。跨应用一次性解决这些挑战可以节省工程资源。"
  s1-p4:
    text: "我们为 Zanzibar 系统设定了以下目标："
  s1-goals:
    items:
      - "*正确性*：必须确保访问控制决策的一致性，以尊重用户意图。"
      - "*灵活性*：必须支持消费级和企业级应用所需的丰富访问控制策略。"
      - "*低延迟*：必须快速响应，因为授权检查往往处于用户交互的关键路径上。尾部的低延迟对于提供搜索结果尤为重要，因为搜索结果通常需要数十到数百次检查。"
      - "*高可用性*：必须可靠地响应请求，因为在缺乏明确授权的情况下，客户端服务将被迫拒绝其用户的访问。"
      - "*大规模*：需要保护由数十亿用户共享的数十亿个对象。必须在全球范围内部署，以靠近其客户端及其终端用户。"
  s1-p5:
    text: "Zanzibar 通过结合多项显著特性来实现这些目标。为提供灵活性，Zanzibar 将简单的数据模型与强大的配置语言相结合。该语言允许客户端定义用户与对象之间的任意关系，例如 `owner`、`editor`、`commenter` 和 `viewer`。它包含交集、并集等集合代数运算符，用于基于这些用户—对象关系来指定可能较为复杂的访问控制策略。例如，应用可以规定被授予文档编辑权的用户也可以对该文档发表评论，但并非所有评论者都被授予编辑权。"
  s1-p6:
    text: "在运行时，Zanzibar 允许客户端通过远程过程调用（RPC）接口创建、修改和评估访问控制列表（ACL）。简单的 ACL 形如“用户 *U* 与对象 *O* 具有关系 *R*”。更复杂的 ACL 形如“用户集合 *S* 与对象 *O* 具有关系 *R*”，其中 *S* 本身又通过另一个对象—关系对来指定。因此 ACL 可以引用其他 ACL，例如规定可以评论某个视频的用户集合由已被授予该视频观看权的用户以及拥有该视频频道观看权限的用户共同组成。"
  s1-p7:
    text: "组成员关系是一类重要的 ACL，其中对象是一个组，关系在语义上等同于 `member`。组可以包含其他组，这体现了 Zanzibar 面临的挑战之一：判断一个用户是否属于某个组，可能需要沿着一条很长的嵌套组成员关系链进行追溯。"
  s1-p8:
    text: "授权检查的形式为“用户 *U* 与对象 *O* 是否具有关系 *R*？”，并由一组分布式服务器进行评估。当检查请求到达 Zanzibar 时，评估该检查的工作可能会扇出到多台服务器，例如当某个组既包含个体成员又包含其他组时。这些服务器中的每一台又可能联系其他服务器，例如递归遍历组成员关系的层级结构。"
  s1-p9:
    text: "Zanzibar 在多个维度上以全球规模运行。它存储了超过两万亿条 ACL，每秒执行数百万次授权检查。ACL 数据不适合按地理位置进行分区，因为针对任何对象的授权检查都可能来自世界上任何地方。因此，Zanzibar 将所有 ACL 数据复制到数十个地理上分布的数据中心，并将负载分散到全球数千台服务器上。"
  s1-p10:
    text: "Zanzibar 通过两个相互关联的特性来支持访问控制决策的全局一致性。其一，它遵循 ACL 变更提交到底层数据存储的顺序。其二，它能够确保授权检查所基于的 ACL 数据不早于客户端指定的某次变更。因此，例如，客户端可以将某个用户从组中移除，并确信后续的成员关系检查会反映这一移除。Zanzibar 通过将 ACL 存储在具有外部一致性保证的全球分布式数据库系统中来提供这些顺序性质 [[15](#ref-15), [18](#ref-18)]。"
  s1-p11:
    text: "Zanzibar 采用一系列技术，在这种全球分布式环境中实现低延迟和高可用性。其一致性协议使绝大多数请求能够使用本地复制的数据来处理，而无需跨区域往返。为保证一致性，Zanzibar 以规范化形式存储数据。它通过缓存最终结果和中间结果，以及对同时到达的请求进行去重，来处理规范化数据上的热点。它还运用了请求对冲、以有限的反规范化优化深度嵌套集合上的计算等技术。Zanzibar 在 10 毫秒内响应了超过 95% 的授权检查，并在过去 3 年中保持了超过 99.999% 的可用性。"
  s1-p12:
    text: "本文的主要贡献在于阐述构建和部署一个一致的、全球规模的授权系统所面临的工程挑战。虽然 Zanzibar 设计中的大多数要素都源于先前的研究，但本文记录了 Zanzibar 为满足其在正确性、灵活性、延迟、可用性和可扩展性方面的严格要求而整合的各项特性与技术。本文还着重介绍了在为众多要求严苛的多样化客户端提供服务、运营 Zanzibar 的过程中获得的经验教训。"
  s2:
    text: "模型、语言与 API"
  s2-p1:
    text: "本节介绍 Zanzibar 的数据模型、配置语言和应用程序编程接口（API）。"
  s2-1:
    text: "关系元组"
  s2-1-p1:
    text: "在 Zanzibar 中，ACL 是对象—用户或对象—对象关系的集合，以*关系元组*的形式表示。组只是具有成员语义的 ACL。关系元组具有高效的二进制编码，但在本文中我们使用一种便捷的文本表示法来表示它们："
  s2-1-p2:
    text: "其中 ⟨*namespace*⟩ 和 ⟨*relation*⟩ 在客户端配置中预先定义（[§2.3](#s2-3)），⟨*object_id*⟩ 是一个字符串，⟨*user_id*⟩ 是一个整数。标识一个关系元组所需的主键为 ⟨*namespace*⟩、⟨*object_id*⟩、⟨*relation*⟩ 和 ⟨*user*⟩。值得注意的一个特性是，⟨*userset*⟩ 允许 ACL 引用组，从而支持表示嵌套的组成员关系。"
  s2-1-p3:
    text: "[表 1](#tab-1) 给出了一些示例元组及其对应语义。有些关系（例如 `viewer`）直接定义访问控制，而另一些关系（例如指向文件夹的 `parent`）仅定义对象之间的抽象关系。在命名空间配置中指定的用户集重写规则（[§2.3.1](#s2-3-1)）的作用下，这些抽象关系可能间接影响访问控制。"
  tab-1:
    header:
      - "文本表示法的示例元组"
      - "语义"
    rows:
      - - "`doc:readme#owner@10`"
        - "用户 10 是 `doc:readme` 的所有者"
      - - "`group:eng#member@11`"
        - "用户 11 是 `group:eng` 的成员"
      - - "`doc:readme#viewer@group:eng#member`"
        - "`group:eng` 的成员是 `doc:readme` 的查看者"
      - - "`doc:readme#parent@folder:A#...`"
        - "`doc:readme` 位于 `folder:A` 中"
    caption: "表 1：关系元组示例。“#...”表示一个不影响元组语义的关系。"
  s2-1-p4:
    text: "围绕元组而非按对象的 ACL 来定义数据模型，使我们能够统一 ACL 与组的概念，并支持高效的读取和增量更新，详见 [§2.4](#s2-4)。"
  s2-2:
    text: "一致性模型"
  s2-2-p1:
    text: "ACL 检查必须遵循用户修改 ACL 和对象内容的顺序，以避免出现意外的共享行为。具体而言，我们的客户端关心如何防止“new enemy”问题。当我们未能遵循 ACL 更新之间的顺序，或将旧的 ACL 应用于新的内容时，就可能出现该问题。考虑以下两个例子："
  s2-2-exa:
    title: "例 A：忽略 ACL 更新顺序"
    items:
      - "Alice 将 Bob 从某个文件夹的 ACL 中移除；"
      - "随后 Alice 请 Charlie 将新文档移入该文件夹，其中文档 ACL 继承自文件夹 ACL；"
      - "Bob 本不应能看到这些新文档，但如果 ACL 检查忽略了这两次 ACL 变更之间的顺序，他就可能看到。"
  s2-2-exb:
    title: "例 B：将旧 ACL 误用于新内容"
    items:
      - "Alice 将 Bob 从某个文档的 ACL 中移除；"
      - "随后 Alice 请 Charlie 向该文档添加新内容；"
      - "Bob 本不应能看到这些新内容，但如果 ACL 检查使用的是 Bob 被移除之前的陈旧 ACL 进行评估，他就可能看到。"
  s2-2-p2:
    text: "防止“new enemy”问题要求 Zanzibar 理解并遵循 ACL 更新或内容更新之间的因果顺序，包括针对不同 ACL 或对象的更新，以及通过 Zanzibar 不可见的渠道所协调的更新。因此，Zanzibar 必须提供两个关键的一致性性质：*外部一致性* [[18](#ref-18)] 和*有界陈旧度的快照读*。"
  s2-2-p3:
    text: "外部一致性使 Zanzibar 能够为每次 ACL 更新或内容更新分配一个时间戳，使得两个具有因果关系的更新 $x \\prec y$ 被分配的时间戳反映其因果顺序：$T_x < T_y$。有了具有因果意义的时间戳，在时间戳 $T$ 上对 ACL 数据库进行的快照读会观察到所有时间戳 $\\le T$ 的更新，从而遵循 ACL 更新之间的顺序。也就是说，如果该读取观察到了更新 $x$，那么它也会观察到所有在因果上先于 $x$ 发生的更新。"
  s2-2-p4:
    text: "此外，为避免将旧 ACL 应用于新内容，ACL 检查评估所用的快照不得比分配给内容更新的因果时间戳更陈旧。给定一次时间戳为 $T_c$ 的内容更新，在时间戳 $\\ge T_c$ 上进行的快照读可以确保 ACL 检查能够观察到所有在因果上先于该内容更新发生的 ACL 更新。"
  s2-2-p5:
    text: "为提供外部一致性和有界陈旧度的快照读，我们将 ACL 存储在 Spanner 全球数据库系统中 [[15](#ref-15)]。Spanner 的 TrueTime 机制为每次 ACL 写入分配一个微秒级精度的时间戳，使写入的时间戳反映写入之间的因果顺序，从而提供外部一致性。我们在单个快照时间戳上跨多次数据库读取来评估每次 ACL 检查，使得时间戳不晚于检查快照的所有写入（且仅有这些写入）对 ACL 检查可见。"
  s2-2-p6:
    text: "为避免使用陈旧的 ACL 来评估针对新内容的检查，一种做法是始终在最新快照上进行评估，使检查结果反映截至检查调用时的所有 ACL 写入。然而，这样的评估需要进行全局数据同步，带来高延迟的往返且可用性受限。为此，我们设计了以下协议，在 Zanzibar 客户端的配合下，使大多数检查能够在已复制的数据上进行评估："
  s2-2-protocol:
    items:
      - "Zanzibar 客户端在即将保存内容修改时，通过一次*内容变更* ACL 检查（[§2.4.4](#s2-4-4)），为每个内容版本请求一个称为 *zookie* 的不透明一致性令牌。Zanzibar 将当前的全局时间戳编码到 zookie 中，并确保所有先前的 ACL 写入都具有更低的时间戳。客户端在对客户端存储的一次原子写入中，将 zookie 与内容变更一起存储。注意，内容变更检查无需与应用内容修改在同一事务中进行评估，只需在用户修改内容时触发即可。"
      - "客户端在后续的 ACL 检查请求中发送该 zookie，以确保检查快照至少与该内容版本的时间戳一样新。"
  s2-2-p7:
    text: "外部一致性与以 zookie 为界的陈旧度快照读共同防止了“new enemy”问题。在例 A 中，ACL 更新 A1 和 A2 将分别被分配时间戳 $T_{A1} < T_{A2}$。Bob 将无法看到 Charlie 添加的新文档：如果检查在 $T < T_{A2}$ 上评估，文档 ACL 将不包含文件夹 ACL；如果检查在 $T \\ge T_{A2} > T_{A1}$ 上评估，检查将观察到更新 A1，而该更新已将 Bob 从文件夹 ACL 中移除。在例 B 中，Bob 将看不到添加到文档中的新内容。若要 Bob 看到新内容，检查必须使用 $\\ge T_{B2}$（即分配给该内容更新的时间戳）的 zookie 进行评估。由于 $T_{B2} > T_{B1}$，这样的检查也将观察到 ACL 更新 B1，而该更新已将 Bob 从 ACL 中移除。"
  s2-2-p8:
    text: "zookie 协议是 Zanzibar 一致性模型的关键特性。它确保 Zanzibar 遵循 ACL 更新与内容更新之间的因果顺序，而在其他方面则赋予 Zanzibar 选择评估时间戳的自由，以满足其延迟和可用性目标。这种自由源于该协议“至少一样新”的语义，使 Zanzibar 可以选择任何比 zookie 中编码的时间戳更新的时间戳。这种自由进而使 Zanzibar 能够以默认陈旧度、使用已复制的数据来处理大多数检查（[§3.2.1](#s3-2-1)），并对评估时间戳进行量化以避免热点（[§3.2.5](#s3-2-5)）。"
  s2-3:
    text: "命名空间配置"
  s2-3-p1:
    text: "在客户端能够将关系元组存储到 Zanzibar 之前，必须先配置其命名空间。命名空间配置指定其关系以及存储参数。每个关系都有一个名称（由客户端定义的字符串，例如 `viewer` 或 `editor`）和一个关系配置。存储参数包括分片设置和对象 ID 的编码方式，后者有助于 Zanzibar 针对整数、字符串及其他对象 ID 格式优化存储。"
  s2-3-1:
    text: "关系配置与用户集重写"
  s2-3-1-p1:
    text: "虽然关系元组反映了对象与用户之间的关系，但它们并不能完整地定义有效 ACL。例如，一些客户端规定，对每个对象拥有 `editor` 权限的用户也应当对同一对象拥有 `viewer` 权限。虽然这种关系之间的关系可以通过为每个对象存储一个关系元组来表示，但为命名空间中的每个对象都存储一个元组既浪费，又使得跨所有对象的修改变得困难。为此，我们允许客户端在关系配置中通过*用户集重写规则*来定义与具体对象无关的关系。[图 1](#fig-1) 展示了一个具有同心关系的简单命名空间配置，其中 `viewer` 包含 `editor`，`editor` 包含 `owner`。"
  fig-1:
    caption: "图 1：针对文档的具有同心关系的简单命名空间配置。所有所有者都是编辑者，所有编辑者都是查看者。此外，父文件夹的查看者也是该文档的查看者。"
  s2-3-1-p2:
    text: "用户集重写规则在命名空间中按关系定义。每条规则指定一个函数，该函数以对象 ID 为输入，输出一棵用户集表达式树。树的每个叶节点可以是以下任意一种："
  s2-3-1-leaves:
    items:
      - "`_this`：返回针对该 ⟨*object#relation*⟩ 对所存储的关系元组中的所有用户，包括由元组中的用户集所引用的间接 ACL。这是未指定重写规则时的默认行为。"
      - "`computed_userset`：为输入对象计算一个新的用户集。例如，这使得 `viewer` 关系的用户集表达式可以引用同一对象上的 `editor` 用户集，从而在关系之间提供 ACL 继承能力。"
      - "`tuple_to_userset`：根据输入对象计算一个元组集（[§2.4.1](#s2-4-1)），获取与该元组集匹配的关系元组，并从每个获取到的关系元组计算出一个用户集。这一灵活的原语使我们的客户端能够表达诸如“查找文档的父文件夹并继承其查看者”之类的复杂策略。"
  s2-3-1-p3:
    text: "用户集表达式也可以由多个子表达式组成，并通过并集、交集和排除等运算进行组合。"
  s2-4:
    text: "API"
  s2-4-p1:
    text: "除支持 ACL 检查之外，Zanzibar 还为客户端提供了用于读写关系元组、监听元组更新以及查看有效 ACL 的 API。"
  s2-4-p2:
    text: "贯穿这些 API 方法的一个概念是 *zookie*。zookie 是一个不透明的字节序列，编码了一个具有全局意义的时间戳，该时间戳反映一次 ACL 写入、一个客户端内容版本或一个读取快照。ACL 读取和检查请求中的 zookie 为快照读指定陈旧度上界，从而提供 Zanzibar 的核心一致性性质之一。我们选择使用不透明的 cookie 而不是实际时间戳，是为了避免客户端选择任意时间戳，并为未来的扩展留有余地。"
  s2-4-1:
    text: "Read"
  s2-4-1-p1:
    text: "我们的客户端读取关系元组，用于向用户展示 ACL 或组成员关系，或为后续的写入做准备。读取请求指定一个或多个*元组集*以及一个可选的 zookie。"
  s2-4-1-p2:
    text: "每个*元组集*指定一组关系元组的键。该集合可以包含单个元组键，也可以包含命名空间中具有给定对象 ID 或用户集的所有元组，并可选地以关系名称加以约束。借助元组集，客户端可以查找特定的成员条目、读取某个 ACL 或组中的所有条目，或查找以给定用户为直接成员的所有组。一个读取请求中的所有元组集都在同一个快照上处理。"
  s2-4-1-p3:
    text: "借助 zookie，如果在读取请求中给出写入响应中的 zookie，客户端可以请求一个不早于先前那次写入的读取快照；如果在后续请求中给出先前读取响应中的 zookie，则可以请求与先前那次读取相同的快照。如果请求不包含 zookie，Zanzibar 将选择一个合理较新的快照，这可能比提供 zookie 时带来更低的响应延迟。"
  s2-4-1-p4:
    text: "读取结果仅取决于关系元组的内容，并不反映用户集重写规则。例如，即使 `viewer` 用户集总是包含 `owner` 用户集，读取 `viewer` 关系的元组也不会返回 `owner` 关系的元组。需要了解有效用户集的客户端可以使用 Expand API（[§2.4.5](#s2-4-5)）。"
  s2-4-2:
    text: "Write"
  s2-4-2-p1:
    text: "客户端可以修改单个关系元组来添加或移除一条 ACL。它们也可以通过采用乐观并发控制 [[21](#ref-21)] 的读—改—写流程来修改与某个对象相关的所有元组，该流程先使用一次读取 RPC，再使用一次写入 RPC："
  s2-4-2-steps:
    items:
      - "读取某个对象的所有关系元组，包括一个按对象设置的“锁”元组。"
      - "生成要写入或删除的元组。将这些写入连同对锁元组的一次 touch 操作发送给 Zanzibar，条件是仅当锁元组自读取以来未被修改时才提交这些写入。"
      - "如果写入条件不满足，则返回第 1 步。"
  s2-4-2-p2:
    text: "锁元组只是客户端用来检测写入竞争的一个普通关系元组。"
  s2-4-3:
    text: "Watch"
  s2-4-3-p1:
    text: "一些客户端会为 Zanzibar 中的关系元组维护二级索引。它们可以借助我们的 Watch API 来实现。Watch 请求指定一个或多个命名空间，以及一个表示开始监听时间的 zookie。Watch 响应按时间戳升序包含从请求的起始时间戳到响应中所含*心跳 zookie* 所编码时间戳之间的所有元组修改事件。客户端可以使用心跳 zookie，从上一次 Watch 响应结束之处继续监听。"
  s2-4-4:
    text: "Check"
  s2-4-4-p1:
    text: "检查请求指定一个以 ⟨*object#relation*⟩ 表示的用户集、一个假定的用户（通常以认证令牌表示），以及一个与所需对象版本对应的 zookie。与读取一样，检查总是在一个不早于给定 zookie 的一致快照上进行评估。"
  s2-4-4-p2:
    text: "为对应用内容修改进行授权，我们的客户端会发送一种特殊类型的检查请求，即*内容变更*检查。内容变更检查请求不携带 zookie，并在最新快照上进行评估。如果内容变更获得授权，检查响应中会包含一个 zookie，供客户端与对象内容一起存储，并用于该内容版本的后续检查。该 zookie 编码了评估快照，并捕获了从 ACL 变更到内容变更之间任何可能的因果关系，因为该 zookie 的时间戳将大于保护新内容的那些 ACL 更新的时间戳（[§2.2](#s2-2)）。"
  s2-4-5:
    text: "Expand"
  s2-4-5-p1:
    text: "Expand API 在给定一个 ⟨*object#relation*⟩ 对和一个可选 zookie 的情况下返回有效用户集。与 Read API 不同，Expand 会追踪通过用户集重写规则表达的间接引用。结果以一棵*用户集树*表示，其叶节点为用户 ID 或指向其他 ⟨*object#relation*⟩ 对的用户集，中间节点表示并集、交集或排除运算符。Expand 对于我们的客户端推断有权访问其对象的完整用户和组集合至关重要，这使它们能够为受访问控制的内容构建高效的搜索索引。"
  s3:
    text: "架构与实现"
  s3-p1:
    text: "[图 2](#fig-2) 展示了 Zanzibar 系统的架构。`aclservers` 是主要的服务器类型。它们以集群形式组织，响应 Check、Read、Expand 和 Write 请求。请求可以到达集群中的任意服务器，该服务器根据需要将工作扇出到集群中的其他服务器。这些服务器又可能联系其他服务器来计算中间结果。最初的服务器汇总最终结果并将其返回给客户端。"
  s3-p2:
    text: "Zanzibar 将 ACL 及其元数据存储在 Spanner 数据库中。每个客户端命名空间各有一个数据库用于存储关系元组，另有一个数据库保存所有命名空间配置，还有一个在所有命名空间之间共享的变更日志数据库。`aclservers` 在响应客户端请求的过程中读写这些数据库。"
  s3-p3:
    text: "`watchservers` 是一种专门的服务器类型，用于响应 Watch 请求。它们跟踪（tail）变更日志，并以近乎实时的方式向客户端提供命名空间变更流。"
  s3-p4:
    text: "Zanzibar 定期运行一个数据处理流水线，对 Spanner 中的全部 Zanzibar 数据执行多种离线功能。其中一项功能是在已知的快照时间戳上生成每个命名空间中关系元组的转储。另一项功能是对早于按命名空间配置的阈值的元组版本进行垃圾回收。"
  fig-2:
    alt: "架构图。客户端向由相互连接的 aclservers 组成的 Zanzibar 服务集群发送 Check、Read、Expand 和 Write。aclservers 读写 Spanner 全球数据库系统中的命名空间配置和按命名空间划分的关系元组，并向变更日志追加记录。watchserver 跟踪变更日志，向客户端和 Leopard 索引系统提供 Watch。一个周期性的离线流水线读写 Spanner 并转储命名空间快照，供 Leopard 读取。Leopard 为 aclservers 提供优化的集合计算。"
    caption: "图 2：Zanzibar 架构。箭头表示数据流的方向。"
  s3-p5:
    text: "Leopard 是一个索引系统，用于优化对大型且深度嵌套的集合的操作。它读取 ACL 数据的周期性快照，并监听两次快照之间的变更。它对这些数据执行反规范化等变换，并响应来自 `aclservers` 的请求。"
  s3-p6:
    text: "本节其余部分将更详细地介绍这些架构要素的实现。"
  s3-1:
    text: "存储"
  s3-1-1:
    text: "关系元组存储"
  s3-1-1-p1:
    text: "我们将每个命名空间的关系元组存储在一个单独的数据库中，其中每一行由主键 *(shard ID, object ID, relation, user, commit timestamp)* 标识。多个元组版本存储在不同的行中，这样我们就可以在垃圾回收窗口内的任意时间戳上评估检查和读取。主键的排序使我们能够查找给定对象 ID 或 *(object ID, relation)* 对的所有关系元组。"
  s3-1-1-p2:
    text: "我们的客户端根据命名空间的数据模式来配置其分片方式。通常，分片 ID 仅由对象 ID 决定。在某些情况下，例如当某个命名空间存储着成员数量非常多的组时，分片 ID 由对象 ID 和用户共同计算得出。"
  s3-1-2:
    text: "变更日志"
  s3-1-2-p1:
    text: "Zanzibar 还维护一个变更日志数据库，为 Watch API 存储元组更新的历史记录。其主键为 *(changelog shard ID, timestamp, unique update ID)*，其中每次写入都会随机选择一个变更日志分片。"
  s3-1-2-p2:
    text: "每次 Zanzibar 写入都在单个事务中同时提交到元组存储和变更日志分片。我们指定托管该变更日志分片的 Spanner 服务器作为事务协调者，以尽量减少变更日志读取因等待未决事务而被阻塞的情况。"
  s3-1-3:
    text: "命名空间配置存储"
  s3-1-3-p1:
    text: "命名空间配置存储在一个包含两张表的数据库中。一张表包含配置，以命名空间 ID 为键。另一张表是配置更新的变更日志，以提交时间戳为键。这种结构使 Zanzibar 服务器能够在启动时加载所有配置，并监控变更日志以持续刷新配置。"
  s3-1-4:
    text: "复制"
  s3-1-4-p1:
    text: "为降低延迟，Zanzibar 的数据被复制到靠近客户端的位置。副本分布在全球数十个地点，每个区域有多个副本。5 个投票副本位于美国东部和中部，分布在 3 个不同的大都市区，以隔离故障，但彼此之间的距离在 25 毫秒以内，从而使 Paxos 事务能够快速提交。"
  s3-2:
    text: "服务"
  s3-2-1:
    text: "评估时间戳"
  s3-2-1-p1:
    text: "如 [§2.4](#s2-4) 所述，客户端可以提供 zookie，以确保请求评估的最小快照时间戳。在未提供 zookie 时，服务器使用一个默认陈旧度，该陈旧度的选择旨在确保所有事务都在不影响延迟的前提下尽可能新的时间戳上进行评估。"
  s3-2-1-p2:
    text: "对于向 Spanner 发出的每个读取请求，Zanzibar 都会收到一个提示，指出该时间戳上的数据是否需要进行区外（out-of-zone）读取，从而产生额外延迟。每台服务器都会跟踪默认陈旧度下的数据以及更新和更陈旧的数据发生此类区外读取的频率，并利用这些频率计算在每个陈旧度下任意给定数据片段可在本地获得的概率的二项比例置信区间。"
  s3-2-1-p3:
    text: "在收集到足够的数据后，服务器会检查每个陈旧度值引发区外读取的概率是否足够低，从而能否保证低延迟。如果是，它就将默认陈旧度上界更新为最低的“安全”值。如果已知的陈旧度值都不安全，我们使用双比例 z 检验来判断增大默认值是否会在统计上显著更安全。在这种情况下，我们会增大默认值，以期改善延迟。这一默认陈旧度机制纯粹是一种性能优化。它不会违反一致性语义，因为只要提供了 zookie，Zanzibar 总会遵循它。"
  s3-2-2:
    text: "配置一致性"
  s3-2-2-p1:
    text: "由于对命名空间配置的更改可能改变 ACL 评估的结果，进而影响其正确性，Zanzibar 在评估每个客户端请求时都为配置元数据选择单一的快照时间戳。集群中的所有 `aclservers` 对同一请求都使用相同的时间戳，包括从原始客户端请求扇出的所有子请求。"
  s3-2-2-p2:
    text: "每台服务器在命名空间配置发生变化时，独立地从存储中持续加载这些配置（[§3.1.3](#s3-1-3)）。因此，由于重启或网络延迟，集群中的每台服务器可访问的配置时间戳范围可能各不相同。Zanzibar 必须选择一个在所有服务器上都可用的时间戳。为此，一个监控作业会跟踪每台服务器可用的时间戳范围并对其进行汇总，再将全局可用的范围报告给其他每台服务器。对于每个到来的请求，服务器从该范围中选取一个时间，从而确保即使服务器已无法从配置存储中读取，所有服务器也能继续提供服务。"
  s3-2-3:
    text: "检查评估"
  s3-2-3-p1:
    text: "Zanzibar 通过将检查请求转换为布尔表达式来评估 ACL 检查。在简单情况下，即不存在用户集重写规则时，针对用户集 ⟨*object#relation*⟩ 检查用户 $U$ 可以表示为"
  s3-2-3-p2:
    text: "寻找一个有效的 $U' = \\langle \\mathit{object}'\\#\\mathit{relation}' \\rangle$ 需要递归地评估所有间接 ACL 或组上的成员关系。这种“指针追逐”对大多数类型的 ACL 和组都很有效，但当间接 ACL 或组很深或很宽时，代价可能很高。[§3.2.4](#s3-2-4) 说明了我们如何处理这一问题。作为检查评估的一部分，用户集重写规则也会被转换为布尔表达式。"
  s3-2-3-p3:
    text: "为尽量降低检查延迟，我们并发地评估布尔表达式树的所有叶节点。当某个节点的结果决定了某棵子树的结果时，该子树中其他节点的评估将被取消。"
  s3-2-3-p4:
    text: "叶节点的评估通常涉及从数据库中读取关系元组。我们采用一种池化机制，将同一 ACL 检查的读取归并在一起，以尽量减少发往 Spanner 的读取 RPC 数量。"
  s3-2-4:
    text: "Leopard 索引系统"
  s3-2-4-p1:
    text: "对于深度嵌套或拥有大量子组的组，检查评估过程中的递归指针追逐难以保持低延迟。对于呈现此类结构的选定命名空间，Zanzibar 使用 Leopard 来处理检查。Leopard 是一种支持高效集合计算的专用索引。"
  s3-2-4-p2:
    text: "Leopard 索引使用 $(T, s, e)$ 元组来表示一组具名集合，其中 $T$ 是表示集合类型的枚举，$s$ 和 $e$ 是 64 位整数，分别表示集合 ID 和元素 ID。一次查询会评估由具名集合的并集、交集或排除构成的表达式，并返回按元素 ID 排序、最多为指定数量的结果集。"
  s3-2-4-p3:
    text: "为对组成员关系进行索引和评估，Zanzibar 使用两种集合类型来表示组成员关系：$\\textsf{GROUP2GROUP}$ 和 $\\textsf{MEMBER2GROUP}$。这里我们将它们表示为从集合 ID 映射到元素 ID 的函数："
  s3-2-4-sets:
    items:
      - "$\\textsf{GROUP2GROUP}(s) \\to \\{e\\}$，其中 $s$ 表示一个祖先组，$e$ 表示一个后代组，它*直接或间接*地是该祖先组的子组。"
      - "$\\textsf{MEMBER2GROUP}(s) \\to \\{e\\}$，其中 $s$ 表示一个个体用户，$e$ 表示该用户作为*直接*成员所属的父组。"
  s3-2-4-p4:
    text: "为判断用户 $U$ 是否为组 $G$ 的成员，我们检查"
  s3-2-4-p5:
    text: "组成员关系可以看作图中的可达性问题，其中节点表示组和用户，边表示直接成员关系。将组到组的路径扁平化使 Leopard 能够高效地评估可达性，不过也可以根据数据模式的需要应用其他类型的反规范化。"
  s3-2-4-p6:
    text: "Leopard 系统由三个独立部分组成：一个能够跨集合执行一致且低延迟操作的服务系统；一个离线的、周期性的索引构建系统；以及一个在元组发生变更时能够持续更新服务系统的在线实时层。"
  s3-2-4-p7:
    text: "索引元组以有序整数列表的形式存储在跳表之类的结构中，从而能够在集合之间高效地计算并集和交集。例如，计算两个集合 $A$ 和 $B$ 的交集只需 $O(\\min(|A|, |B|))$ 次跳表查找。索引按元素 ID 分片，并可分布在多台服务器上。分片通常完全从内存中提供服务，但也可以由分布在内存和远程固态设备之间的冷热混合数据提供服务。"
  s3-2-4-p8:
    text: "离线索引构建器根据 Zanzibar 关系元组和配置的快照生成索引分片，并在全球范围内复制这些分片。它遵循用户集重写规则，递归地展开 ACL 图中的边，以形成 Leopard 索引元组。Leopard 服务器持续监视新的分片，并在新分片可用时用其替换旧分片。"
  s3-2-4-p9:
    text: "到目前为止所描述的 Leopard 系统能够高效地评估深度和广度嵌套的组成员关系，但由于离线索引生成和分片替换，它无法在新鲜且一致的快照上做到这一点。为支持一致的 ACL 评估，Leopard 服务器维护一个增量层，对自离线快照以来的所有更新进行索引，其中每次更新由一个 $(T, s, e, t, d)$ 元组表示，$t$ 是更新的时间戳，$d$ 是删除标记。在查询处理期间，时间戳小于或等于查询时间戳的更新会被合并到离线索引之上。"
  s3-2-4-p10:
    text: "为维护增量层，Leopard 增量索引器调用 Zanzibar 的 Watch API，接收按时间排序的 Zanzibar 元组修改流，并将这些更新转换为按时间排序的 Leopard 元组添加、更新和删除流。为 $\\textsf{GROUP2GROUP}$ 元组生成更新，要求增量索引器维护组到组的成员关系，以便将一次关系元组更新的影响反规范化为可能多次的索引更新。"
  s3-2-4-p11:
    text: "在实践中，单次 Zanzibar 元组的添加或删除可能产生多达数万个离散的 Leopard 元组事件。每个 Leopard 服务实例都通过 Watch API 接收这些 Zanzibar 元组变更的完整流。Leopard 服务系统被设计为持续摄取该流，并在对查询服务影响最小的情况下更新其各类倒排列表（posting list）。"
  s3-2-5:
    text: "热点处理"
  s3-2-5-p1:
    text: "ACL 读取和检查的工作负载往往具有突发性，且容易出现热点。例如，响应一次搜索查询需要对所有候选结果进行 ACL 检查，而这些结果的 ACL 往往共享共同的组或间接 ACL。为便于保证一致性，Zanzibar 避免对存储进行反规范化，仅依赖规范化数据（[§3.2.4](#s3-2-4) 中描述的情况除外）。在规范化数据下，共同 ACL（例如热门组）上的热点可能使底层数据库服务器过载。我们发现，热点处理是我们追求低延迟和高可用性过程中最关键的前沿问题。"
  s3-2-5-p2:
    text: "每个集群中的 Zanzibar 服务器为读取和检查评估（包括指针追逐过程中评估的中间检查结果）构成一个分布式缓存。缓存条目通过一致性哈希 [[20](#ref-20)] 分布在各 Zanzibar 服务器上。为处理检查或读取，我们通过内部 RPC 接口将请求扇出到相应的 Zanzibar 服务器。为尽量减少内部 RPC 的数量，对于大多数命名空间，我们根据对象 ID 计算转发键，因为处理针对 ⟨*object#relation*⟩ 的检查通常涉及对同一对象其他关系的间接 ACL 检查以及读取该对象的关系元组。这些检查和读取可以由同一台服务器处理，因为它们与父检查请求共享相同的转发键。为处理热门转发键，我们在内部 RPC 的调用方和被调用方都缓存结果，实际上形成了缓存树。我们还使用 Slicer [[12](#ref-12)] 帮助将热键分散到多台服务器上。"
  s3-2-5-p3:
    text: "我们通过在缓存键中编码快照时间戳，避免复用在不同快照上评估得到的结果。在遵循请求 zookie 的陈旧度约束的同时，我们选择向上取整到较粗粒度（例如一秒或十秒）的评估时间戳。这种时间戳量化使得绝大多数近期检查和读取能够在相同的时间戳上评估并共享缓存结果，尽管缓存键中的时间戳具有微秒级精度。值得注意的是，对时间戳向上取整并不影响 Zanzibar 的一致性性质，因为 Spanner 确保在时间戳 $T$ 上的快照读会观察到截至 $T$ 的所有写入——即使 $T$ 位于未来也是如此，此时读取会等待，直到 TrueTime 越过 $T$。"
  s3-2-5-p4:
    text: "为处理“缓存踩踏”（cache stampede）问题 [[3](#ref-3)]，即并发请求在缓存填充结果之前造成瞬时热点，我们在每台服务器上维护一个*锁表*，用于跟踪未完成的读取和检查。在共享同一缓存键的请求中，只有一个请求会开始处理；其余请求会阻塞，直到缓存被填充。"
  s3-2-5-p5:
    text: "借助分布式缓存和锁表，我们可以有效地处理绝大多数热点。随着时间推移，我们做了以下两项改进。"
  s3-2-5-p6:
    text: "第一，针对某个对象和关系对用户进行的直接成员关系检查（即 ⟨*object#relation@user*⟩）通常通过一次关系元组查找来处理。然而，偶尔会有非常热门的对象引来针对不同用户的大量并发检查，从而在托管该对象关系元组的存储服务器上造成热点。为避免这些热点，我们为热门对象读取并缓存 ⟨*object#relation*⟩ 的*所有*关系元组，以读取带宽换取可缓存性。我们通过跟踪每个对象上未完成的读取数量，动态检测需要应用此方法的热门对象。"
  s3-2-5-p7:
    text: "第二，当父 ACL 检查的结果已经确定时，间接 ACL 检查经常会被取消。这会使缓存键未被填充。虽然急切取消显著降低了资源使用量，但它对被锁表条目阻塞的并发请求的延迟有负面影响。为防止这种延迟影响，当相应的锁表条目上存在等待者时，我们会推迟急切取消。"
  s3-2-6:
    text: "性能隔离"
  s3-2-6-p1:
    text: "对于以低延迟和高可用性为目标的共享服务而言，性能隔离不可或缺。如果 Zanzibar 或其某个客户端偶尔未能配置足够的资源来应对意外的使用模式，以下隔离机制可确保性能问题被隔离在出问题的用例之内，而不会对其他客户端产生不利影响。"
  s3-2-6-p2:
    text: "第一，为确保 CPU 容量的合理分配，Zanzibar 以通用的 *cpu-seconds*（一种与硬件无关的指标）来衡量每个 RPC 的开销。每个客户端都有每秒最大 CPU 使用量的全局限额；如果它超出该限额*且*整个系统中没有空闲容量，其 RPC 将被限流。"
  s3-2-6-p3:
    text: "每台 Zanzibar 服务器还会限制未完成 RPC 的总数，以控制其内存使用。同样，它也会限制每个客户端的未完成 RPC 数量。"
  s3-2-6-p4:
    text: "Zanzibar 还会在每台 Spanner 服务器上限制每个 *(object, client)* 以及每个客户端的最大并发读取数。这确保了没有任何单个对象或客户端能够独占一台 Spanner 服务器。"
  s3-2-6-p5:
    text: "最后，我们为来自不同客户端的请求使用不同的锁表键，以防止 Spanner 对某个客户端施加的限流影响其他客户端。"
  s3-2-7:
    text: "尾延迟缓解"
  s3-2-7-p1:
    text: "Zanzibar 的分布式处理需要采取措施来应对慢任务。对于 Spanner 和 Leopard 索引的调用，我们依赖请求对冲 [[16](#ref-16)]（即将同一请求发送到多台服务器，采用最先返回的响应，并取消其他请求）。为缩短往返时间，我们尽量在每个部署了 Zanzibar 服务器的地理区域中放置这些后端服务的至少两个副本。为避免不必要地成倍增加负载，我们先发送一个请求，直到确知初始请求较慢时才发送对冲请求。"
  s3-2-7-p2:
    text: "为确定合适的对冲延迟阈值，每台服务器都维护一个延迟估计器，它根据近期的测量值动态计算第 *N* 百分位延迟。这一机制使我们能够将对冲带来的额外流量限制在总流量的一小部分。"
  s3-2-7-p3:
    text: "有效的对冲要求各请求具有相近的开销。就 Zanzibar 的授权检查而言，有些检查本身就比其他检查更耗时，因为它们需要更多的工作。对检查请求进行对冲会导致开销最大的工作负载被重复执行，反而会使延迟恶化。因此，我们不在 Zanzibar 服务器之间对冲请求，而是依靠前面讨论的多副本间分片以及监控机制来检测和避开慢服务器。"
  s4:
    text: "经验"
  s4-p1:
    text: "Zanzibar 已投入生产使用超过 5 年。在此期间，使用 Zanzibar 的客户端数量及其给 Zanzibar 带来的负载一直在稳步增长。本节讨论我们将 Zanzibar 作为全球分布式授权系统进行运营的经验。"
  s4-p2:
    text: "Zanzibar 管理着由数百个客户端应用定义的 1,500 多个命名空间。命名空间配置文件的大小可以作为衡量该命名空间所实现访问控制策略复杂度的粗略指标。这些配置文件从数十行到数千行不等，中位数接近 500 行。"
  s4-p3:
    text: "这些命名空间包含超过 2 万亿个关系元组，占用近 100 TB 的空间。每个命名空间的元组数量跨越多个数量级，从数十个到一万亿个不等，中位数接近 15,000。这些数据被完整复制到全球 30 多个地点，以兼顾贴近用户和高可用性。"
  s4-p4:
    text: "Zanzibar 每秒处理超过 1,000 万次客户端查询（QPS）。在 2018 年 12 月的一个 7 天采样期内，Check 请求峰值约为 4.2M QPS，Read 为 8.2M，Expand 为 760K，Write 为 25K。因此，读取数据的查询比写入数据的查询频繁两个数量级。"
  s4-p5:
    text: "Zanzibar 将这些负载分散到全球数十个集群中的 10,000 多台服务器上。每个集群的服务器数量从不足 100 台到超过 1,000 台不等，中位数接近 500 台。集群的规模与其所在地理区域的负载成比例。"
  s4-1:
    text: "请求"
  s4-1-p1:
    text: "我们根据所需的数据新鲜度将请求分为两类，新鲜度会对请求的延迟和可用性产生很大影响。具体而言，Check、Read 和 Expand 请求携带 zookie，用于指定评估时间戳的下界。当 zookie 的时间戳高于已复制到该区域的最新数据的时间戳时，存储读取需要跨区域往返到领导者副本以获取更新的数据。由于我们的存储配置了间隔为 8 秒的复制心跳，我们将请求分为两类：*Safe* 请求的 zookie 时龄超过 10 秒，大多数时候可以在区域内得到处理；而 *Recent* 请求的 zookie 时龄不足 10 秒，往往需要跨区域往返。我们分别报告这两类请求的统计数据。"
  fig-3:
    alt: "一周（周日至周六）的对数刻度折线图。Safe QPS 每天在约 200 万到 400 万之间波动；Recent QPS 在约 2 万到 8 万之间波动，大约低两个数量级。"
    caption: "图 3：2018 年 12 月一个 7 天期间内 Check Safe 和 Check Recent 请求的速率。"
  s4-1-p2:
    text: "[图 3](#fig-3) 展示了 7 天内 Check Safe 和 Check Recent 请求的速率。两者都呈现出昼夜周期。Safe 请求的速率比 Recent 请求大约高两个数量级，这使 Zanzibar 能够在本地处理绝大多数 ACL 检查。"
  s4-2:
    text: "延迟"
  s4-2-p1:
    text: "客户端要成为可用的交互式服务，必须将总响应时间控制在数百毫秒以内，而 Zanzibar 的延迟预算通常只占其中的一小部分。例如，考虑一个客户端，它必须先对多个文档执行授权检查，然后才能展示对这些文档的搜索结果。"
  s4-2-p2:
    text: "我们使用实时流量在服务器端测量延迟，原因是：（1）延迟在很大程度上受我们的缓存和去重机制影响，因此只有实时流量才能真实地反映它；（2）从客户端准确测量延迟需要行为良好的客户端。客户端作业的资源配置不在 Zanzibar 的控制范围之内，而且客户端作业有时会过载。"
  fig-4:
    alt: "一周内 Check Safe 延迟的对数刻度折线图。第 50 百分位保持在约 3 ms，第 95 百分位约 10 ms，第 99 百分位在约 13 到 20 ms 之间，第 99.9 百分位在约 50 到 90 ms 之间。"
    caption: "图 4：2018 年 12 月一个 7 天期间内 Check Safe 响应在不同百分位上的延迟。"
  s4-2-p3:
    text: "[图 4](#fig-4) 展示了 7 天内 Check Safe 响应的延迟。在第 50、95、99 和 99.9 百分位上，其峰值分别约为 3、11、20 和 93 毫秒。对于一个经常处于用户交互关键路径上的操作而言，这一性能满足了我们的延迟目标。"
  s4-2-p4:
    text: "[表 2](#tab-2) 汇总了同一 7 天内 Check、Read、Expand 和 Write 响应的延迟分布。符合设计意图的是，使用更频繁的 Safe 版本的 Check、Read 和 Expand 明显快于使用较少的 Recent 版本。Write 是所有 API 中使用频率最低的，也是最慢的，因为它们总是需要在 Spanner 服务器之间进行分布式协调。"
