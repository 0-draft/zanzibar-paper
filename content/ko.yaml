# ko translation of content/en.yaml. Translate the values; keep ids, keys and order.
lang: ko
meta:
  title: "Zanzibar: Google의 일관된 글로벌 인가 시스템"
blocks:
  author-note:
    text: Google 재직 중 수행한 작업이다.
  abstract:
    text: 초록
  abstract-p1:
    text: 온라인 사용자가 디지털 객체에 접근할 권한이 있는지 판단하는 일은 프라이버시 보호의 핵심이다. 이 논문은 접근 제어 목록을 저장하고 평가하는 글로벌 시스템인 Zanzibar의 설계, 구현, 배포를 소개한다. Zanzibar는 Calendar, Cloud, Drive, Maps, Photos, YouTube를 포함한 Google의 수백 개 클라이언트 서비스가 요구하는 폭넓은 접근 제어 정책을 표현하기 위한 통일된 데이터 모델과 설정 언어를 제공한다. Zanzibar의 인가 결정은 사용자 행동의 인과적 순서를 준수하며, 따라서 접근 제어 목록과 객체 내용이 변경되는 와중에도 외부 일관성을 제공한다. Zanzibar는 수십억 명이 사용하는 서비스를 지원하기 위해 수조 개의 접근 제어 목록과 초당 수백만 건의 인가 요청으로 확장된다. Zanzibar는 3년이 넘는 프로덕션 사용 기간 동안 95번째 백분위수 지연 시간 10밀리초 미만, 가용성 99.999% 초과를 유지해 왔다.
  s1:
    text: 서론
  s1-p1:
    text: 많은 온라인 상호작용에서는 사용자가 디지털 객체에 대해 어떤 작업을 수행할 권한이 있는지 확인하는 인가 검사가 필요하다. 예를 들어 웹 기반 사진 저장 서비스는 일반적으로 사진 소유자가 일부 사진은 친구와 공유하고 다른 사진은 비공개로 유지할 수 있게 한다. 이러한 서비스는 사용자가 사진을 보도록 허용하기 전에 그 사진이 해당 사용자와 공유되었는지 확인해야 한다. 견고한 인가 검사는 온라인 프라이버시 보호의 핵심이다.
  s1-p2:
    text: 이 논문은 권한을 저장하고 저장된 권한을 기반으로 인가 검사를 수행하는 시스템인 Zanzibar를 소개한다. Zanzibar는 Calendar, Cloud, Drive, Maps, Photos, YouTube를 포함하여 Google이 제공하는 다양한 서비스에서 사용된다. 이들 서비스 중 몇몇은 10억 명이 넘는 사용자를 대신하여 수십억 개의 객체를 관리한다.
  s1-p3:
    text: 통합된 인가 시스템은 개별 애플리케이션마다 별도의 접근 제어 메커니즘을 유지하는 것에 비해 중요한 이점을 제공한다. 첫째, 애플리케이션 전반에 걸쳐 일관된 의미론과 사용자 경험을 확립하는 데 도움이 된다. 둘째, 애플리케이션 간 상호 운용을 쉽게 한다. 예를 들어 한 애플리케이션의 객체가 다른 애플리케이션의 객체를 포함(embed)할 때 접근 제어를 조율할 수 있다. 셋째, 통합된 접근 제어 시스템 위에 유용한 공통 인프라를 구축할 수 있으며, 특히 접근 제어를 준수하면서 여러 애플리케이션에 걸쳐 동작하는 검색 인덱스를 만들 수 있다. 마지막으로, 아래에서 보이듯이 인가는 데이터 일관성과 확장성에 관련된 고유한 과제를 안고 있다. 이를 애플리케이션 전반에 걸쳐 한 번에 해결하면 엔지니어링 자원이 절약된다.
  s1-p4:
    text: "Zanzibar 시스템의 목표는 다음과 같다."
  s1-goals:
    items:
      - "*정확성*: 사용자의 의도를 존중하도록 접근 제어 결정의 일관성을 보장해야 한다."
      - "*유연성*: 소비자용 애플리케이션과 기업용 애플리케이션 모두가 요구하는 풍부한 접근 제어 정책을 지원해야 한다."
      - "*낮은 지연 시간*: 인가 검사는 사용자 상호작용의 임계 경로(critical path)에 있는 경우가 많으므로 빠르게 응답해야 한다. 꼬리 구간의 낮은 지연 시간은 특히 검색 결과를 제공할 때 중요한데, 검색 결과에는 흔히 수십에서 수백 건의 검사가 필요하기 때문이다."
      - "*높은 가용성*: 명시적인 인가가 없으면 클라이언트 서비스는 사용자의 접근을 거부할 수밖에 없으므로 요청에 안정적으로 응답해야 한다."
      - "*대규모*: 수십억 명의 사용자가 공유하는 수십억 개의 객체를 보호해야 한다. 클라이언트와 그 최종 사용자 가까이에 있도록 전 세계에 배포되어야 한다."
  s1-p5:
    text: Zanzibar는 주목할 만한 여러 기능을 조합하여 이러한 목표를 달성한다. 유연성을 제공하기 위해 Zanzibar는 단순한 데이터 모델에 강력한 설정 언어를 결합한다. 이 언어를 통해 클라이언트는 `owner`, `editor`, `commenter`, `viewer`와 같이 사용자와 객체 사이의 임의의 관계를 정의할 수 있다. 이 언어에는 교집합, 합집합과 같은 집합 대수 연산자가 포함되어 있어, 그러한 사용자-객체 관계를 바탕으로 잠재적으로 복잡한 접근 제어 정책을 지정할 수 있다. 예를 들어 애플리케이션은 문서에 대한 편집 권한을 부여받은 사용자는 그 문서에 댓글도 달 수 있지만, 모든 댓글 작성자에게 편집 권한이 주어지는 것은 아니라고 지정할 수 있다.
  s1-p6:
    text: 런타임에 Zanzibar는 클라이언트가 원격 프로시저 호출(RPC) 인터페이스를 통해 접근 제어 목록(ACL)을 생성, 수정, 평가할 수 있게 한다. 단순한 ACL은 “사용자 *U*는 객체 *O*에 대해 관계 *R*을 가진다”의 형태를 띤다. 더 복잡한 ACL은 “사용자 집합 *S*는 객체 *O*에 대해 관계 *R*을 가진다”의 형태를 띠며, 여기서 *S* 자체는 다른 객체-관계 쌍으로 지정된다. 따라서 ACL은 다른 ACL을 참조할 수 있다. 예를 들어 어떤 동영상에 댓글을 달 수 있는 사용자 집합은 그 특정 동영상에 대한 시청 권한을 부여받은 사용자와 해당 동영상 채널에 대한 시청 권한을 가진 사용자로 구성된다고 지정할 수 있다.
  s1-p7:
    text: 그룹 멤버십은 객체가 그룹이고 관계가 의미상 `member`와 동등한 중요한 ACL 유형이다. 그룹은 다른 그룹을 포함할 수 있는데, 이는 Zanzibar가 직면한 과제 중 하나를 보여 준다. 즉, 사용자가 어떤 그룹에 속하는지 평가하려면 중첩된 그룹 멤버십의 긴 사슬을 따라가야 할 수 있다.
  s1-p8:
    text: 인가 검사는 “사용자 *U*는 객체 *O*에 대해 관계 *R*을 가지는가?”의 형태를 띠며, 분산된 서버 집합에 의해 평가된다. 검사 요청이 Zanzibar에 도착하면, 검사를 평가하는 작업은 여러 서버로 팬아웃(fan out)될 수 있다. 예를 들어 그룹이 개별 멤버와 다른 그룹을 모두 포함하는 경우가 그렇다. 각 서버는 다시 다른 서버에 연락할 수 있는데, 예를 들어 그룹 멤버십의 계층 구조를 재귀적으로 순회하는 경우다.
  s1-p9:
    text: Zanzibar는 여러 차원에서 글로벌 규모로 운영된다. Zanzibar는 2조 개가 넘는 ACL을 저장하고 초당 수백만 건의 인가 검사를 수행한다. 어떤 객체에 대한 인가 검사든 전 세계 어디에서나 들어올 수 있으므로 ACL 데이터는 지리적 분할에 적합하지 않다. 따라서 Zanzibar는 모든 ACL 데이터를 지리적으로 분산된 수십 개의 데이터 센터에 복제하고, 전 세계 수천 대의 서버에 부하를 분산한다.
  s1-p10:
    text: Zanzibar는 서로 연관된 두 가지 기능을 통해 접근 제어 결정의 글로벌 일관성을 지원한다. 첫째, ACL 변경이 하부 데이터 저장소에 커밋되는 순서를 준수한다. 둘째, 인가 검사가 클라이언트가 지정한 변경보다 오래되지 않은 ACL 데이터를 기반으로 하도록 보장할 수 있다. 따라서 예를 들어 클라이언트는 그룹에서 사용자를 제거한 뒤 이후의 멤버십 검사가 그 제거를 반영한다고 확신할 수 있다. Zanzibar는 외부 일관성을 보장하는 글로벌 분산 데이터베이스 시스템에 ACL을 저장함으로써 이러한 순서 속성을 제공한다 [[15](#ref-15), [18](#ref-18)].
  s1-p11:
    text: Zanzibar는 이러한 글로벌 분산 환경에서 낮은 지연 시간과 높은 가용성을 달성하기 위해 다양한 기법을 사용한다. Zanzibar의 일관성 프로토콜은 리전 간 왕복 없이 로컬에 복제된 데이터로 대부분의 요청을 처리할 수 있게 한다. Zanzibar는 일관성을 위해 데이터를 정규화된 형태로 저장한다. 정규화된 데이터의 핫스팟은 최종 결과와 중간 결과를 캐싱하고 동시 요청을 중복 제거하여 처리한다. 또한 요청 헤징, 제한적인 비정규화를 통한 깊게 중첩된 집합에 대한 연산 최적화 같은 기법도 적용한다. Zanzibar는 인가 검사의 95% 이상에 10밀리초 이내로 응답하며, 지난 3년간 99.999%가 넘는 가용성을 유지해 왔다.
  s1-p12:
    text: 이 논문의 주요 기여는 일관되고 세계적 규모를 가진 인가 시스템을 구축하고 배포하는 데 따르는 엔지니어링 과제를 전달하는 데 있다. Zanzibar 설계의 요소 대부분은 기존 연구에 뿌리를 두고 있지만, 이 논문은 정확성, 유연성, 지연 시간, 가용성, 확장성에 대한 엄격한 요구 사항을 충족하기 위해 Zanzibar가 결합한 기능과 기법을 기록으로 남긴다. 또한 까다롭고 다양한 클라이언트를 위해 Zanzibar를 운영하면서 얻은 교훈을 조명한다.
  s2:
    text: 모델, 언어, API
  s2-p1:
    text: 이 절에서는 Zanzibar의 데이터 모델, 설정 언어, 애플리케이션 프로그래밍 인터페이스(API)를 설명한다.
  s2-1:
    text: 관계 튜플
  s2-1-p1:
    text: "Zanzibar에서 ACL은 *관계 튜플*로 표현되는 객체-사용자 또는 객체-객체 관계의 모음이다. 그룹은 단순히 멤버십 의미론을 갖는 ACL이다. 관계 튜플에는 효율적인 바이너리 인코딩이 있지만, 이 논문에서는 편리한 텍스트 표기법을 사용하여 나타낸다."
  s2-1-p2:
    text: 여기서 ⟨*namespace*⟩와 ⟨*relation*⟩은 클라이언트 설정에 미리 정의되어 있고([§2.3](#s2-3)), ⟨*object_id*⟩는 문자열이며, ⟨*user_id*⟩는 정수다. 관계 튜플을 식별하는 데 필요한 기본 키는 ⟨*namespace*⟩, ⟨*object_id*⟩, ⟨*relation*⟩, ⟨*user*⟩다. 주목할 만한 특징 하나는 ⟨*userset*⟩을 통해 ACL이 그룹을 참조할 수 있으며, 따라서 중첩된 그룹 멤버십을 표현할 수 있다는 점이다.
  s2-1-p3:
    text: "[표 1](#tab-1)은 몇 가지 예시 튜플과 그에 대응하는 의미를 보여 준다. 일부 관계(예: `viewer`)는 접근 제어를 직접 정의하는 반면, 다른 관계(예: 폴더를 가리키는 `parent`)는 객체 사이의 추상적인 관계만 정의한다. 이러한 추상적 관계는 네임스페이스 설정에 지정된 유저셋 재작성 규칙([§2.3.1](#s2-3-1))에 따라 간접적으로 접근 제어에 영향을 줄 수 있다."
  tab-1:
    header:
      - 텍스트 표기법으로 나타낸 예시 튜플
      - 의미
    rows:
      - - "`doc:readme#owner@10`"
        - 사용자 10은 `doc:readme`의 소유자다
      - - "`group:eng#member@11`"
        - 사용자 11은 `group:eng`의 멤버다
      - - "`doc:readme#viewer@group:eng#member`"
        - "`group:eng`의 멤버는 `doc:readme`의 열람자다"
      - - "`doc:readme#parent@folder:A#...`"
        - "`doc:readme`는 `folder:A`에 있다"
    caption: "표 1: 관계 튜플의 예. “#...”는 튜플의 의미에 영향을 주지 않는 관계를 나타낸다."
  s2-1-p4:
    text: 객체별 ACL 대신 튜플을 중심으로 데이터 모델을 정의하면 ACL과 그룹이라는 개념을 통합할 수 있고, [§2.4](#s2-4)에서 보겠지만 효율적인 읽기와 점진적 갱신을 지원할 수 있다.
  s2-2:
    text: 일관성 모델
  s2-2-p1:
    text: "ACL 검사는 예상치 못한 공유 동작을 피하기 위해 사용자가 ACL과 객체 내용을 수정하는 순서를 준수해야 한다. 특히 클라이언트는 “new enemy” 문제를 방지하는 데 관심이 있는데, 이 문제는 ACL 갱신 사이의 순서를 준수하지 못하거나 새 콘텐츠에 오래된 ACL을 적용할 때 발생할 수 있다. 다음 두 예를 생각해 보자."
  s2-2-exa:
    title: "예 A: ACL 갱신 순서 무시"
    items:
      - Alice가 폴더의 ACL에서 Bob을 제거한다.
      - 이어서 Alice가 Charlie에게 새 문서들을 그 폴더로 옮겨 달라고 요청한다. 이때 문서의 ACL은 폴더의 ACL을 상속한다.
      - Bob은 새 문서들을 볼 수 없어야 하지만, ACL 검사가 두 ACL 변경 사이의 순서를 무시하면 볼 수 있게 될 수도 있다.
  s2-2-exb:
    title: "예 B: 새 콘텐츠에 오래된 ACL을 잘못 적용"
    items:
      - Alice가 문서의 ACL에서 Bob을 제거한다.
      - 이어서 Alice가 Charlie에게 그 문서에 새 내용을 추가해 달라고 요청한다.
      - Bob은 새 내용을 볼 수 없어야 하지만, ACL 검사가 Bob이 제거되기 전의 오래된 ACL로 평가되면 볼 수 있게 될 수도 있다.
  s2-2-p2:
    text: "“new enemy” 문제를 방지하려면 Zanzibar는 ACL 또는 콘텐츠 갱신 사이의 인과적 순서를 이해하고 준수해야 하며, 여기에는 서로 다른 ACL이나 객체에 대한 갱신, 그리고 Zanzibar가 볼 수 없는 채널을 통해 조율된 갱신도 포함된다. 따라서 Zanzibar는 두 가지 핵심 일관성 속성, 즉 *외부 일관성* [[18](#ref-18)]과 *오래된 정도(staleness)가 제한된 스냅샷 읽기*를 제공해야 한다."
  s2-2-p3:
    text: "외부 일관성을 통해 Zanzibar는 각 ACL 또는 콘텐츠 갱신에 타임스탬프를 할당할 수 있으며, 인과적으로 관련된 두 갱신 $x \\prec y$에는 인과적 순서를 반영하는 타임스탬프 $T_x < T_y$가 할당된다. 인과적으로 의미 있는 타임스탬프가 있으면, 타임스탬프 $T$에서 ACL 데이터베이스를 읽는 스냅샷 읽기는 타임스탬프가 $\\le T$인 모든 갱신을 관측하므로 ACL 갱신 사이의 순서를 준수하게 된다. 즉, 읽기가 갱신 $x$를 관측한다면 $x$보다 인과적으로 앞서 일어난 모든 갱신도 관측하게 된다."
  s2-2-p4:
    text: 나아가 새 콘텐츠에 오래된 ACL을 적용하지 않으려면, ACL 검사 평가 스냅샷이 콘텐츠 갱신에 할당된 인과적 타임스탬프보다 오래되어서는 안 된다. 타임스탬프 $T_c$에서 이루어진 콘텐츠 갱신이 주어졌을 때, 타임스탬프 $\ge T_c$에서의 스냅샷 읽기는 콘텐츠 갱신보다 인과적으로 앞서 일어난 모든 ACL 갱신을 ACL 검사가 관측하도록 보장한다.
  s2-2-p5:
    text: 외부 일관성과 오래된 정도가 제한된 스냅샷 읽기를 제공하기 위해, 우리는 ACL을 Spanner 글로벌 데이터베이스 시스템 [[15](#ref-15)]에 저장한다. Spanner의 TrueTime 메커니즘은 각 ACL 쓰기에 마이크로초 해상도의 타임스탬프를 할당하며, 쓰기의 타임스탬프가 쓰기 사이의 인과적 순서를 반영하도록 하여 외부 일관성을 제공한다. 우리는 각 ACL 검사를 여러 데이터베이스 읽기에 걸쳐 단일 스냅샷 타임스탬프에서 평가하므로, 검사 스냅샷까지의 타임스탬프를 가진 모든 쓰기, 그리고 오직 그 쓰기만이 ACL 검사에 보인다.
  s2-2-p6:
    text: "새 콘텐츠에 대한 검사를 오래된 ACL로 평가하지 않기 위해, 검사 결과가 검사 호출 시점까지의 모든 ACL 쓰기를 반영하도록 항상 최신 스냅샷에서 평가하는 방법을 시도해 볼 수 있다. 그러나 그러한 평가에는 지연 시간이 큰 왕복을 수반하는 글로벌 데이터 동기화가 필요하고 가용성도 제한된다. 대신 우리는 Zanzibar 클라이언트의 협조를 받아 대부분의 검사를 이미 복제된 데이터로 평가할 수 있도록 다음 프로토콜을 설계한다."
  s2-2-protocol:
    items:
      - Zanzibar 클라이언트는 콘텐츠 수정 사항이 저장되려 할 때 *content-change* ACL 검사([§2.4.4](#s2-4-4))를 통해 각 콘텐츠 버전에 대해 *zookie*라는 불투명한 일관성 토큰을 요청한다. Zanzibar는 현재의 글로벌 타임스탬프를 zookie에 인코딩하고, 이전의 모든 ACL 쓰기가 더 낮은 타임스탬프를 갖도록 보장한다. 클라이언트는 zookie를 콘텐츠 변경과 함께 클라이언트 저장소에 원자적 쓰기로 저장한다. content-change 검사는 애플리케이션 콘텐츠 수정과 같은 트랜잭션에서 평가될 필요는 없으며, 사용자가 내용을 수정할 때 트리거되기만 하면 된다는 점에 유의하라.
      - 클라이언트는 이후의 ACL 검사 요청에 이 zookie를 보내, 검사 스냅샷이 적어도 해당 콘텐츠 버전의 타임스탬프만큼 최신이도록 보장한다.
  s2-2-p7:
    text: "외부 일관성과 zookie로 오래된 정도가 제한되는 스냅샷 읽기는 “new enemy” 문제를 방지한다. 예 A에서 ACL 갱신 A1과 A2에는 각각 타임스탬프 $T_{A1} < T_{A2}$가 할당된다. Bob은 Charlie가 추가한 새 문서들을 볼 수 없다. 검사가 $T < T_{A2}$에서 평가되면 문서 ACL에 폴더 ACL이 포함되지 않고, 검사가 $T \\ge T_{A2} > T_{A1}$에서 평가되면 검사는 폴더 ACL에서 Bob을 제거한 갱신 A1을 관측하기 때문이다. 예 B에서 Bob은 문서에 추가된 새 내용을 볼 수 없다. Bob이 새 내용을 보려면 검사가 $\\ge T_{B2}$인 zookie, 즉 콘텐츠 갱신에 할당된 타임스탬프 이상의 zookie로 평가되어야 한다. $T_{B2} > T_{B1}$이므로 그러한 검사는 ACL에서 Bob을 제거한 ACL 갱신 B1도 관측하게 된다."
  s2-2-p8:
    text: zookie 프로토콜은 Zanzibar 일관성 모델의 핵심 기능이다. 이 프로토콜은 Zanzibar가 ACL 갱신과 콘텐츠 갱신 사이의 인과적 순서를 준수하도록 보장하면서도, 그 밖의 경우에는 지연 시간과 가용성 목표를 충족하도록 평가 타임스탬프를 선택할 자유를 Zanzibar에 부여한다. 이 자유는 프로토콜의 “최소한 그만큼은 최신(at-least-as-fresh)” 의미론에서 비롯되며, 이 의미론 덕분에 Zanzibar는 zookie에 인코딩된 타임스탬프보다 최신인 어떤 타임스탬프든 선택할 수 있다. 이러한 자유 덕분에 Zanzibar는 대부분의 검사를 이미 복제된 데이터로 기본 오래된 정도에서 처리할 수 있고([§3.2.1](#s3-2-1)), 핫스팟을 피하기 위해 평가 타임스탬프를 양자화할 수 있다([§3.2.5](#s3-2-5)).
  s2-3:
    text: 네임스페이스 설정
  s2-3-p1:
    text: 클라이언트는 Zanzibar에 관계 튜플을 저장하기 전에 네임스페이스를 설정해야 한다. 네임스페이스 설정은 그 네임스페이스의 관계와 저장소 매개변수를 지정한다. 각 관계에는 `viewer`나 `editor`처럼 클라이언트가 정의한 문자열인 이름과 관계 설정이 있다. 저장소 매개변수에는 샤딩 설정, 그리고 Zanzibar가 정수, 문자열 및 기타 객체 ID 형식의 저장을 최적화하는 데 도움이 되는 객체 ID 인코딩이 포함된다.
  s2-3-1:
    text: 관계 설정과 유저셋 재작성
  s2-3-1-p1:
    text: 관계 튜플은 객체와 사용자 사이의 관계를 반영하지만, 실효 ACL을 완전히 정의하지는 않는다. 예를 들어 어떤 클라이언트는 각 객체에 대해 `editor` 권한을 가진 사용자가 같은 객체에 대해 `viewer` 권한도 가져야 한다고 지정한다. 이러한 관계 간의 관계는 객체마다 관계 튜플 하나로 표현할 수 있지만, 네임스페이스의 모든 객체에 대해 튜플을 저장하는 것은 낭비이며 모든 객체에 걸친 수정을 어렵게 만든다. 대신 우리는 클라이언트가 관계 설정의 *유저셋 재작성 규칙*을 통해 객체와 무관한 관계를 정의할 수 있게 한다. [그림 1](#fig-1)은 `viewer`가 `editor`를 포함하고 `editor`가 `owner`를 포함하는 동심원 관계를 가진 간단한 네임스페이스 설정을 보여 준다.
  fig-1:
    caption: "그림 1: 문서에 대한 동심원 관계를 가진 간단한 네임스페이스 설정. 모든 소유자는 편집자이고, 모든 편집자는 열람자다. 또한 상위 폴더의 열람자는 그 문서의 열람자이기도 하다."
  s2-3-1-p2:
    text: "유저셋 재작성 규칙은 네임스페이스 내에서 관계별로 정의된다. 각 규칙은 객체 ID를 입력으로 받아 유저셋 표현식 트리를 출력하는 함수를 지정한다. 트리의 각 리프 노드는 다음 중 하나일 수 있다."
  s2-3-1-leaves:
    items:
      - "`_this`: ⟨*object#relation*⟩ 쌍에 대해 저장된 관계 튜플의 모든 사용자를 반환하며, 튜플의 유저셋이 참조하는 간접 ACL도 포함한다. 재작성 규칙이 지정되지 않았을 때의 기본 동작이다."
      - "`computed_userset`: 입력 객체에 대해 새로운 유저셋을 계산한다. 예를 들어 이를 통해 `viewer` 관계의 유저셋 표현식이 같은 객체의 `editor` 유저셋을 참조할 수 있으므로, 관계 사이의 ACL 상속 기능을 제공한다."
      - "`tuple_to_userset`: 입력 객체로부터 튜플셋([§2.4.1](#s2-4-1))을 계산하고, 그 튜플셋과 일치하는 관계 튜플을 가져온 다음, 가져온 각 관계 튜플로부터 유저셋을 계산한다. 이 유연한 기본 요소를 통해 클라이언트는 “문서의 상위 폴더를 찾아 그 열람자를 상속한다”와 같은 복잡한 정책을 표현할 수 있다."
  s2-3-1-p3:
    text: 유저셋 표현식은 여러 하위 표현식을 합집합, 교집합, 차집합(exclusion) 같은 연산으로 결합하여 구성할 수도 있다.
  s2-4:
    text: API
  s2-4-p1:
    text: ACL 검사를 지원하는 것 외에도 Zanzibar는 클라이언트가 관계 튜플을 읽고 쓰고, 튜플 갱신을 감시하고, 실효 ACL을 검사할 수 있는 API를 제공한다.
  s2-4-p2:
    text: 이 API 메서드 전반에 걸쳐 사용되는 개념이 *zookie*다. zookie는 ACL 쓰기, 클라이언트 콘텐츠 버전 또는 읽기 스냅샷을 반영하는, 전역적으로 의미 있는 타임스탬프를 인코딩한 불투명한 바이트 시퀀스다. ACL 읽기 및 검사 요청의 zookie는 스냅샷 읽기의 오래된 정도 한도를 지정하며, 이를 통해 Zanzibar의 핵심 일관성 속성 중 하나를 제공한다. 우리는 클라이언트가 임의의 타임스탬프를 선택하지 않도록 유도하고 향후 확장을 허용하기 위해, 실제 타임스탬프 대신 불투명한 쿠키를 사용하기로 했다.
  s2-4-1:
    text: Read
  s2-4-1-p1:
    text: 클라이언트는 사용자에게 ACL이나 그룹 멤버십을 표시하거나 후속 쓰기를 준비하기 위해 관계 튜플을 읽는다. 읽기 요청은 하나 이상의 *튜플셋*과 선택적인 zookie를 지정한다.
  s2-4-1-p2:
    text: 각 *튜플셋*은 관계 튜플 집합의 키를 지정한다. 이 집합은 단일 튜플 키를 포함할 수도 있고, 네임스페이스에서 주어진 객체 ID나 유저셋을 가진 모든 튜플을 포함할 수도 있으며, 선택적으로 관계 이름으로 제한할 수 있다. 튜플셋을 사용하여 클라이언트는 특정 멤버십 항목을 조회하거나, ACL 또는 그룹의 모든 항목을 읽거나, 주어진 사용자를 직접 멤버로 갖는 모든 그룹을 조회할 수 있다. 읽기 요청의 모든 튜플셋은 단일 스냅샷에서 처리된다.
  s2-4-1-p3:
    text: zookie를 사용하여 클라이언트는 쓰기 응답의 zookie를 읽기 요청에 넣으면 이전 쓰기보다 이르지 않은 읽기 스냅샷을 요청할 수 있고, 이전 읽기 응답의 zookie를 후속 요청에 넣으면 이전 읽기와 같은 스냅샷을 요청할 수 있다. 요청에 zookie가 포함되어 있지 않으면 Zanzibar는 적당히 최근의 스냅샷을 선택하며, zookie가 제공된 경우보다 더 낮은 지연 시간으로 응답할 수 있다.
  s2-4-1-p4:
    text: 읽기 결과는 관계 튜플의 내용에만 의존하며 유저셋 재작성 규칙을 반영하지 않는다. 예를 들어 `viewer` 유저셋이 항상 `owner` 유저셋을 포함하더라도, `viewer` 관계를 가진 튜플을 읽으면 `owner` 관계를 가진 튜플은 반환되지 않는다. 실효 유저셋을 파악해야 하는 클라이언트는 Expand API([§2.4.5](#s2-4-5))를 사용할 수 있다.
  s2-4-2:
    text: Write
  s2-4-2-p1:
    text: "클라이언트는 ACL을 추가하거나 제거하기 위해 단일 관계 튜플을 수정할 수 있다. 또한 낙관적 동시성 제어 [[21](#ref-21)]를 사용하는 읽기-수정-쓰기 과정을 통해 객체와 관련된 모든 튜플을 수정할 수도 있는데, 이 과정은 read RPC 다음에 write RPC를 사용한다."
  s2-4-2-steps:
    items:
      - 객체별 “락” 튜플을 포함하여 객체의 모든 관계 튜플을 읽는다.
      - 쓰거나 삭제할 튜플을 생성한다. 락 튜플에 대한 터치(touch)와 함께 쓰기를 Zanzibar에 보내되, 읽기 이후 락 튜플이 수정되지 않은 경우에만 쓰기가 커밋된다는 조건을 붙인다.
      - 쓰기 조건이 충족되지 않으면 1단계로 돌아간다.
  s2-4-2-p2:
    text: 락 튜플은 클라이언트가 쓰기 경합을 감지하기 위해 사용하는 일반 관계 튜플일 뿐이다.
  s2-4-3:
    text: Watch
  s2-4-3-p1:
    text: 일부 클라이언트는 Zanzibar에 있는 관계 튜플의 보조 인덱스를 유지한다. 클라이언트는 Watch API로 이를 수행할 수 있다. Watch 요청은 하나 이상의 네임스페이스와 감시를 시작할 시점을 나타내는 zookie를 지정한다. Watch 응답에는 요청된 시작 타임스탬프부터 Watch 응답에 포함된 *하트비트 zookie*에 인코딩된 타임스탬프까지의 모든 튜플 수정 이벤트가 타임스탬프 오름차순으로 담긴다. 클라이언트는 하트비트 zookie를 사용하여 이전 Watch 응답이 끝난 지점부터 감시를 재개할 수 있다.
  s2-4-4:
    text: Check
  s2-4-4-p1:
    text: Check 요청은 ⟨*object#relation*⟩으로 표현되는 유저셋, 흔히 인증 토큰으로 표현되는 대상 사용자(putative user), 그리고 원하는 객체 버전에 대응하는 zookie를 지정한다. 읽기와 마찬가지로 Check는 항상 주어진 zookie보다 이르지 않은 일관된 스냅샷에서 평가된다.
  s2-4-4-p2:
    text: 애플리케이션 콘텐츠 수정을 인가하기 위해 클라이언트는 특별한 유형의 Check 요청인 *content-change* 검사를 보낸다. content-change 검사 요청은 zookie를 포함하지 않으며 최신 스냅샷에서 평가된다. 콘텐츠 변경이 인가되면 검사 응답에는 zookie가 포함되며, 클라이언트는 이를 객체 내용과 함께 저장했다가 해당 콘텐츠 버전에 대한 후속 검사에 사용한다. zookie는 평가 스냅샷을 인코딩하며, ACL 변경에서 콘텐츠 변경으로 이어지는 모든 가능한 인과 관계를 포착한다. zookie의 타임스탬프는 새 콘텐츠를 보호하는 ACL 갱신의 타임스탬프보다 크기 때문이다([§2.2](#s2-2)).
  s2-4-5:
    text: Expand
  s2-4-5-p1:
    text: Expand API는 ⟨*object#relation*⟩ 쌍과 선택적인 zookie가 주어지면 실효 유저셋을 반환한다. Read API와 달리 Expand는 유저셋 재작성 규칙을 통해 표현된 간접 참조를 따라간다. 결과는 *유저셋 트리*로 표현되는데, 리프 노드는 사용자 ID 또는 다른 ⟨*object#relation*⟩ 쌍을 가리키는 유저셋이고, 중간 노드는 합집합, 교집합, 차집합 연산자를 나타낸다. Expand는 클라이언트가 자신의 객체에 접근할 수 있는 사용자와 그룹의 전체 집합을 파악하는 데 매우 중요하며, 이를 통해 접근 제어되는 콘텐츠에 대한 효율적인 검색 인덱스를 구축할 수 있다.
  s3:
    text: 아키텍처와 구현
  s3-p1:
    text: "[그림 2](#fig-2)는 Zanzibar 시스템의 아키텍처를 보여 준다. `aclservers`는 주된 서버 유형이다. 이 서버들은 클러스터로 구성되며 Check, Read, Expand, Write 요청에 응답한다. 요청은 클러스터 내 임의의 서버에 도착하고, 그 서버는 필요에 따라 클러스터 내 다른 서버로 작업을 팬아웃한다. 그 서버들은 다시 중간 결과를 계산하기 위해 다른 서버에 연락할 수 있다. 처음 요청을 받은 서버가 최종 결과를 모아 클라이언트에 반환한다."
  s3-p2:
    text: Zanzibar는 ACL과 그 메타데이터를 Spanner 데이터베이스에 저장한다. 클라이언트 네임스페이스마다 관계 튜플을 저장하는 데이터베이스가 하나씩 있고, 모든 네임스페이스 설정을 보관하는 데이터베이스가 하나, 그리고 모든 네임스페이스가 공유하는 변경 로그 데이터베이스가 하나 있다. `aclservers`는 클라이언트 요청에 응답하는 과정에서 이 데이터베이스들을 읽고 쓴다.
  s3-p3:
    text: "`watchservers`는 Watch 요청에 응답하는 특수한 서버 유형이다. 이 서버들은 변경 로그를 추적(tail)하여 네임스페이스 변경 스트림을 거의 실시간으로 클라이언트에 제공한다."
  s3-p4:
    text: Zanzibar는 주기적으로 데이터 처리 파이프라인을 실행하여 Spanner에 있는 모든 Zanzibar 데이터에 대해 다양한 오프라인 기능을 수행한다. 그러한 기능 중 하나는 알려진 스냅샷 타임스탬프에서 각 네임스페이스의 관계 튜플 덤프를 생성하는 것이다. 또 다른 기능은 네임스페이스별로 설정된 임계값보다 오래된 튜플 버전을 가비지 컬렉션하는 것이다.
  fig-2:
    alt: 아키텍처 다이어그램. 클라이언트는 서로 연결된 aclservers로 이루어진 Zanzibar 서빙 클러스터에 Check, Read, Expand, Write를 보낸다. aclservers는 Spanner 글로벌 데이터베이스 시스템에 있는 네임스페이스 설정과 네임스페이스별 관계 튜플을 읽고 쓰며, 변경 로그에 추가한다. watchserver는 변경 로그를 추적하여 클라이언트와 Leopard 인덱싱 시스템에 Watch를 제공한다. 주기적인 오프라인 파이프라인은 Spanner를 읽고 쓰며 네임스페이스 스냅샷을 덤프하고, Leopard가 이를 읽는다. Leopard는 aclservers에 최적화된 집합 연산을 제공한다.
    caption: "그림 2: Zanzibar 아키텍처. 화살표는 데이터 흐름의 방향을 나타낸다."
  s3-p5:
    text: Leopard는 크고 깊게 중첩된 집합에 대한 연산을 최적화하는 데 사용되는 인덱싱 시스템이다. Leopard는 ACL 데이터의 주기적 스냅샷을 읽고 스냅샷 사이의 변경을 감시한다. 그 데이터에 대해 비정규화 같은 변환을 수행하고 `aclservers`의 요청에 응답한다.
  s3-p6:
    text: 이 절의 나머지 부분에서는 이러한 아키텍처 요소의 구현을 더 자세히 설명한다.
  s3-1:
    text: 저장소
  s3-1-1:
    text: 관계 튜플 저장소
  s3-1-1-p1:
    text: 우리는 각 네임스페이스의 관계 튜플을 별도의 데이터베이스에 저장하며, 각 행은 기본 키 *(샤드 ID, 객체 ID, 관계, 사용자, 커밋 타임스탬프)*로 식별된다. 여러 튜플 버전이 서로 다른 행에 저장되므로, 가비지 컬렉션 기간 내의 어떤 타임스탬프에서든 검사와 읽기를 평가할 수 있다. 기본 키의 순서 덕분에 주어진 객체 ID 또는 *(객체 ID, 관계)* 쌍에 대한 모든 관계 튜플을 조회할 수 있다.
  s3-1-1-p2:
    text: 클라이언트는 네임스페이스의 데이터 패턴에 따라 샤딩을 설정한다. 보통 샤드 ID는 객체 ID만으로 결정된다. 일부 경우, 예를 들어 네임스페이스가 멤버 수가 매우 많은 그룹을 저장하는 경우에는 샤드 ID를 객체 ID와 사용자 모두로부터 계산한다.
  s3-1-2:
    text: 변경 로그
  s3-1-2-p1:
    text: Zanzibar는 또한 Watch API를 위해 튜플 갱신 이력을 저장하는 변경 로그 데이터베이스를 유지한다. 기본 키는 *(변경 로그 샤드 ID, 타임스탬프, 고유 갱신 ID)*이며, 변경 로그 샤드는 쓰기마다 무작위로 선택된다.
  s3-1-2-p2:
    text: 모든 Zanzibar 쓰기는 단일 트랜잭션으로 튜플 저장소와 변경 로그 샤드 모두에 커밋된다. 우리는 보류 중인 트랜잭션 때문에 변경 로그 읽기가 차단되는 일을 최소화하기 위해, 변경 로그 샤드를 호스팅하는 Spanner 서버를 트랜잭션 코디네이터로 지정한다.
  s3-1-3:
    text: 네임스페이스 설정 저장소
  s3-1-3-p1:
    text: 네임스페이스 설정은 두 개의 테이블을 가진 데이터베이스에 저장된다. 한 테이블은 설정을 담고 있으며 네임스페이스 ID를 키로 한다. 다른 테이블은 설정 갱신의 변경 로그이며 커밋 타임스탬프를 키로 한다. 이 구조 덕분에 Zanzibar 서버는 시작 시 모든 설정을 로드하고 변경 로그를 모니터링하여 설정을 지속적으로 갱신할 수 있다.
  s3-1-4:
    text: 복제
  s3-1-4-p1:
    text: 지연 시간을 줄이기 위해 Zanzibar 데이터는 클라이언트 가까이에 있도록 복제된다. 복제본은 전 세계 수십 곳에 존재하며, 리전마다 여러 개의 복제본이 있다. 5개의 투표 복제본은 미국 동부와 중부에 있으며, 장애를 격리하기 위해 서로 다른 3개 대도시권에 두되 Paxos 트랜잭션이 빠르게 커밋되도록 서로 25밀리초 이내에 위치한다.
  s3-2:
    text: 서빙
  s3-2-1:
    text: 평가 타임스탬프
  s3-2-1-p1:
    text: "[§2.4](#s2-4)에서 언급했듯이 클라이언트는 zookie를 제공하여 요청 평가에 대한 최소 스냅샷 타임스탬프를 보장할 수 있다. zookie가 제공되지 않으면 서버는 기본 오래된 정도를 사용하는데, 이는 지연 시간에 영향을 주지 않는 범위에서 모든 트랜잭션이 가능한 한 최근의 타임스탬프에서 평가되도록 선택된다."
  s3-2-1-p2:
    text: Zanzibar는 Spanner에 보내는 각 읽기 요청에 대해, 해당 타임스탬프의 데이터가 존 외부 읽기를 필요로 하여 추가 지연 시간이 발생했는지 여부에 대한 힌트를 받는다. 각 서버는 기본 오래된 정도의 데이터뿐 아니라 그보다 더 최신이거나 더 오래된 데이터에 대해서도 이러한 존 외부 읽기의 빈도를 추적하고, 이 빈도를 사용하여 각 오래된 정도에서 임의의 데이터 조각이 로컬에서 사용 가능할 확률에 대한 이항 비율 신뢰 구간을 계산한다.
  s3-2-1-p3:
    text: 충분한 데이터를 수집하면 서버는 각 오래된 정도 값이 존 외부 읽기를 유발할 확률이 충분히 낮아 낮은 지연 시간을 낼 수 있는지 확인한다. 그렇다면 기본 오래된 정도 한도를 가장 낮은 “안전한” 값으로 갱신한다. 알려진 오래된 정도 값 중 안전한 것이 없으면, 두 비율 z-검정을 사용하여 기본값을 늘리는 것이 통계적으로 유의미한 정도로 더 안전한지 확인한다. 그런 경우에는 지연 시간 개선을 기대하며 기본값을 늘린다. 이 기본 오래된 정도 메커니즘은 순전히 성능 최적화다. Zanzibar는 zookie가 제공되면 항상 이를 준수하므로 일관성 의미론을 위반하지 않는다.
  s3-2-2:
    text: 설정 일관성
  s3-2-2-p1:
    text: 네임스페이스 설정의 변경은 ACL 평가 결과와 그에 따른 정확성을 바꿀 수 있으므로, Zanzibar는 각 클라이언트 요청을 평가할 때 설정 메타데이터에 대해 단일 스냅샷 타임스탬프를 선택한다. 클러스터 내 모든 `aclservers`는 같은 요청에 대해 같은 타임스탬프를 사용하며, 원래 클라이언트 요청에서 팬아웃되는 모든 하위 요청에도 마찬가지다.
  s3-2-2-p2:
    text: 각 서버는 네임스페이스 설정이 변경될 때마다 저장소에서 독립적으로 지속적으로 로드한다([§3.1.3](#s3-1-3)). 따라서 클러스터 내 각 서버는 재시작이나 네트워크 지연 때문에 서로 다른 범위의 설정 타임스탬프에 접근할 수 있다. Zanzibar는 모든 서버에서 사용 가능한 타임스탬프를 골라야 한다. 이를 위해 모니터링 작업이 모든 서버에서 사용 가능한 타임스탬프 범위를 추적하고 집계하여, 전역적으로 사용 가능한 범위를 다른 모든 서버에 알린다. 서버는 들어오는 각 요청에 대해 이 범위에서 시점을 고르므로, 설정 저장소에서 더 이상 읽을 수 없게 되더라도 모든 서버가 계속 서빙할 수 있다.
  s3-2-3:
    text: 검사 평가
  s3-2-3-p1:
    text: Zanzibar는 검사 요청을 불리언 표현식으로 변환하여 ACL 검사를 평가한다. 유저셋 재작성 규칙이 없는 단순한 경우, 사용자 $U$를 유저셋 ⟨*object#relation*⟩에 대해 검사하는 것은 다음과 같이 표현할 수 있다.
  s3-2-3-p2:
    text: 유효한 $U' = \langle \mathit{object}'\#\mathit{relation}' \rangle$를 찾으려면 모든 간접 ACL 또는 그룹에 대한 멤버십을 재귀적으로 평가해야 한다. 이러한 종류의 “포인터 추적”은 대부분의 ACL 및 그룹 유형에서 잘 작동하지만, 간접 ACL이나 그룹이 깊거나 넓으면 비용이 커질 수 있다. [§3.2.4](#s3-2-4)에서 이 문제를 어떻게 처리하는지 설명한다. 유저셋 재작성 규칙도 검사 평가의 일부로 불리언 표현식으로 변환된다.
  s3-2-3-p3:
    text: 검사 지연 시간을 최소화하기 위해 우리는 불리언 표현식 트리의 모든 리프 노드를 동시에 평가한다. 한 노드의 결과가 서브트리의 결과를 결정하면 그 서브트리의 다른 노드에 대한 평가는 취소된다.
  s3-2-3-p4:
    text: 리프 노드의 평가에는 대개 데이터베이스에서 관계 튜플을 읽는 작업이 수반된다. 우리는 Spanner에 보내는 read RPC 수를 최소화하기 위해, 같은 ACL 검사에 대한 읽기를 묶는 풀링 메커니즘을 적용한다.
  s3-2-4:
    text: Leopard 인덱싱 시스템
  s3-2-4-p1:
    text: 검사 평가 중의 재귀적 포인터 추적은 깊게 중첩되었거나 하위 그룹이 매우 많은 그룹에 대해 낮은 지연 시간을 유지하기 어렵다. 이러한 구조를 보이는 일부 선택된 네임스페이스에 대해, Zanzibar는 효율적인 집합 연산을 지원하는 특수 인덱스인 Leopard를 사용하여 검사를 처리한다.
  s3-2-4-p2:
    text: Leopard 인덱스는 $(T, s, e)$ 튜플을 사용하여 이름 있는 집합의 모음을 표현하는데, 여기서 $T$는 집합 유형을 나타내는 열거형이고 $s$와 $e$는 각각 집합 ID와 원소 ID를 나타내는 64비트 정수다. 쿼리는 이름 있는 집합들의 합집합, 교집합 또는 차집합으로 이루어진 표현식을 평가하고, 지정된 개수까지의 결과 집합을 원소 ID 순으로 정렬하여 반환한다.
  s3-2-4-p3:
    text: "그룹 멤버십을 인덱싱하고 평가하기 위해 Zanzibar는 두 가지 집합 유형 $\\textsf{GROUP2GROUP}$과 $\\textsf{MEMBER2GROUP}$으로 그룹 멤버십을 표현하며, 여기서는 이를 집합 ID에서 원소 ID로의 함수로 나타낸다."
  s3-2-4-sets:
    items:
      - $\textsf{GROUP2GROUP}(s) \to \{e\}$. 여기서 $s$는 조상 그룹을 나타내고 $e$는 그 조상 그룹의 *직접 또는 간접* 하위 그룹인 자손 그룹을 나타낸다.
      - $\textsf{MEMBER2GROUP}(s) \to \{e\}$. 여기서 $s$는 개별 사용자를 나타내고 $e$는 그 사용자가 *직접* 멤버로 속한 부모 그룹을 나타낸다.
  s3-2-4-p4:
    text: 사용자 $U$가 그룹 $G$의 멤버인지 평가하기 위해 우리는 다음을 확인한다.
  s3-2-4-p5:
    text: 그룹 멤버십은 노드가 그룹과 사용자를 나타내고 간선이 직접 멤버십을 나타내는 그래프에서의 도달 가능성 문제로 볼 수 있다. 그룹 간 경로를 평탄화하면 Leopard가 도달 가능성을 효율적으로 평가할 수 있으며, 데이터 패턴이 요구하는 바에 따라 다른 유형의 비정규화도 적용할 수 있다.
  s3-2-4-p6:
    text: "Leopard 시스템은 세 개의 개별 부분으로 구성된다. 집합에 걸쳐 일관되고 지연 시간이 낮은 연산을 수행할 수 있는 서빙 시스템, 오프라인의 주기적인 인덱스 구축 시스템, 그리고 튜플 변경이 발생할 때 서빙 시스템을 지속적으로 갱신할 수 있는 온라인 실시간 계층이다."
  s3-2-4-p7:
    text: 인덱스 튜플은 스킵 리스트 같은 구조에 정수의 정렬된 리스트로 저장되므로 집합 간의 합집합과 교집합을 효율적으로 계산할 수 있다. 예를 들어 두 집합 $A$와 $B$의 교집합을 평가하는 데는 $O(\min(|A|, |B|))$번의 스킵 리스트 탐색만 필요하다. 인덱스는 원소 ID로 샤딩되며 여러 서버에 분산될 수 있다. 샤드는 보통 전적으로 메모리에서 서빙되지만, 메모리와 원격 솔리드 스테이트 장치에 걸쳐 분산된 핫 데이터와 콜드 데이터를 혼합하여 서빙될 수도 있다.
  s3-2-4-p8:
    text: 오프라인 인덱스 빌더는 Zanzibar 관계 튜플과 설정의 스냅샷으로부터 인덱스 샤드를 생성하고, 그 샤드를 전 세계에 복제한다. 인덱스 빌더는 유저셋 재작성 규칙을 준수하며, ACL 그래프의 간선을 재귀적으로 확장하여 Leopard 인덱스 튜플을 형성한다. Leopard 서버는 새 샤드를 지속적으로 감시하다가 새 샤드가 사용 가능해지면 기존 샤드를 새 샤드로 교체한다.
  s3-2-4-p9:
    text: 지금까지 설명한 Leopard 시스템은 깊고 넓게 중첩된 그룹 멤버십을 효율적으로 평가할 수 있지만, 오프라인 인덱스 생성과 샤드 교체 때문에 최신의 일관된 스냅샷에서는 그렇게 할 수 없다. 일관된 ACL 평가를 지원하기 위해 Leopard 서버는 오프라인 스냅샷 이후의 모든 갱신을 인덱싱하는 증분 계층을 유지한다. 각 갱신은 $(T, s, e, t, d)$ 튜플로 표현되며, 여기서 $t$는 갱신의 타임스탬프이고 $d$는 삭제 표시다. 쿼리 처리 중에는 쿼리 타임스탬프 이하의 타임스탬프를 가진 갱신이 오프라인 인덱스 위에 병합된다.
  s3-2-4-p10:
    text: 증분 계층을 유지하기 위해 Leopard 증분 인덱서는 Zanzibar의 Watch API를 호출하여 시간 순으로 정렬된 Zanzibar 튜플 수정 스트림을 받고, 그 갱신을 시간 순으로 정렬된 Leopard 튜플 추가, 갱신, 삭제 스트림으로 변환한다. $\textsf{GROUP2GROUP}$ 튜플에 대한 갱신을 생성하려면, 증분 인덱서는 하나의 관계 튜플 갱신이 미치는 영향을 잠재적으로 여러 개의 인덱스 갱신으로 비정규화하기 위해 그룹 간 멤버십을 유지해야 한다.
  s3-2-4-p11:
    text: 실제로 Zanzibar 튜플 하나의 추가나 삭제는 잠재적으로 수만 개의 개별 Leopard 튜플 이벤트를 낳을 수 있다. 각 Leopard 서빙 인스턴스는 Watch API를 통해 이러한 Zanzibar 튜플 변경의 전체 스트림을 받는다. Leopard 서빙 시스템은 쿼리 서빙에 미치는 영향을 최소화하면서 이 스트림을 지속적으로 수집하고 다양한 포스팅 리스트를 갱신하도록 설계되었다.
  s3-2-5:
    text: 핫스팟 처리
  s3-2-5-p1:
    text: ACL 읽기와 검사 워크로드는 버스트성이 강하고 핫스팟이 생기기 쉽다. 예를 들어 검색 쿼리에 응답하려면 모든 후보 결과에 대해 ACL 검사를 수행해야 하는데, 이들의 ACL은 흔히 공통 그룹이나 간접 ACL을 공유한다. 일관성을 용이하게 하기 위해 Zanzibar는 저장소 비정규화를 피하고 정규화된 데이터에만 의존한다([§3.2.4](#s3-2-4)에서 설명한 경우는 제외). 정규화된 데이터에서는 공통 ACL(예를 들어 인기 있는 그룹)의 핫스팟이 하부 데이터베이스 서버에 과부하를 일으킬 수 있다. 우리는 핫스팟 처리가 낮은 지연 시간과 높은 가용성을 추구하는 데 있어 가장 중요한 최전선임을 알게 되었다.
  s3-2-5-p2:
    text: 각 클러스터의 Zanzibar 서버들은 읽기와 검사 평가 모두를 위한 분산 캐시를 형성하며, 여기에는 포인터 추적 중에 평가된 중간 검사 결과도 포함된다. 캐시 항목은 일관된 해싱 [[20](#ref-20)]으로 Zanzibar 서버들에 분산된다. 검사나 읽기를 처리하기 위해 우리는 내부 RPC 인터페이스를 통해 해당 Zanzibar 서버로 요청을 팬아웃한다. 내부 RPC 수를 최소화하기 위해 대부분의 네임스페이스에서는 객체 ID로부터 포워딩 키를 계산한다. ⟨*object#relation*⟩에 대한 검사를 처리하는 데에는 흔히 같은 객체의 다른 관계에 대한 간접 ACL 검사와 그 객체의 관계 튜플 읽기가 수반되기 때문이다. 이러한 검사와 읽기는 부모 검사 요청과 같은 포워딩 키를 공유하므로 같은 서버에서 처리될 수 있다. 핫 포워딩 키를 처리하기 위해 우리는 내부 RPC의 호출자와 피호출자 양쪽에서 결과를 캐싱하여 사실상 캐시 트리를 형성한다. 또한 Slicer [[12](#ref-12)]를 사용하여 핫 키를 여러 서버에 분산하는 데 도움을 받는다.
  s3-2-5-p3:
    text: 우리는 스냅샷 타임스탬프를 캐시 키에 인코딩하여 다른 스냅샷에서 평가된 결과를 재사용하지 않도록 한다. 요청 zookie의 오래된 정도 제약을 준수하면서, 평가 타임스탬프를 1초나 10초 같은 거친 단위로 올림하여 선택한다. 이러한 타임스탬프 양자화 덕분에 캐시 키에 마이크로초 해상도의 타임스탬프가 들어 있음에도 최근 검사와 읽기의 대다수가 같은 타임스탬프에서 평가되어 캐시 결과를 공유할 수 있다. 타임스탬프를 올림해도 Zanzibar의 일관성 속성에는 영향을 주지 않는다는 점에 주목할 만하다. Spanner는 타임스탬프 $T$에서의 스냅샷 읽기가 $T$까지의 모든 쓰기를 관측하도록 보장하기 때문이다. 이는 $T$가 미래인 경우에도 성립하며, 그 경우 읽기는 TrueTime이 $T$를 지날 때까지 기다린다.
  s3-2-5-p4:
    text: 캐시가 결과로 채워지기 전에 동시 요청들이 순간적인 핫스팟을 만드는 “캐시 스탬피드” 문제 [[3](#ref-3)]를 처리하기 위해, 우리는 각 서버에 *락 테이블*을 유지하여 처리 중인 읽기와 검사를 추적한다. 같은 캐시 키를 공유하는 요청 중에서는 하나의 요청만 처리를 시작하고, 나머지는 캐시가 채워질 때까지 블록된다.
  s3-2-5-p5:
    text: 우리는 분산 캐시와 락 테이블로 핫스팟의 대다수를 효과적으로 처리할 수 있다. 시간이 지나면서 우리는 다음 두 가지 개선을 했다.
  s3-2-5-p6:
    text: 첫째, 객체와 관계에 대한 사용자의 직접 멤버십 검사(즉 ⟨*object#relation@user*⟩)는 보통 관계 튜플 조회 한 번으로 처리된다. 그러나 가끔 매우 인기 있는 객체에 서로 다른 사용자에 대한 동시 검사가 많이 몰려, 그 객체의 관계 튜플을 호스팅하는 저장소 서버에 핫스팟이 생긴다. 이러한 핫스팟을 피하기 위해 우리는 핫 객체에 대해 ⟨*object#relation*⟩의 관계 튜플을 *모두* 읽어 캐싱하며, 읽기 대역폭을 내주는 대신 캐시 가능성을 얻는다. 각 객체에 대해 처리 중인 읽기 수를 추적하여 이 방법을 적용할 핫 객체를 동적으로 감지한다.
  s3-2-5-p7:
    text: 둘째, 간접 ACL 검사는 부모 ACL 검사의 결과가 이미 결정되면 자주 취소된다. 이 경우 캐시 키가 채워지지 않은 채로 남는다. 조기 취소는 자원 사용을 크게 줄이지만, 락 테이블 항목에 의해 블록된 동시 요청의 지연 시간에는 부정적인 영향을 미친다. 이러한 지연 시간 영향을 방지하기 위해, 해당 락 테이블 항목에 대기자가 있으면 조기 취소를 지연시킨다.
  s3-2-6:
    text: 성능 격리
  s3-2-6-p1:
    text: 성능 격리는 낮은 지연 시간과 높은 가용성을 목표로 하는 공유 서비스에 필수적이다. Zanzibar나 그 클라이언트 중 하나가 예상치 못한 사용 패턴을 처리하기에 충분한 자원을 가끔 확보하지 못하더라도, 다음의 격리 메커니즘은 성능 문제가 문제를 일으킨 사용 사례로 격리되어 다른 클라이언트에 악영향을 주지 않도록 보장한다.
  s3-2-6-p2:
    text: 첫째, CPU 용량을 적절히 할당하기 위해 Zanzibar는 각 RPC의 비용을 하드웨어에 무관한 지표인 일반화된 *cpu-seconds* 단위로 측정한다. 각 클라이언트에는 초당 최대 CPU 사용량에 대한 글로벌 한도가 있으며, 클라이언트가 한도를 초과하고 *동시에* 전체 시스템에 여유 용량이 없으면 그 클라이언트의 RPC가 스로틀링된다.
  s3-2-6-p3:
    text: 각 Zanzibar 서버는 메모리 사용량을 제어하기 위해 처리 중인 RPC의 총수도 제한한다. 마찬가지로 클라이언트별로 처리 중인 RPC 수도 제한한다.
  s3-2-6-p4:
    text: Zanzibar는 더 나아가 각 Spanner 서버에서 *(객체, 클라이언트)*별 및 클라이언트별 최대 동시 읽기 수를 제한한다. 이를 통해 어떤 단일 객체나 클라이언트도 Spanner 서버를 독점할 수 없게 된다.
  s3-2-6-p5:
    text: 마지막으로, Spanner가 한 클라이언트에 적용하는 스로틀링이 다른 클라이언트에 영향을 주지 않도록 서로 다른 클라이언트의 요청에 서로 다른 락 테이블 키를 사용한다.
  s3-2-7:
    text: 꼬리 지연 시간 완화
  s3-2-7-p1:
    text: Zanzibar의 분산 처리에는 느린 작업에 대응하기 위한 조치가 필요하다. Spanner와 Leopard 인덱스에 대한 호출에는 요청 헤징 [[16](#ref-16)]을 활용한다(즉, 같은 요청을 여러 서버에 보내고 먼저 돌아오는 응답을 사용하며 나머지 요청은 취소한다). 왕복 시간을 줄이기 위해 Zanzibar 서버가 있는 모든 지리적 리전에 이러한 백엔드 서비스의 복제본을 적어도 두 개 배치하려고 한다. 불필요하게 부하를 늘리지 않도록, 먼저 하나의 요청을 보내고 초기 요청이 느리다는 것이 확인될 때까지 헤지 요청의 전송을 미룬다.
  s3-2-7-p2:
    text: 적절한 헤징 지연 임계값을 결정하기 위해, 각 서버는 최근 측정값을 기반으로 *N*번째 백분위수 지연 시간을 동적으로 계산하는 지연 추정기를 유지한다. 이 메커니즘 덕분에 헤징으로 인한 추가 트래픽을 전체 트래픽의 작은 비율로 제한할 수 있다.
  s3-2-7-p3:
    text: 효과적인 헤징을 위해서는 요청들의 비용이 비슷해야 한다. Zanzibar의 인가 검사의 경우, 일부 검사는 더 많은 작업을 필요로 하기 때문에 본질적으로 다른 검사보다 시간이 더 걸린다. 검사 요청을 헤징하면 가장 비싼 워크로드가 중복되어 역설적으로 지연 시간이 악화된다. 따라서 우리는 Zanzibar 서버 간의 요청은 헤징하지 않고, 앞서 논의한 여러 복제본 간의 샤딩과 모니터링 메커니즘에 의존하여 느린 서버를 감지하고 피한다.
  s4:
    text: 경험
  s4-p1:
    text: Zanzibar는 5년 넘게 프로덕션에서 사용되어 왔다. 그 기간 내내 Zanzibar를 사용하는 클라이언트 수와 그들이 Zanzibar에 가하는 부하는 꾸준히 증가했다. 이 절에서는 Zanzibar를 글로벌 분산 인가 시스템으로 운영한 경험을 논의한다.
  s4-p2:
    text: Zanzibar는 수백 개의 클라이언트 애플리케이션이 정의한 1,500개 이상의 네임스페이스를 관리한다. 네임스페이스 설정 파일의 크기는 그 네임스페이스가 구현하는 접근 제어 정책의 복잡도를 대략적으로 나타내는 척도가 된다. 이러한 설정 파일은 수십 줄에서 수천 줄에 이르며, 중앙값은 500줄 가까이 된다.
  s4-p3:
    text: 이 네임스페이스들에는 100테라바이트에 가까운 공간을 차지하는 2조 개 이상의 관계 튜플이 들어 있다. 네임스페이스당 튜플 수는 수십 개에서 1조 개까지 여러 자릿수에 걸쳐 분포하며, 중앙값은 15,000개 가까이 된다. 이 데이터는 사용자와의 근접성과 높은 가용성을 모두 유지하기 위해 전 세계 30곳 이상에 완전히 복제된다.
  s4-p4:
    text: Zanzibar는 초당 1,000만 건 이상의 클라이언트 쿼리(QPS)를 처리한다. 2018년 12월의 7일간 표본 기간 동안 Check 요청은 최대 약 4.2M QPS, Read는 8.2M, Expand는 760K, Write는 25K에 달했다. 따라서 데이터를 읽는 쿼리가 데이터를 쓰는 쿼리보다 두 자릿수 더 빈번하다.
  s4-p5:
    text: Zanzibar는 이 부하를 전 세계 수십 개 클러스터로 구성된 10,000대 이상의 서버에 분산한다. 클러스터당 서버 수는 100대 미만에서 1,000대 이상에 이르며, 중앙값은 500대 가까이 된다. 클러스터 크기는 해당 지리적 리전의 부하에 비례하여 정해진다.
  s4-1:
    text: 요청
  s4-1-p1:
    text: "우리는 요청을 필요한 데이터 최신성에 따라 두 범주로 나눈다. 데이터 최신성은 요청의 지연 시간과 가용성에 큰 영향을 미칠 수 있다. 구체적으로 Check, Read, Expand 요청은 평가 타임스탬프의 하한을 지정하기 위해 zookie를 포함한다. zookie 타임스탬프가 해당 리전에 복제된 가장 최근 데이터의 타임스탬프보다 높으면, 저장소 읽기는 더 최신 데이터를 가져오기 위해 리더 복제본까지 리전 간 왕복을 해야 한다. 저장소는 8초 간격의 복제 하트비트로 설정되어 있으므로, 우리는 요청을 두 범주로 나눈다. *Safe* 요청은 10초보다 오래된 zookie를 가지며 대부분 리전 내에서 처리될 수 있는 반면, *Recent* 요청은 10초 미만의 zookie를 가지며 흔히 리전 간 왕복이 필요하다. 각각에 대해 별도의 통계를 보고한다."
  fig-3:
    alt: 일요일부터 토요일까지 1주일에 걸친 로그 스케일 선 그래프. Safe QPS는 매일 대략 200만에서 400만 사이를 오르내리고, Recent QPS는 대략 2만에서 8만 사이를 오르내리며 약 두 자릿수 낮다.
    caption: "그림 3: 2018년 12월의 7일간 Check Safe 요청과 Check Recent 요청의 요청률."
  s4-1-p2:
    text: "[그림 3](#fig-3)은 7일간의 Check Safe 요청과 Check Recent 요청의 요청률을 보여 준다. 둘 다 일주기(diurnal cycle)를 보인다. Safe 요청의 요청률은 Recent 요청의 요청률보다 약 두 자릿수 크며, 덕분에 Zanzibar는 ACL 검사의 대다수를 로컬에서 처리할 수 있다."
  s4-2:
    text: 지연 시간
  s4-2-p1:
    text: Zanzibar의 지연 시간 예산은 일반적으로 클라이언트가 실용적인 대화형 서비스가 되기 위해 제공해야 하는 수백 밀리초의 전체 응답 시간 중 작은 일부다. 예를 들어 여러 문서에 대한 검색 결과를 보여 주기 전에 그 문서들에 대해 인가 검사를 수행하는 클라이언트를 생각해 보자.
  s4-2-p2:
    text: 우리는 실제 트래픽을 사용하여 서버 측에서 지연 시간을 측정한다. 그 이유는 (1) 지연 시간이 캐싱과 중복 제거 메커니즘의 영향을 크게 받아 실제 트래픽에서만 현실적으로 반영되고, (2) 클라이언트에서 지연 시간을 정확히 측정하려면 클라이언트가 올바르게 동작해야 하기 때문이다. 클라이언트 작업의 자원 프로비저닝은 Zanzibar가 통제할 수 없는 영역이며, 때때로 클라이언트 작업은 과부하 상태가 된다.
  fig-4:
    alt: 1주일에 걸친 Check Safe 지연 시간의 로그 스케일 선 그래프. 50번째 백분위수는 3 ms 부근, 95번째는 10 ms 부근, 99번째는 약 13~20 ms, 99.9번째는 약 50~90 ms를 유지한다.
    caption: "그림 4: 2018년 12월의 7일간 백분위수별 Check Safe 응답 지연 시간."
  s4-2-p3:
    text: "[그림 4](#fig-4)는 7일간 Check Safe 응답의 지연 시간을 보여 준다. 50번째, 95번째, 99번째, 99.9번째 백분위수에서 최대값은 각각 약 3, 11, 20, 93 msec이다. 이 성능은 사용자 상호작용의 임계 경로에 자주 놓이는 작업에 대한 우리의 지연 시간 목표를 충족한다."
  s4-2-p4:
    text: "[표 2](#tab-2)는 같은 7일간 Check, Read, Expand, Write 응답의 지연 시간 분포를 요약한다. 의도한 대로, 더 자주 사용되는 Safe 버전의 Check, Read, Expand는 덜 자주 사용되는 Recent 버전보다 훨씬 빠르다. Write는 모든 API 중 가장 드물게 사용되며, 항상 Spanner 서버 간의 분산 조율이 필요하므로 가장 느리다."
