  s4-3:
    text: 가용성
  s4-3-p1:
    text: "우리는 가용성을 서비스가 지연 시간 임계값 이내에 성공적으로 응답한 “적격” RPC의 비율로 정의한다. 임계값은 Safe 요청의 경우 5초, Recent 요청의 경우 15초인데, Spanner의 리더 재선출에 최대 10초가 걸릴 수 있기 때문이다. RPC가 적격이 되려면 요청의 형식이 올바르고 지연 시간 임계값보다 긴 데드라인을 가져야 한다. 또한 클라이언트는 자신의 자원 할당량 이내에 머물러야 한다."
  s4-3-p2:
    text: 이러한 이유로 클라이언트가 때때로 짧은 데드라인으로 RPC를 보내거나 진행 중인 RPC를 취소하기 때문에, 우리는 실제 트래픽으로 가용성을 직접 측정할 수 없다. 대신 실제 트래픽에서 유효한 요청의 작은 일부를 샘플링하여 나중에 자체 프로버로 재생한다. 요청을 재생할 때는 타임아웃을 가용성 임계값보다 길게 설정한다. 또한 요청 zookie가 지정되어 있으면, zookie의 상대적 경과 시간이 실제 트래픽에서 요청을 받았을 때와 같게 유지되도록 조정한다. 마지막으로 클러스터당 3개의 프로버를 실행하고 이상값을 제외하여, 드문 프로버 장애로 인한 오경보를 제거한다.
  s4-3-p3:
    text: 가용성을 계산하기 위해 우리는 90일 단위 기간에 걸친 성공률을 집계하여 클러스터 전체에 대해 평균한다. [그림 5](#fig-5)는 이러한 프로버로 측정한 Zanzibar의 가용성을 보여 준다. 가용성은 Google에서 운영된 지난 3년 동안 99.999% 이상을 유지해 왔다. 다시 말해 매 분기 Zanzibar의 글로벌 다운타임은 2분 미만이며, 글로벌 오류율이 10%를 초과하는 시간은 13분 미만이다.
  fig-5:
    alt: 2015년 12월부터 2018년 12월까지 Safe 요청과 Recent 요청의 가용성을 나타낸 선 그래프. 둘 다 거의 전 기간에 걸쳐 99.9995%와 100% 사이에 머물며, 99.999% 점선보다 훨씬 위에 있다.
    caption: "그림 5: 지난 3년간 Zanzibar의 가용성은 99.999% 이상을 유지해 왔다."
  s4-4:
    text: 내부 동작
  s4-4-p1:
    text: Zanzibar 서버는 일관된 해싱에 기반하여 검사와 읽기를 서로에게 위임하며, 위임된 작업의 호출자와 피호출자 양쪽 모두 핫스팟을 방지하기 위해 결과를 캐싱한다([§3.2.5](#s3-2-5)). 피크 시 Zanzibar는 초당 2,200만 건의 내부 “위임” RPC를 처리하며, 읽기와 검사가 대략 절반씩을 차지한다. 인메모리 캐싱은 피크 시 초당 약 2억 건의 조회를 처리하는데, 그중 1억 5,000만 건은 검사에서, 5,000만 건은 읽기에서 나온다. 검사에 대한 캐싱은 위임받는 쪽(delegate)에서 10%의 적중률을 보이며, 락 테이블로 추가로 12%를 절약한다. 한편 위임하는 쪽(delegator)의 캐싱은 2%의 적중률을 보이며, 락 테이블로 추가로 3%를 절약한다. 이 적중률은 낮아 보이지만, 초당 50만 건의 내부 RPC가 핫스팟을 만드는 것을 막는다.
  s4-4-p2:
    text: 위임된 읽기는 위임받는 쪽에서 더 높은 적중률을 보이지만(캐시에서 24%, 락 테이블에서 9%), 위임하는 쪽의 캐시 적중률은 1% 미만이다. 매우 뜨거운(super-hot) 그룹에 대해서는 Zanzibar가 멤버 전체 집합을 미리 읽어 캐싱하는 추가 최적화를 수행한다. 이는 그룹의 0.1%에 대해 일어나지만 핫스팟을 더욱 방지한다.
  s4-4-p3:
    text: 이러한 캐싱과 공격적인 읽기 요청 풀링 덕분에 Zanzibar는 Spanner에 초당 2,000만 건의 read RPC만 보낸다. 이 요청들의 중앙값은 RPC당 1.5개 행을 읽지만, 99번째 백분위수에서는 각각 1,000개에 가까운 행을 읽는다.
  s4-4-p4:
    text: Zanzibar의 Spanner 읽기는 중앙값에서 0.5 msec, 95번째 백분위수에서 2 msec가 걸린다. Spanner 읽기의 1%, 즉 초당 20만 건의 읽기가 헤징의 이점을 얻는 것으로 나타났다. Zanzibar는 Cloud Spanner [[6](#ref-6)]의 인스턴스가 아니라 Google 내부에서 실행되는 Spanner 인스턴스를 사용한다는 점을 밝혀 둔다.
  s4-4-p5:
    text: 7일간 집계한 데이터에 따르면 Leopard 인덱스는 중앙값에서 1.56M QPS, 99번째 백분위수에서 2.22M QPS를 처리하고 있다. 같은 7일 동안 Leopard 서버는 중앙값에서 150 μsec 미만, 99번째 백분위수에서 1 msec 미만으로 응답한다. 그 7일 동안 Leopard의 증분 계층은 중앙값에서 초당 약 500건, 99번째 백분위수에서 초당 약 1.5K건의 인덱스 갱신을 기록한다.
  s4-5:
    text: 얻은 교훈
  s4-5-p1:
    text: Zanzibar는 Google Calendar, Google Cloud, Google Drive, Google Maps, Google Photos, YouTube를 포함하여 점점 늘어나는 클라이언트의 다양하고 막대한 요구를 충족하도록 발전해 왔다. 이 절에서는 이 경험에서 얻은 교훈을 조명한다.
  s4-5-p2:
    text: "공통된 주제 하나는 클라이언트 간의 차이를 수용하기 위한 유연성의 중요성이었다. 예를 들면 다음과 같다."
  s4-5-flex:
    items:
      - "*접근 제어 패턴은 매우 다양하다:* 시간이 지나면서 우리는 특정 클라이언트를 지원하기 위한 기능을 추가했다. 예를 들어 객체 ID 접두사로부터 객체의 소유자 ID를 추론할 수 있도록 `computed_userset`을 추가했는데, 이는 Drive나 Photos처럼 비공개 객체를 많이 관리하는 클라이언트의 공간 요구량을 줄여 준다. 마찬가지로 홉당 관계 튜플 하나만으로 객체 계층 구조를 표현하기 위해 `tuple_to_userset`을 추가했다. 이점은 공간 절감과 유연성 두 가지다. 이를 통해 Cloud 같은 클라이언트는 ACL 상속을 간결하게 표현할 수 있고, 많은 수의 튜플을 갱신하지 않고도 ACL 상속 규칙을 변경할 수 있다. [§2.3.1](#s2-3-1)을 참조하라."
      - "*최신성 요구 사항은 흔히 느슨하지만 항상 그런 것은 아니다:* 클라이언트는 ACL 평가 중에 명시되지 않은 적당한 수준의 오래됨을 허용하는 경우가 많지만, 때로는 더 정밀하게 지정된 최신성을 요구한다. 우리는 이 속성을 중심으로 zookie 프로토콜을 설계하여, 대부분의 요청은 이미 복제된 기본 스냅샷에서 처리하면서도 필요할 때는 클라이언트가 오래된 정도를 제한할 수 있도록 했다. 또한 클라이언트의 최신성 요구 사항에 맞게 스냅샷 타임스탬프의 단위를 조정했다. 그 결과로 얻은 거친 타임스탬프 단위 덕분에 인가 검사의 대부분을 적은 수의 스냅샷에서 수행할 수 있어 데이터베이스 읽기 빈도가 크게 줄어든다. [§3.2.1](#s3-2-1)을 참조하라."
  s4-5-p3:
    text: "또 다른 주제는 프로덕션에서 관측된 클라이언트 동작을 지원하기 위해 성능 최적화를 추가할 필요성이었다. 예를 들면 다음과 같다."
  s4-5-perf:
    items:
      - "*요청 헤징은 꼬리 지연 시간 감소의 핵심이다:* Drive처럼 사용자에게 검색 기능을 제공하는 클라이언트는 한 묶음의 검색 결과를 제공하기 위해 흔히 수십에서 수백 건의 인가 검사를 보낸다. 우리는 가끔 발생하는 느린 작업이 전체 사용자 상호작용을 느리게 만들지 않도록 Spanner와 Leopard 요청에 헤징을 도입했다. [§3.2.7](#s3-2-7)을 참조하라."
      - "*핫스팟 완화는 높은 가용성에 결정적이다:* 일부 워크로드는 ACL 데이터에 하부 데이터베이스 서버를 압도할 수 있는 핫스팟을 만든다. 흔한 패턴은 여러 다른 객체의 ACL이 간접적으로 참조하는 한 객체에 대해 ACL 검사가 폭주하는 것이다. 구체적인 사례로는 앞서 언급한 검색 사용 사례에서 검색 대상 문서들이 대규모 소셜 그룹이나 업무 그룹에 대한 ACL을 간접적으로 공유하는 경우, 그리고 많은 객체가 계층 구조 상위에 있는 같은 객체에 대한 ACL을 간접적으로 공유하는 Cloud 사용 사례가 있다. Zanzibar는 분산 캐시와 락 테이블 같은 일반적인 메커니즘으로 대부분의 핫스팟을 처리하지만, 특정 사용 사례를 최적화할 필요가 있음을 알게 되었다. 예를 들어 핫 객체에 대한 모든 관계 튜플의 캐시 프리페칭을 추가했다. 또한 같은 ACL 데이터에 대한 동시 요청이 있을 때는 부차적인 ACL 검사의 취소를 지연시켰다. [§3.2.5](#s3-2-5)를 참조하라."
      - "*성능 격리는 오작동하는 클라이언트로부터 보호하는 데 필수적이다:* 핫스팟 완화 조치가 있더라도, 예상치 못한, 때로는 의도치 않은 클라이언트 동작이 여전히 시스템이나 그 하부 인프라에 과부하를 일으킬 수 있다. 예를 들어 클라이언트가 출시한 새 기능이 예상 외로 인기를 끌거나, Zanzibar를 의도하지 않은 방식으로 사용하는 경우가 있다. 시간이 지나면서 우리는 클라이언트 간 또는 같은 클라이언트의 객체 간에 연쇄 장애가 발생하지 않도록 격리 안전장치를 추가했다. 이러한 안전장치에는 세분화된 비용 산정, 할당량, 스로틀링이 포함된다. [§3.2.6](#s3-2-6)을 참조하라."
  s5:
    text: 관련 연구
  s5-p1:
    text: Zanzibar는 행성 규모의 분산 ACL 저장 및 평가 시스템이다. Zanzibar의 인가 개념 중 다수는 접근 제어와 소셜 그래프 분야에서 이미 탐구되었으며, 확장성 과제는 분산 시스템 분야에서 연구되어 왔다.
  s5-p2:
    text: 접근 제어는 다중 사용자 운영 체제의 핵심 부분이다. Multics [[23](#ref-23)]는 세그먼트와 디렉터리에 대한 ACL을 지원한다. ACL 항목은 주체(principal) 식별자와 권한 비트 집합으로 구성된다. UNIX 초판 [[9](#ref-9)]에서는 파일 플래그가 소유자와 비소유자가 파일을 읽거나 쓸 수 있는지를 나타낸다. 제4판에 이르러 권한 비트는 소유자, 그룹, 기타 사용자에 대한 읽기/쓰기/실행 비트로 확장되었다. POSIX ACL [[4](#ref-4)]은 사용자와 그룹의 임의 목록을 추가하며, 각각 최대 32개의 권한 비트를 가진다. VMS [[7](#ref-7), [8](#ref-8)]는 디렉터리 트리 안에서 생성된 파일에 대한 ACL 상속을 지원한다. Zanzibar의 데이터 모델은 위 시스템들에서 볼 수 있는 권한, 사용자, 그룹, 상속을 지원한다.
  s5-p3:
    text: Taos [[24](#ref-24), [10](#ref-10)]는 신원이 분산 시스템을 거쳐 전달되면서 어떻게 변환되었는지를 반영하는 복합 주체(compound principal)를 지원한다. 예를 들어 사용자 $U$가 파일 서버 $S$에 접근하기 위해 워크스테이션 $W$에 로그인했다면, $S$는 요청이 단순히 $U$가 아니라 “$W$ for $U$”로 인증된 것으로 보게 된다. 이를 통해 사용자의 이메일에 대해, 그 사용자만 접근할 수 있으며 메일 서버를 통해 접근하는 경우에만 접근 가능한 ACL을 작성할 수 있다. Abadi 등은 [[11](#ref-11)]에서 복합 신원을 지원하는 그룹 기반 ACL 모델을 논의한다. 이들의 “blessing” 개념은 Zanzibar 튜플과 유사하다. 그러나 Zanzibar는 유저셋을 사용하여 ACL과 그룹을 통합된 방식으로 표현하는 반면, [[11](#ref-11)]에서는 이 둘이 별개의 개념이다.
  s5-p4:
    text: "[[17](#ref-17)]에서 처음 제안된 역할 기반 접근 제어(RBAC)는 Zanzibar의 관계와 유사한 역할이라는 개념을 도입했다. 역할은 서로 상속할 수 있으며 권한을 함축한다. 여러 Zanzibar 클라이언트가 Zanzibar의 네임스페이스 설정 언어 위에 RBAC 정책을 구현했다."
  s5-p5:
    text: "2019년에 ACL 저장소를 논하면서 Amazon [[1](#ref-1)], Google [[5](#ref-5)], Microsoft [[2](#ref-2)] 등이 상용으로 제공하는 ID 및 접근 관리(IAM) 시스템을 언급하지 않는다면 태만일 것이다. 이러한 시스템을 통해 해당 기업의 클라우드 제품 고객은 다양한 기능을 바탕으로 유연한 접근 제어를 설정할 수 있다. 이러한 기능에는 사용자를 역할이나 그룹에 할당하는 것, 도메인 특화 정책 언어, 그리고 ACL의 생성과 수정을 가능하게 하는 API가 있다. 이 모든 시스템의 공통점은 통합된 ACL 저장소와 RPC 기반 API인데, 이는 Zanzibar 설계의 핵심 철학이기도 하다. Google의 Cloud IAM 시스템 [[5](#ref-5)]은 Zanzibar의 ACL 저장 및 평가 시스템 위의 계층으로 구축되어 있다."
  s5-p6:
    text: TAO [[13](#ref-13)]는 Facebook의 소셜 그래프를 위한 분산 데이터 저장소다. 여러 Zanzibar 클라이언트도 Zanzibar를 사용하여 소셜 그래프를 저장한다. Zanzibar와 TAO는 모두 클라이언트에 인가 검사를 제공한다. 둘 다 단일 인스턴스 서비스로 배포되고, 둘 다 대규모로 운영되며, 둘 다 읽기 전용 작업에 최적화되어 있다. TAO는 비동기 복제를 통한 최종적 글로벌 일관성과, 동기식 캐시 갱신을 통한 최선 노력(best-effort) 방식의 쓰기 후 읽기 일관성을 제공한다. 반면 Zanzibar는 외부 일관성과 오래된 정도가 제한된 스냅샷 읽기를 제공하므로, ACL 갱신과 콘텐츠 갱신 사이의 인과적 순서를 준수하며 따라서 “new enemy” 문제를 막는다.
  s5-p7:
    text: Lamport 시계 [[22](#ref-22)]는 사건의 순서를 결정하는 데 사용할 수 있는 부분 순서 벡터 타임스탬프를 제공한다. 그러나 Lamport 시계는 모든 “프로세스”의 명시적인 참여를 요구하는데, Zanzibar의 사용 사례에서는 “프로세스” 중 일부가 외부 클라이언트이거나 심지어 인간 사용자일 수 있다. 반면 Zanzibar는 외부 일관성과 오래된 정도가 제한된 스냅샷 읽기를 모두 제공하기 위해 하부 데이터베이스 시스템인 Spanner [[15](#ref-15)]에 의존한다. 특히 Zanzibar는 Spanner의 TrueTime 추상화 [[15](#ref-15)]를 기반으로 zookie로 인코딩되는 선형화 가능한 커밋 타임스탬프를 제공한다.
  s5-p8:
    text: 동시에 Zanzibar는 Spanner가 제공하는 기능 위에 여러 기능을 추가한다. 우선 zookie 프로토콜은 클라이언트가 임의의 스냅샷에서 ACL을 읽거나 평가하도록 허용하지 *않는다*. 이 제약 덕분에 Zanzibar는 빠른 ACL 평가에 유리한 스냅샷을 선택할 수 있다. 또한 Zanzibar는 데이터베이스 핫스팟(예를 들어 갑자기 인기를 얻은 동영상에 대한 인가 검사)에 대한 복원력과, 잠재적으로 깊은 재귀(예를 들어 계층적 그룹에 대한 멤버십 검사)에도 불구하고 안전한 포인터 추적을 제공한다.
  s5-p9:
    text: Chubby 분산 락 서비스 [[14](#ref-14)]는 신뢰할 수 있는 저장소를 제공하고, 쓰기를 선형화하며, 접근 제어를 제공하지만, Zanzibar의 사용 사례를 지원하는 데 필요한 기능이 부족하다. 특히 대용량 데이터, 효율적인 범위 읽기, 또는 클라이언트가 지정한 스냅샷에서 오래된 정도가 제한된 읽기를 지원하지 않는다. 또한 캐시 무효화 메커니즘이 쓰기 처리량을 제한한다.
  s5-p10:
    text: 마지막으로 ZooKeeper는 고성능 조정 서비스 [[19](#ref-19)]를 제공하지만 역시 Zanzibar가 요구하는 기능이 부족하다. Chubby에 비해 ZooKeeper는 더 완화된 캐시 일관성으로 더 높은 읽기 및 쓰기 속도를 처리할 수 있다. 그러나 선형화 가능성이 노드 단위로 보장되므로 서로 다른 노드에 걸친 갱신에 대해서는 외부 일관성을 제공하지 않는다. 또한 오래된 정도가 제한된 스냅샷 읽기도 제공하지 않는다.
  s6:
    text: 결론
  s6-p1:
    text: Zanzibar 인가 시스템은 Google의 접근 제어 데이터와 로직을 통합한다. 단순하면서도 유연한 데이터 모델과 설정 언어는 소비자용 애플리케이션과 기업용 애플리케이션 모두의 다양한 접근 제어 정책을 지원한다.
  s6-p2:
    text: Zanzibar의 외부 일관성 모델은 가장 두드러진 특징 중 하나다. 이 모델은 사용자 행동의 순서를 준수하면서도, 동시에 글로벌 동기화 없이 분산된 위치에서 인가 검사를 평가할 수 있게 한다.
  s6-p3:
    text: Zanzibar는 확장성, 낮은 지연 시간, 높은 가용성을 제공하기 위해 다른 핵심 기법들도 사용한다. 예를 들어 스냅샷 일관성을 갖춘 효율적인 집합 연산을 위한 특수 인덱스인 Leopard로 깊게 또는 넓게 중첩된 그룹 멤버십을 평가한다. 또 다른 예로, 분산 캐시와 처리 중인 요청을 중복 제거하는 메커니즘을 결합한다. 이를 통해 정규화되고 일관된 저장소 위에서 데이터를 서빙할 때 중요한 프로덕션 문제인 핫스팟을 완화한다. 이러한 조치들이 함께 작용하여 수조 개의 접근 제어 규칙과 초당 수백만 건의 인가 요청으로 확장되는 시스템을 만든다.
  s7:
    text: 감사의 글
  s7-p1:
    text: 많은 사람이 Zanzibar에 기술적으로 기여했다. Dan Barella, Miles Chaston, Daria Jung, Alex Mendes da Costa, Xin Pan, Scott Smith, Matthew Steffen, Riva Tropp, Yuliya Zabiyaka를 비롯한 개발 팀의 이전 및 최근 구성원에게 감사한다. 또한 Randall Bosetti, Hannes Eder, Robert Geisberger, Tom Li, Massimo Maggi, Igor Oks, Aaron Peterson, Andrea Yu를 비롯한 사이트 신뢰성 엔지니어링(SRE) 팀의 이전 및 현재 구성원에게도 감사한다.
  s7-p2:
    text: 또한 많은 사람이 이 논문을 개선하는 데 도움을 주었다. David Bacon, Carolin Gäthke, Brad Krueger, Ari Shamash, Kai Shen, Lawrence You로부터 통찰력 있는 의견을 받았다. Nadav Eiron과 Royal Hansen의 지원에도 감사드린다. 마지막으로 익명의 심사위원들과 셰퍼드인 Eric Eide의 건설적인 피드백에 감사한다.
  refs:
    text: 참고문헌
