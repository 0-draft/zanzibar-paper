  s4-3:
    text: "可用性"
  s4-3-p1:
    text: "我們將可用性定義為服務在延遲門檻內成功回應的「合格」RPC 所佔的比例：Safe 請求的門檻為 5 秒，Recent 請求為 15 秒，因為 Spanner 中的領導者重新選舉可能需要長達 10 秒。RPC 要成為合格，請求必須格式正確，且截止期限長於延遲門檻。此外，客戶端必須維持在其資源配額之內。"
  s4-3-p2:
    text: "基於這些原因，我們無法直接以即時流量量測可用性，因為我們的客戶端有時會傳送截止期限很短的 RPC，或取消進行中的 RPC。因此，我們從即時流量中取樣一小部分有效請求，稍後再以我們自己的探測器重播。重播請求時，我們將逾時設定為長於可用性門檻。若請求有指定 zookie，我們也會調整該 zookie，使其相對時齡與該請求在即時流量中被接收時相同。最後，我們在每個叢集執行 3 個探測器並排除離群值，以消除因罕見的探測器故障所造成的誤報。"
  s4-3-p3:
    text: "為了計算可用性，我們彙總 90 天時間窗內的成功率，並在各叢集間取平均。[圖 5](#fig-5) 顯示由這些探測器量測到的 Zanzibar 可用性。在 Google 過去 3 年的營運期間，可用性始終維持在 99.999% 以上。換句話說，每一季 Zanzibar 的全域停機時間不到 2 分鐘，而全域錯誤率超過 10% 的時間少於 13 分鐘。"
  fig-5:
    alt: "2015 年 12 月至 2018 年 12 月 Safe 與 Recent 請求可用性的折線圖。兩者幾乎始終維持在 99.9995% 至 100% 之間，遠高於 99.999% 的虛線。"
    caption: "圖 5：Zanzibar 過去三年的可用性始終維持在 99.999% 以上。"
  s4-4:
    text: "內部運作"
  s4-4-p1:
    text: "Zanzibar 伺服器依據一致性雜湊將檢查與讀取委派給彼此，而受委派操作的呼叫端與被呼叫端都會快取結果，以防止熱點（[§3.2.5](#s3-2-5)）。在尖峰時，Zanzibar 每秒處理 2,200 萬次內部「委派」RPC，讀取與檢查約各佔一半。記憶體內快取在尖峰時每秒處理約 2 億次查找，其中 1.5 億次來自檢查，5,000 萬次來自讀取。檢查的快取在受委派端的命中率為 10%，另有 12% 由鎖定表節省。同時，委派端的快取命中率為 2%，另有 3% 來自鎖定表。雖然這些命中率看似偏低，但它們每秒可防止 50 萬次內部 RPC 造成熱點。"
  s4-4-p2:
    text: "受委派的讀取在受委派端有較高的命中率——快取為 24%，鎖定表為 9%——但委派端快取的命中率不到 1%。對於超熱門群組，Zanzibar 進一步最佳化，預先讀取並快取完整的成員集合——這種情況發生在 0.1% 的群組上，但能進一步防止熱點。"
  s4-4-p3:
    text: "這種快取機制，加上積極的讀取請求池化，讓 Zanzibar 每秒只需向 Spanner 發出 2,000 萬次讀取 RPC。這些請求的中位數為每個 RPC 讀取 1.5 列，但在第 99 百分位，每個請求讀取接近 1 千列。"
  s4-4-p4:
    text: "Zanzibar 的 Spanner 讀取在中位數耗時 0.5 毫秒，在第 95 百分位耗時 2 毫秒。我們發現 1% 的 Spanner 讀取（即每秒 20 萬次讀取）受益於對沖。需要注意的是，Zanzibar 使用的是在 Google 內部執行的 Spanner 實例，而非 Cloud Spanner [[6](#ref-6)] 的實例。"
  s4-4-p5:
    text: "根據 7 天的彙總資料，Leopard 索引在中位數執行 156 萬 QPS，在第 99 百分位執行 222 萬 QPS。在同樣的 7 天內，Leopard 伺服器在中位數的回應時間少於 150 微秒，在第 99 百分位則低於 1 毫秒。在這 7 天內，Leopard 的增量層在中位數每秒寫入約 500 次索引更新，在第 99 百分位每秒約 1,500 次更新。"
  s4-5:
    text: "經驗教訓"
  s4-5-p1:
    text: "Zanzibar 不斷演進，以滿足日益增加的客戶端多樣且繁重的需求，這些客戶端包括 Google Calendar、Google Cloud、Google Drive、Google Maps、Google Photos 與 YouTube。本節重點介紹從這些經驗中學到的教訓。"
  s4-5-p2:
    text: "一個共同的主題是，彈性對於因應客戶端之間的差異十分重要。例如："
  s4-5-flex:
    items:
      - "*存取控制模式差異極大*：隨著時間推移，我們加入了一些功能以支援特定客戶端。例如，我們加入了 `computed_userset`，讓系統能從物件 ID 前綴推斷物件擁有者的 ID，這減少了 Drive 與 Photos 等管理大量私人物件之客戶端的空間需求。同樣地，我們加入了 `tuple_to_userset`，以每一跳僅一筆關係元組的方式表示物件階層。其好處同時包括空間的縮減與彈性——它讓 Cloud 等客戶端既能精簡地表達 ACL 繼承，又能在無需更新大量元組的情況下變更 ACL 繼承規則。請參閱 [§2.3.1](#s2-3-1)。"
      - "*新鮮度要求通常寬鬆，但並非總是如此*：客戶端在 ACL 評估期間通常允許未指定的適度陳舊度，但有時需要更精確指定的新鮮度。我們圍繞此特性設計了 zookie 協定，使我們能從預設且已複製的快照處理大多數請求，同時允許客戶端在需要時界定陳舊度。我們也調整了快照時間戳記的粒度，以符合客戶端的新鮮度要求。由此產生的粗粒度時間戳記量子，讓我們能在少數幾個快照上執行大部分的授權檢查，從而大幅降低資料庫讀取的頻率。請參閱 [§3.2.1](#s3-2-1)。"
  s4-5-p3:
    text: "另一個主題是需要加入效能最佳化，以支援在正式環境中觀察到的客戶端行為。例如："
  s4-5-perf:
    items:
      - "*請求對沖是降低尾端延遲的關鍵*：為使用者提供搜尋功能的客戶端（例如 Drive）經常需要發出數十到數百次授權檢查，才能提供單一一組搜尋結果。我們引入了對 Spanner 與 Leopard 請求的對沖，以避免偶發的緩慢操作拖慢整體使用者互動。請參閱 [§3.2.7](#s3-2-7)。"
      - "*熱點緩解對高可用性至關重要*：某些工作負載會在 ACL 資料中造成熱點，足以壓垮底層資料庫伺服器。一種常見模式是針對某個物件的突發大量 ACL 檢查，而該物件被許多不同物件的 ACL 間接參照。具體實例來自上述的搜尋使用情境，其中搜尋中的文件間接共用某個大型社交群組或工作群組的 ACL；以及 Cloud 的使用情境，其中許多物件間接共用位於階層高處之同一物件的 ACL。Zanzibar 以分散式快取與鎖定表等通用機制處理大多數熱點，但我們發現仍需要針對特定使用情境進行最佳化。例如，我們加入了針對熱門物件預先擷取所有關係元組至快取的功能。我們也在有針對相同 ACL 資料的並行請求時，延後取消次要 ACL 檢查。請參閱 [§3.2.5](#s3-2-5)。"
      - "*效能隔離是防範行為異常之客戶端不可或缺的手段*：即使採取了熱點緩解措施，非預期且有時並非刻意的客戶端行為，仍可能使我們的系統或其底層基礎設施過載。例子包括客戶端推出出乎意料地受歡迎的新功能，或以非預期的方式使用 Zanzibar。隨著時間推移，我們加入了隔離防護措施，以確保客戶端之間或同一客戶端的物件之間不會發生連鎖故障。這些防護措施包括細粒度的成本計算、配額與節流。請參閱 [§3.2.6](#s3-2-6)。"
  s5:
    text: "相關研究"
  s5-p1:
    text: "Zanzibar 是一套行星規模的分散式 ACL 儲存與評估系統。它的許多授權概念先前已在存取控制與社交圖譜領域中被探討過，而其擴展挑戰也已在分散式系統領域中被研究過。"
  s5-p2:
    text: "存取控制是多使用者作業系統的核心部分。Multics [[23](#ref-23)] 支援針對區段與目錄的 ACL。ACL 項目由一個主體識別碼與一組權限位元組成。在 UNIX 第一版 [[9](#ref-9)] 中，檔案旗標表示擁有者與非擁有者是否可以讀取或寫入該檔案。到了第 4 版，權限位元已擴充為擁有者、群組與其他人各自的讀取／寫入／執行位元。POSIX ACL [[4](#ref-4)] 加入了任意的使用者與群組清單，每一項最多具有 32 個權限位元。VMS [[7](#ref-7), [8](#ref-8)] 支援在目錄樹中建立之檔案的 ACL 繼承。Zanzibar 的資料模型支援上述系統中的權限、使用者、群組與繼承。"
  s5-p3:
    text: "Taos [[24](#ref-24), [10](#ref-10)] 支援複合主體，可納入身分在通過分散式系統時被轉換的方式。例如，若使用者 $U$ 登入工作站 $W$ 以存取檔案伺服器 $S$，$S$ 看到的請求將被驗證為「代表 $U$ 的 $W$」，而非僅僅是 $U$。這使得人們可以為使用者的電子郵件撰寫一條 ACL，使其只有該使用者能存取，且僅限於透過郵件伺服器存取時。Abadi 等人在 [[11](#ref-11)] 中討論了一種支援複合身分、以群組為基礎的 ACL 模型。他們的「blessings」概念類似於 Zanzibar 的元組。然而，Zanzibar 使用使用者集合為 ACL 與群組採用統一的表示方式，而在 [[11](#ref-11)] 中兩者是不同的概念。"
  s5-p4:
    text: "以角色為基礎的存取控制（RBAC）最早於 [[17](#ref-17)] 中提出，引入了角色的概念，其類似於 Zanzibar 的關係。角色可以彼此繼承，並蘊含權限。許多 Zanzibar 客戶端已在 Zanzibar 的命名空間設定語言之上實作了 RBAC 政策。"
  s5-p5:
    text: "2019 年談論 ACL 儲存區，若不提及 Amazon [[1](#ref-1)]、Google [[5](#ref-5)]、Microsoft [[2](#ref-2)] 等公司商業提供的身分與存取管理（IAM）系統，將是一大疏漏。這些系統讓這些公司雲端產品的客戶能夠根據各種功能設定彈性的存取控制，例如：將使用者指派給角色或群組；特定領域的政策語言；以及允許建立與修改 ACL 的 API。所有這些系統的共同點是統一的 ACL 儲存與以 RPC 為基礎的 API，而這也是 Zanzibar 設計的核心理念。Google 的 Cloud IAM 系統 [[5](#ref-5)] 是作為 Zanzibar ACL 儲存與評估系統之上的一層而建構的。"
  s5-p6:
    text: "TAO [[13](#ref-13)] 是 Facebook 社交圖譜的分散式資料儲存區。有數個 Zanzibar 客戶端也使用 Zanzibar 來儲存其社交圖譜。Zanzibar 與 TAO 都為客戶端提供授權檢查。兩者都以單一實例服務的形式部署，都以大規模運作，也都針對唯讀操作進行最佳化。TAO 透過非同步複製提供最終全域一致性，並透過同步快取更新提供盡力而為的寫後讀一致性。相較之下，Zanzibar 提供外部一致性與具有有界陳舊度的快照讀取，因此能遵循 ACL 與內容更新之間的因果順序，從而防範「new enemy」問題。"
  s5-p7:
    text: "Lamport 時鐘 [[22](#ref-22)] 提供部分排序的向量時間戳記，可用於判斷事件的順序。然而，Lamport 時鐘需要所有「行程」明確參與，而在 Zanzibar 的使用情境中，部分「行程」可能是外部客戶端，甚至是人類使用者。相較之下，Zanzibar 仰賴其底層資料庫系統 Spanner [[15](#ref-15)] 同時提供外部一致性與具有有界陳舊度的快照讀取。特別是，Zanzibar 建構於 Spanner 的 TrueTime 抽象 [[15](#ref-15)] 之上，以提供編碼為 zookie 的可線性化提交時間戳記。"
  s5-p8:
    text: "同時，Zanzibar 在 Spanner 所提供的功能之上加入了多項功能。其一，zookie 協定*不*允許客戶端在任意快照上讀取或評估 ACL。此限制讓 Zanzibar 能選擇有助於快速 ACL 評估的快照。此外，Zanzibar 提供對資料庫熱點（例如對突然爆紅之影片的授權檢查）的韌性，以及即使可能面臨深層遞迴（例如對階層式群組的成員資格檢查）仍能安全進行的指標追蹤。"
  s5-p9:
    text: "Chubby 分散式鎖定服務 [[14](#ref-14)] 提供可靠的儲存、將寫入線性化並提供存取控制，但它缺乏支援 Zanzibar 使用情境所需的功能。特別是，它不支援大量資料、高效率的範圍讀取，或在客戶端指定之快照上具有有界陳舊度的讀取。其快取失效機制也限制了其寫入吞吐量。"
  s5-p10:
    text: "最後，ZooKeeper 提供高效能的協調服務 [[19](#ref-19)]，但同樣缺乏 Zanzibar 所需的功能。相較於 Chubby，它能以較寬鬆的快取一致性處理更高的讀寫速率。然而，由於其可線性化性是以個別節點為單位，它並未為跨不同節點的更新提供外部一致性。它也不提供具有有界陳舊度的快照讀取。"
  s6:
    text: "結論"
  s6-p1:
    text: "Zanzibar 授權系統為 Google 統一了存取控制資料與邏輯。其簡單而有彈性的資料模型與設定語言，支援來自消費者與企業應用程式的各種存取控制政策。"
  s6-p2:
    text: "Zanzibar 的外部一致性模型是其最突出的特性之一。它遵循使用者動作的順序，同時又允許授權檢查在分散的地點進行評估，而無需全域同步。"
  s6-p3:
    text: "Zanzibar 運用其他關鍵技術來提供可擴展性、低延遲與高可用性。例如，它使用 Leopard 評估深層或廣泛巢狀的群組成員資格；Leopard 是一種專用索引，能以快照一致性高效率地計算集合運算。另一個例子是，它將分散式快取與一種對進行中請求去重複的機制結合。藉此，它緩解了熱點——在正規化、一致的儲存之上提供資料時，這是一個關鍵的正式環境問題。這些措施共同造就了一套可擴展至數兆條存取控制規則與每秒數百萬次授權請求的系統。"
  s7:
    text: "致謝"
  s7-p1:
    text: "許多人為 Zanzibar 做出了技術貢獻。我們感謝開發團隊的前任與近期成員，包括 Dan Barella、Miles Chaston、Daria Jung、Alex Mendes da Costa、Xin Pan、Scott Smith、Matthew Steffen、Riva Tropp 與 Yuliya Zabiyaka。我們也感謝網站可靠性工程團隊的前任與現任成員，包括 Randall Bosetti、Hannes Eder、Robert Geisberger、Tom Li、Massimo Maggi、Igor Oks、Aaron Peterson 與 Andrea Yu。"
  s7-p2:
    text: "此外，許多人協助改進了本文。我們收到了來自 David Bacon、Carolin Gäthke、Brad Krueger、Ari Shamash、Kai Shen 與 Lawrence You 的深刻意見。我們也感謝 Nadav Eiron 與 Royal Hansen 的支持。最後，我們感謝匿名審稿人以及我們的指導委員 Eric Eide 提供的建設性回饋。"
  refs:
    text: "參考文獻"
