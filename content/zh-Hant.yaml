# zh-Hant translation of content/en.yaml. Translate the values; keep ids, keys and order.
lang: zh-Hant
meta:
  title: "Zanzibar：Google 的一致性全球授權系統"
blocks:
  author-note:
    text: "本研究係於任職 Google 期間完成。"
  abstract:
    text: "摘要"
  abstract-p1:
    text: "判斷線上使用者是否獲授權存取數位物件，是保護隱私的核心。本文介紹 Zanzibar 的設計、實作與部署；Zanzibar 是一套用於儲存及評估存取控制清單的全球性系統。Zanzibar 提供統一的資料模型與設定語言，用以表達來自 Google 數百個客戶端服務（包括 Calendar、Cloud、Drive、Maps、Photos 與 YouTube）的各式各樣存取控制政策。其授權決策遵循使用者動作的因果順序，因此在存取控制清單與物件內容發生變更時仍能提供外部一致性。Zanzibar 可擴展至數兆份存取控制清單以及每秒數百萬次授權請求，以支援數十億人使用的服務。在 3 年的正式環境使用期間，它始終維持第 95 百分位延遲低於 10 毫秒、可用性高於 99.999%。"
  s1:
    text: "緒論"
  s1-p1:
    text: "許多線上互動都需要授權檢查，以確認使用者有權對某個數位物件執行某項操作。例如，網頁式相片儲存服務通常允許相片擁有者與朋友分享部分相片，同時將其他相片保持私人。此類服務在允許使用者檢視某張相片之前，必須先檢查該相片是否已分享給該使用者。穩健的授權檢查是保護線上隱私的核心。"
  s1-p2:
    text: "本文介紹 Zanzibar，一套用於儲存權限並根據所儲存之權限執行授權檢查的系統。Google 提供的眾多服務都使用它，包括 Calendar、Cloud、Drive、Maps、Photos 與 YouTube。其中數個服務代表超過十億名使用者管理數十億個物件。"
  s1-p3:
    text: "相較於為個別應用程式維護各自獨立的存取控制機制，統一的授權系統具有重要優勢。第一，它有助於在各應用程式之間建立一致的語意與使用者體驗。第二，它讓應用程式更容易互通，例如當某個應用程式的物件嵌入另一個應用程式的物件時，可協調兩者的存取控制。第三，可在統一的存取控制系統之上建構實用的共通基礎設施，特別是能遵循存取控制並跨應用程式運作的搜尋索引。最後，如下文所示，授權帶來了涉及資料一致性與可擴展性的獨特挑戰。跨應用程式一次性解決這些挑戰，可節省工程資源。"
  s1-p4:
    text: "我們為 Zanzibar 系統訂定了以下目標："
  s1-goals:
    items:
      - "*正確性*：必須確保存取控制決策的一致性，以尊重使用者的意圖。"
      - "*彈性*：必須支援消費者與企業應用程式所需的豐富存取控制政策。"
      - "*低延遲*：必須快速回應，因為授權檢查經常位於使用者互動的關鍵路徑上。尾端的低延遲對於提供搜尋結果尤其重要，因為搜尋結果通常需要數十到數百次檢查。"
      - "*高可用性*：必須可靠地回應請求，因為在缺乏明確授權的情況下，客戶端服務將被迫拒絕其使用者的存取。"
      - "*大規模*：需要保護由數十億使用者共享的數十億個物件。必須部署於全球各地，以貼近其客戶端及客戶端的終端使用者。"
  s1-p5:
    text: "Zanzibar 透過結合多項值得注意的特性來達成這些目標。為了提供彈性，Zanzibar 將簡單的資料模型與強大的設定語言結合。該語言允許客戶端定義使用者與物件之間的任意關係，例如 `owner`、`editor`、`commenter` 與 `viewer`。它包含交集與聯集等集合代數運算子，可依據這些使用者與物件之間的關係來指定可能相當複雜的存取控制政策。例如，應用程式可以指定：獲授予文件編輯權的使用者也可以對該文件發表評論，但並非所有評論者都獲授予編輯權。"
  s1-p6:
    text: "在執行時，Zanzibar 允許客戶端透過遠端程序呼叫（RPC）介面建立、修改及評估存取控制清單（ACL）。簡單的 ACL 形式為「使用者 *U* 對物件 *O* 具有關係 *R*」。較複雜的 ACL 形式為「使用者集合 *S* 對物件 *O* 具有關係 *R*」，其中 *S* 本身是以另一組物件與關係的配對來指定。因此 ACL 可以參照其他 ACL，例如指定可對某部影片發表評論的使用者集合，由獲授予該特定影片檢視權的使用者，加上擁有該影片頻道檢視權限的使用者所組成。"
  s1-p7:
    text: "群組成員資格是一類重要的 ACL，其中物件為群組，而關係在語意上等同於 `member`。群組可以包含其他群組，這說明了 Zanzibar 面臨的挑戰之一：評估使用者是否屬於某個群組，可能需要追溯一長串巢狀的群組成員關係。"
  s1-p8:
    text: "授權檢查的形式為「使用者 *U* 對物件 *O* 是否具有關係 *R*？」，並由一組分散式伺服器進行評估。當檢查請求抵達 Zanzibar 時，評估該檢查的工作可能會扇出至多台伺服器，例如當某個群組同時包含個別成員與其他群組時。而這些伺服器又可能各自聯絡其他伺服器，例如以遞迴方式走訪群組成員關係的階層。"
  s1-p9:
    text: "Zanzibar 在多個面向上都以全球規模運作。它儲存超過兩兆份 ACL，每秒執行數百萬次授權檢查。ACL 資料不適合依地理位置分割，因為對任何物件的授權檢查都可能來自世界任何地方。因此，Zanzibar 將所有 ACL 資料複製到數十個分散於各地的資料中心，並將負載分散到世界各地的數千台伺服器上。"
  s1-p10:
    text: "Zanzibar 透過兩項相互關聯的特性，支援存取控制決策的全域一致性。其一，它遵循 ACL 變更提交至底層資料儲存區的順序。其二，它能確保授權檢查所依據的 ACL 資料不早於客戶端指定的某次變更。因此，舉例來說，客戶端可以將某位使用者從群組中移除，並確信後續的成員資格檢查會反映該移除。Zanzibar 將 ACL 儲存在具備外部一致性保證的全球分散式資料庫系統中，藉此提供這些排序特性 [[15](#ref-15), [18](#ref-18)]。"
  s1-p11:
    text: "Zanzibar 運用一系列技術，在這個全球分散的環境中實現低延遲與高可用性。其一致性協定讓絕大多數請求都能以本地複製的資料提供服務，而無需跨區域往返。為了維持一致性，Zanzibar 以正規化形式儲存資料。它透過快取最終與中間結果，以及對同時發生的請求進行去重複，來處理正規化資料上的熱點。它也運用請求對沖，以及以有限度的反正規化最佳化深層巢狀集合上的運算等技術。Zanzibar 在 10 毫秒內回應超過 95% 的授權檢查，並在過去 3 年維持超過 99.999% 的可用性。"
  s1-p12:
    text: "本文的主要貢獻在於闡述建構及部署一個一致的、全球規模的授權系統所面臨的工程挑戰。雖然 Zanzibar 設計中的大多數元素都源自先前的研究，但本文記錄了 Zanzibar 為滿足其對正確性、彈性、延遲、可用性與可擴展性的嚴格要求而整合的各項特性與技術。本文也重點介紹在為各式各樣要求嚴苛的客戶端提供服務、營運 Zanzibar 的過程中所學到的教訓。"
  s2:
    text: "模型、語言與 API"
  s2-p1:
    text: "本節說明 Zanzibar 的資料模型、設定語言與應用程式介面（API）。"
  s2-1:
    text: "關係元組"
  s2-1-p1:
    text: "在 Zanzibar 中，ACL 是以*關係元組*表示的物件與使用者之間或物件與物件之間關係的集合。群組就只是具有成員資格語意的 ACL。關係元組具有高效率的二進位編碼，但在本文中我們使用一種方便的文字表示法來表示它們："
  s2-1-p2:
    text: "其中 ⟨*namespace*⟩ 與 ⟨*relation*⟩ 預先定義於客戶端設定中（[§2.3](#s2-3)），⟨*object_id*⟩ 為字串，⟨*user_id*⟩ 為整數。識別一筆關係元組所需的主鍵為 ⟨*namespace*⟩、⟨*object_id*⟩、⟨*relation*⟩ 與 ⟨*user*⟩。值得注意的一項特性是，⟨*userset*⟩ 讓 ACL 能夠參照群組，從而支援表示巢狀的群組成員資格。"
  s2-1-p3:
    text: "[表 1](#tab-1) 列出一些元組範例及其對應的語意。有些關係（例如 `viewer`）直接定義存取控制，其他關係（例如指向資料夾的 `parent`）則只定義物件之間的抽象關係。在命名空間設定中指定的使用者集合改寫規則（[§2.3.1](#s2-3-1)）之下，這些抽象關係可能會間接影響存取控制。"
  tab-1:
    header:
      - "以文字表示法表示的元組範例"
      - "語意"
    rows:
      - - "`doc:readme#owner@10`"
        - "使用者 10 是 `doc:readme` 的擁有者"
      - - "`group:eng#member@11`"
        - "使用者 11 是 `group:eng` 的成員"
      - - "`doc:readme#viewer@group:eng#member`"
        - "`group:eng` 的成員是 `doc:readme` 的檢視者"
      - - "`doc:readme#parent@folder:A#...`"
        - "`doc:readme` 位於 `folder:A` 中"
    caption: "表 1：關係元組範例。「#...」表示不影響元組語意的關係。"
  s2-1-p4:
    text: "將資料模型圍繞元組而非逐物件的 ACL 來定義，讓我們得以統一 ACL 與群組的概念，並支援高效率的讀取與增量更新，如我們將在 [§2.4](#s2-4) 中所見。"
  s2-2:
    text: "一致性模型"
  s2-2-p1:
    text: "ACL 檢查必須遵循使用者修改 ACL 與物件內容的順序，以避免出現非預期的分享行為。具體而言，我們的客戶端在意的是防止「new enemy」問題；當我們未能遵循 ACL 更新之間的順序，或將舊的 ACL 套用於新內容時，就可能發生此問題。請看以下兩個例子："
  s2-2-exa:
    title: "例 A：忽略 ACL 更新順序"
    items:
      - "Alice 將 Bob 從某個資料夾的 ACL 中移除；"
      - "接著 Alice 請 Charlie 將新文件移入該資料夾，其中文件的 ACL 繼承自資料夾的 ACL；"
      - "Bob 應該無法看到這些新文件，但若 ACL 檢查忽略了這兩次 ACL 變更之間的順序，他就可能看得到。"
  s2-2-exb:
    title: "例 B：將舊 ACL 誤用於新內容"
    items:
      - "Alice 將 Bob 從某份文件的 ACL 中移除；"
      - "接著 Alice 請 Charlie 在該文件中加入新內容；"
      - "Bob 應該無法看到這些新內容，但若 ACL 檢查是以 Bob 被移除之前的陳舊 ACL 進行評估，他就可能看得到。"
  s2-2-p2:
    text: "防止「new enemy」問題，需要 Zanzibar 理解並遵循 ACL 或內容更新之間的因果順序，包括對不同 ACL 或物件的更新，以及透過 Zanzibar 看不到的管道所協調的更新。因此，Zanzibar 必須提供兩項關鍵的一致性特性：*外部一致性* [[18](#ref-18)] 以及*具有有界陳舊度的快照讀取*。"
  s2-2-p3:
    text: "外部一致性讓 Zanzibar 能為每次 ACL 或內容更新指派一個時間戳記，使得兩個具有因果關係的更新 $x \\prec y$ 所獲指派的時間戳記能反映其因果順序：$T_x < T_y$。有了具因果意義的時間戳記，在時間戳記 $T$ 對 ACL 資料庫進行的快照讀取（會觀察到所有時間戳記 $\\le T$ 的更新）將會遵循 ACL 更新之間的順序。也就是說，若該讀取觀察到更新 $x$，它也會觀察到所有在因果上發生於 $x$ 之前的更新。"
  s2-2-p4:
    text: "此外，為了避免將舊 ACL 套用於新內容，ACL 檢查評估所用的快照不得比指派給內容更新的因果時間戳記更陳舊。給定一次在時間戳記 $T_c$ 的內容更新，在時間戳記 $\\ge T_c$ 進行的快照讀取，可確保所有在因果上發生於該內容更新之前的 ACL 更新都會被 ACL 檢查觀察到。"
  s2-2-p5:
    text: "為了提供外部一致性與具有有界陳舊度的快照讀取，我們將 ACL 儲存在 Spanner 全球資料庫系統中 [[15](#ref-15)]。Spanner 的 TrueTime 機制會為每次 ACL 寫入指派一個微秒解析度的時間戳記，使寫入的時間戳記反映寫入之間的因果順序，從而提供外部一致性。我們橫跨多次資料庫讀取，在單一快照時間戳記上評估每次 ACL 檢查，使得所有時間戳記不晚於該檢查快照的寫入（且僅有這些寫入）對 ACL 檢查可見。"
  s2-2-p6:
    text: "為了避免使用陳舊的 ACL 來評估對新內容的檢查，可以嘗試一律在最新快照上進行評估，使檢查結果反映直到該檢查呼叫為止的所有 ACL 寫入。然而，這種評估需要全域資料同步，伴隨高延遲的往返與受限的可用性。因此，我們設計了以下協定，在 Zanzibar 客戶端的配合下，讓大多數檢查都能在已複製的資料上進行評估："
  s2-2-protocol:
    items:
      - "Zanzibar 客戶端在內容修改即將儲存時，透過一次*內容變更* ACL 檢查（[§2.4.4](#s2-4-4)），為每個內容版本請求一個稱為 *zookie* 的不透明一致性權杖。Zanzibar 會將目前的全域時間戳記編碼進 zookie，並確保所有先前的 ACL 寫入都具有較低的時間戳記。客戶端以一次原子寫入，將 zookie 與內容變更一起儲存至客戶端儲存區。請注意，內容變更檢查不需要與應用程式內容修改在同一筆交易中評估，只需在使用者修改內容時觸發即可。"
      - "客戶端在後續的 ACL 檢查請求中傳送此 zookie，以確保檢查快照至少與該內容版本的時間戳記一樣新。"
  s2-2-p7:
    text: "外部一致性，加上以 zookie 界定陳舊度的快照讀取，可防止「new enemy」問題。在例 A 中，ACL 更新 A1 與 A2 將分別被指派時間戳記 $T_{A1} < T_{A2}$。Bob 將無法看到 Charlie 新增的文件：若檢查在 $T < T_{A2}$ 評估，文件的 ACL 將不包含資料夾的 ACL；若檢查在 $T \\ge T_{A2} > T_{A1}$ 評估，檢查將觀察到把 Bob 從資料夾 ACL 中移除的更新 A1。在例 B 中，Bob 將看不到新加入該文件的內容。若要讓 Bob 看到新內容，檢查必須以 $\\ge T_{B2}$（指派給內容更新的時間戳記）的 zookie 進行評估。由於 $T_{B2} > T_{B1}$，這樣的檢查也會觀察到把 Bob 從 ACL 中移除的 ACL 更新 B1。"
  s2-2-p8:
    text: "zookie 協定是 Zanzibar 一致性模型的一項關鍵特性。它確保 Zanzibar 遵循 ACL 與內容更新之間的因果順序，但除此之外，賦予 Zanzibar 選擇評估時間戳記的自由，以達成其延遲與可用性目標。此自由源自該協定「至少一樣新」的語意，允許 Zanzibar 選擇任何比 zookie 中所編碼者更新鮮的時間戳記。這樣的自由進而讓 Zanzibar 能以預設陳舊度、使用已複製的資料來處理大多數檢查（[§3.2.1](#s3-2-1)），並將評估時間戳記量化以避免熱點（[§3.2.5](#s3-2-5)）。"
  s2-3:
    text: "命名空間設定"
  s2-3-p1:
    text: "客戶端在將關係元組儲存至 Zanzibar 之前，必須先設定其命名空間。命名空間設定會指定其關係以及儲存參數。每個關係都有一個名稱（由客戶端定義的字串，例如 `viewer` 或 `editor`）以及一個關係設定。儲存參數包括分片設定，以及物件 ID 的編碼方式，後者有助於 Zanzibar 最佳化整數、字串及其他物件 ID 格式的儲存。"
  s2-3-1:
    text: "關係設定與使用者集合改寫"
  s2-3-1-p1:
    text: "雖然關係元組反映了物件與使用者之間的關係，但它們並未完整定義有效的 ACL。例如，有些客戶端指定：對每個物件具有 `editor` 權限的使用者，也應該對同一物件具有 `viewer` 權限。雖然這類關係之間的關係可以用每個物件一筆關係元組來表示，但為命名空間中的每個物件都儲存一筆元組既浪費，也會使跨所有物件的修改變得困難。因此，我們讓客戶端透過關係設定中的*使用者集合改寫規則*，定義與物件無關的關係。[圖 1](#fig-1) 展示一個具有同心關係的簡單命名空間設定，其中 `viewer` 包含 `editor`，而 `editor` 包含 `owner`。"
  fig-1:
    caption: "圖 1：文件上具有同心關係的簡單命名空間設定。所有擁有者都是編輯者，所有編輯者都是檢視者。此外，上層資料夾的檢視者也是該文件的檢視者。"
  s2-3-1-p2:
    text: "使用者集合改寫規則是針對命名空間中的每個關係分別定義的。每條規則指定一個函式，該函式以物件 ID 為輸入，並輸出一棵使用者集合運算式樹。樹的每個葉節點可以是下列任一種："
  s2-3-1-leaves:
    items:
      - "`_this`：傳回儲存的關係元組中針對該 ⟨*object#relation*⟩ 配對的所有使用者，包括元組中的使用者集合所參照的間接 ACL。這是未指定改寫規則時的預設行為。"
      - "`computed_userset`：針對輸入物件計算出一個新的使用者集合。例如，這讓 `viewer` 關係的使用者集合運算式能參照同一物件上的 `editor` 使用者集合，從而提供關係之間的 ACL 繼承能力。"
      - "`tuple_to_userset`：從輸入物件計算出一個元組集合（[§2.4.1](#s2-4-1)），擷取符合該元組集合的關係元組，並從每一筆擷取到的關係元組計算出一個使用者集合。這個彈性的基本操作讓我們的客戶端能表達複雜的政策，例如「查找文件的上層資料夾並繼承其檢視者」。"
  s2-3-1-p3:
    text: "使用者集合運算式也可以由多個子運算式組成，並以聯集、交集與排除等運算加以組合。"
  s2-4:
    text: "API"
  s2-4-p1:
    text: "除了支援 ACL 檢查之外，Zanzibar 也提供 API，讓客戶端讀取與寫入關係元組、監看元組更新，以及檢視有效的 ACL。"
  s2-4-p2:
    text: "這些 API 方法中通用的一個概念是 *zookie*。zookie 是一個不透明的位元組序列，編碼了一個具全域意義的時間戳記，此時間戳記反映一次 ACL 寫入、一個客戶端內容版本或一個讀取快照。ACL 讀取與檢查請求中的 zookie 為快照讀取指定陳舊度上限，從而提供 Zanzibar 的核心一致性特性之一。我們選擇使用不透明的 cookie 而非實際的時間戳記，是為了避免客戶端選擇任意的時間戳記，並保留未來擴充的空間。"
  s2-4-1:
    text: "Read"
  s2-4-1-p1:
    text: "我們的客戶端讀取關係元組，以向使用者顯示 ACL 或群組成員資格，或為後續的寫入做準備。讀取請求會指定一個或多個*元組集合*，以及一個選擇性的 zookie。"
  s2-4-1-p2:
    text: "每個*元組集合*指定一組關係元組的鍵。此集合可以包含單一元組鍵，或是命名空間中具有給定物件 ID 或使用者集合的所有元組，並可選擇性地以關係名稱加以限制。透過元組集合，客戶端可以查找特定的成員資格項目、讀取某個 ACL 或群組中的所有項目，或查找以給定使用者為直接成員的所有群組。讀取請求中的所有元組集合都在單一快照上處理。"
  s2-4-1-p3:
    text: "透過 zookie，若在讀取請求中提供先前寫入回應中的 zookie，客戶端可以請求一個不早於該次寫入的讀取快照；若在後續請求中提供先前讀取回應中的 zookie，則可請求與先前讀取相同的快照。若請求不包含 zookie，Zanzibar 會選擇一個相當新的快照，相較於提供 zookie 的情況，可能提供延遲更低的回應。"
  s2-4-1-p4:
    text: "讀取結果僅取決於關係元組的內容，不會反映使用者集合改寫規則。例如，即使 `viewer` 使用者集合永遠包含 `owner` 使用者集合，讀取 `viewer` 關係的元組也不會傳回 `owner` 關係的元組。需要瞭解有效使用者集合的客戶端可以使用 Expand API（[§2.4.5](#s2-4-5)）。"
  s2-4-2:
    text: "Write"
  s2-4-2-p1:
    text: "客戶端可以修改單一關係元組，以新增或移除一項 ACL。它們也可以透過採用樂觀並行控制 [[21](#ref-21)] 的讀取—修改—寫入流程，修改與某個物件相關的所有元組；此流程先使用一次讀取 RPC，再使用一次寫入 RPC："
  s2-4-2-steps:
    items:
      - "讀取某個物件的所有關係元組，包括一個逐物件的「鎖定」元組。"
      - "產生要寫入或刪除的元組。將這些寫入連同對鎖定元組的一次 touch 一併傳送至 Zanzibar，條件是唯有在鎖定元組自讀取以來未被修改的情況下，這些寫入才會被提交。"
      - "若寫入條件不成立，回到步驟 1。"
  s2-4-2-p2:
    text: "鎖定元組只是一筆一般的關係元組，供客戶端用來偵測寫入競爭。"
  s2-4-3:
    text: "Watch"
  s2-4-3-p1:
    text: "有些客戶端會為 Zanzibar 中的關係元組維護次要索引。它們可以透過我們的 Watch API 做到這一點。Watch 請求會指定一個或多個命名空間，以及一個代表開始監看時間的 zookie。Watch 回應包含從請求的起始時間戳記，到 Watch 回應中所附*心跳 zookie* 所編碼之時間戳記為止的所有元組修改事件，並依時間戳記遞增排序。客戶端可以使用心跳 zookie，從前一個 Watch 回應結束之處繼續監看。"
  s2-4-4:
    text: "Check"
  s2-4-4-p1:
    text: "Check 請求會指定一個以 ⟨*object#relation*⟩ 表示的使用者集合、一位推定的使用者（通常以驗證權杖表示），以及一個對應於所需物件版本的 zookie。與讀取相同，檢查一律在不早於給定 zookie 的一致性快照上進行評估。"
  s2-4-4-p2:
    text: "為了授權應用程式內容的修改，我們的客戶端會傳送一種特殊類型的檢查請求：*內容變更*檢查。內容變更檢查請求不攜帶 zookie，並在最新快照上進行評估。若內容變更獲得授權，檢查回應會包含一個 zookie，供客戶端與物件內容一併儲存，並用於該內容版本的後續檢查。該 zookie 編碼了評估快照，並捕捉從 ACL 變更到內容變更的任何可能因果關係，因為 zookie 的時間戳記將大於保護新內容之 ACL 更新的時間戳記（[§2.2](#s2-2)）。"
  s2-4-5:
    text: "Expand"
  s2-4-5-p1:
    text: "Expand API 在給定一組 ⟨*object#relation*⟩ 配對及一個選擇性 zookie 的情況下，傳回有效的使用者集合。與 Read API 不同，Expand 會追蹤透過使用者集合改寫規則所表達的間接參照。結果以一棵*使用者集合樹*表示，其葉節點為使用者 ID 或指向其他 ⟨*object#relation*⟩ 配對的使用者集合，而中間節點則代表聯集、交集或排除運算子。Expand 對於我們的客戶端推論有權存取其物件的完整使用者與群組集合至關重要，這讓它們能為受存取控制的內容建構高效率的搜尋索引。"
  s3:
    text: "架構與實作"
  s3-p1:
    text: "[圖 2](#fig-2) 顯示 Zanzibar 系統的架構。`aclservers` 是主要的伺服器類型。它們以叢集方式組織，並回應 Check、Read、Expand 與 Write 請求。請求會抵達叢集中的任一台伺服器，該伺服器再視需要將工作扇出至叢集中的其他伺服器。這些伺服器又可能聯絡其他伺服器以計算中間結果。最初的伺服器收集最終結果並將其傳回給客戶端。"
  s3-p2:
    text: "Zanzibar 將 ACL 及其中繼資料儲存在 Spanner 資料庫中。每個客戶端命名空間各有一個資料庫用來儲存關係元組，另有一個資料庫存放所有命名空間設定，以及一個由所有命名空間共用的變更日誌資料庫。`aclservers` 在回應客戶端請求的過程中讀寫這些資料庫。"
  s3-p3:
    text: "`watchservers` 是專門回應 Watch 請求的伺服器類型。它們持續追蹤變更日誌的尾端，並以近乎即時的方式向客戶端提供命名空間變更的串流。"
  s3-p4:
    text: "Zanzibar 會定期執行一條資料處理管線，對 Spanner 中的所有 Zanzibar 資料執行各種離線功能。其中一項功能是在已知的快照時間戳記下，產生每個命名空間中關係元組的傾印。另一項則是對早於每個命名空間所設定之門檻的元組版本進行垃圾回收。"
  fig-2:
    alt: "架構圖。客戶端將 Check、Read、Expand 與 Write 傳送至由相互連接的 aclservers 所組成的 Zanzibar 服務叢集。aclservers 在 Spanner 全球資料庫系統中讀寫命名空間設定與各命名空間的關係元組，並附加至變更日誌。watchserver 追蹤變更日誌的尾端，並向客戶端與 Leopard 索引系統提供 Watch。一條定期執行的離線管線讀寫 Spanner 並傾印命名空間快照，供 Leopard 讀取。Leopard 為 aclservers 提供最佳化的集合運算。"
    caption: "圖 2：Zanzibar 架構。箭頭表示資料流的方向。"
  s3-p5:
    text: "Leopard 是一套索引系統，用於最佳化對大型且深層巢狀集合的操作。它讀取 ACL 資料的定期快照，並監看快照之間的變更。它會對這些資料執行轉換（例如反正規化），並回應來自 `aclservers` 的請求。"
  s3-p6:
    text: "本節其餘部分將更詳細地介紹這些架構元素的實作。"
  s3-1:
    text: "儲存"
  s3-1-1:
    text: "關係元組儲存"
  s3-1-1-p1:
    text: "我們將每個命名空間的關係元組儲存在獨立的資料庫中，其中每一列以主鍵 *（分片 ID、物件 ID、關係、使用者、提交時間戳記）* 識別。多個元組版本儲存在不同的列上，因此我們可以在垃圾回收時間窗內的任何時間戳記評估檢查與讀取。主鍵的排序方式讓我們能查找給定物件 ID 或 *（物件 ID、關係）* 配對的所有關係元組。"
  s3-1-1-p2:
    text: "我們的客戶端依據命名空間的資料模式來設定其分片方式。分片 ID 通常僅由物件 ID 決定。在某些情況下，例如命名空間儲存成員數量非常龐大的群組時，分片 ID 會同時根據物件 ID 與使用者計算。"
  s3-1-2:
    text: "變更日誌"
  s3-1-2-p1:
    text: "Zanzibar 也維護一個變更日誌資料庫，為 Watch API 儲存元組更新的歷史紀錄。其主鍵為 *（變更日誌分片 ID、時間戳記、唯一更新 ID）*，其中每次寫入都會隨機選擇一個變更日誌分片。"
  s3-1-2-p2:
    text: "每一次 Zanzibar 寫入都會在單一交易中同時提交至元組儲存區與變更日誌分片。我們指定託管該變更日誌分片的 Spanner 伺服器作為交易協調者，以盡量減少變更日誌讀取因待處理交易而被阻塞的情況。"
  s3-1-3:
    text: "命名空間設定儲存"
  s3-1-3-p1:
    text: "命名空間設定儲存在一個包含兩個資料表的資料庫中。一個資料表存放設定，以命名空間 ID 為鍵。另一個則是設定更新的變更日誌，以提交時間戳記為鍵。此結構讓 Zanzibar 伺服器能在啟動時載入所有設定，並監控變更日誌以持續更新設定。"
  s3-1-4:
    text: "複製"
  s3-1-4-p1:
    text: "為了降低延遲，Zanzibar 的資料會被複製到靠近客戶端的位置。副本分布於全球數十個地點，每個區域都有多個副本。5 個投票副本位於美國東部與中部，分處 3 個不同的都會區以隔離故障，但彼此之間的距離在 25 毫秒以內，讓 Paxos 交易能快速提交。"
  s3-2:
    text: "服務"
  s3-2-1:
    text: "評估時間戳記"
  s3-2-1-p1:
    text: "如 [§2.4](#s2-4) 所述，客戶端可以提供 zookie，以確保請求評估所用快照時間戳記的下限。未提供 zookie 時，伺服器會使用一個預設陳舊度，此值的選擇是為了確保所有交易都能在不影響延遲的前提下，於盡可能新的時間戳記進行評估。"
  s3-2-1-p2:
    text: "對於發送給 Spanner 的每一個讀取請求，Zanzibar 都會收到一個提示，指出該時間戳記的資料是否需要區域外讀取，從而產生額外延遲。每台伺服器會追蹤預設陳舊度下的資料，以及較新與較陳舊的資料發生此類區域外讀取的頻率，並利用這些頻率計算任一筆給定資料在各陳舊度下可於本地取得之機率的二項比例信賴區間。"
  s3-2-1-p3:
    text: "收集到足夠的資料後，伺服器會檢查每個陳舊度值發生區域外讀取的機率是否夠低，從而能維持低延遲。若是如此，它便將預設陳舊度界限更新為最低的「安全」值。若已知的陳舊度值都不安全，我們會使用雙比例 z 檢定，檢查提高預設值是否會在統計上顯著地更安全。若是如此，我們便提高預設值，以期改善延遲。此預設陳舊度機制純粹是一種效能最佳化。它不會違反一致性語意，因為只要提供了 zookie，Zanzibar 一律會遵循。"
  s3-2-2:
    text: "設定一致性"
  s3-2-2-p1:
    text: "由於命名空間設定的變更可能改變 ACL 評估的結果，進而影響其正確性，Zanzibar 在評估每個客戶端請求時，會為設定中繼資料選擇單一的快照時間戳記。叢集中的所有 `aclservers` 對同一請求都使用同一個時間戳記，包括從原始客戶端請求扇出的任何子請求。"
  s3-2-2-p2:
    text: "每台伺服器都會在命名空間設定變更時，獨立且持續地從儲存區載入設定（[§3.1.3](#s3-1-3)）。因此，由於重新啟動或網路延遲，叢集中的每台伺服器可存取的設定時間戳記範圍可能各不相同。Zanzibar 必須挑選一個在所有伺服器上都可用的時間戳記。為此，一項監控工作會追蹤每台伺服器可用的時間戳記範圍並加以彙整，再將全域可用的範圍回報給其他每一台伺服器。對於每個傳入的請求，伺服器會從此範圍中挑選一個時間，確保即使伺服器已無法從設定儲存區讀取，所有伺服器仍能繼續提供服務。"
  s3-2-3:
    text: "檢查評估"
  s3-2-3-p1:
    text: "Zanzibar 透過將檢查請求轉換為布林運算式來評估 ACL 檢查。在沒有使用者集合改寫規則的簡單情況下，針對使用者集合 ⟨*object#relation*⟩ 檢查使用者 $U$ 可以表示為"
  s3-2-3-p2:
    text: "找出有效的 $U' = \\langle \\mathit{object}'\\#\\mathit{relation}' \\rangle$ 需要以遞迴方式評估所有間接 ACL 或群組上的成員資格。這種「指標追蹤」對大多數類型的 ACL 與群組都運作良好，但當間接 ACL 或群組很深或很寬時，成本可能相當高。[§3.2.4](#s3-2-4) 說明我們如何處理這個問題。使用者集合改寫規則也會在檢查評估的過程中轉換為布林運算式。"
  s3-2-3-p3:
    text: "為了將檢查延遲降至最低，我們會同時評估布林運算式樹的所有葉節點。當某個節點的結果決定了一棵子樹的結果時，該子樹中其他節點的評估就會被取消。"
  s3-2-3-p4:
    text: "葉節點的評估通常涉及從資料庫讀取關係元組。我們採用一種池化機制，將同一 ACL 檢查的讀取歸併在一起，以盡量減少發送至 Spanner 的讀取 RPC 數量。"
  s3-2-4:
    text: "Leopard 索引系統"
  s3-2-4-p1:
    text: "對於深層巢狀或擁有大量子群組的群組，檢查評估期間的遞迴指標追蹤難以維持低延遲。對於呈現此類結構的特定命名空間，Zanzibar 會使用 Leopard 處理檢查；Leopard 是一種支援高效率集合運算的專用索引。"
  s3-2-4-p2:
    text: "Leopard 索引使用 $(T, s, e)$ 元組來表示一組具名集合，其中 $T$ 為代表集合類型的列舉值，$s$ 與 $e$ 為 64 位元整數，分別代表集合 ID 與元素 ID。查詢會評估由具名集合的聯集、交集或排除所構成的運算式，並傳回依元素 ID 排序的結果集合，最多傳回指定數量的結果。"
  s3-2-4-p3:
    text: "為了索引及評估群組成員資格，Zanzibar 以兩種集合類型 $\\textsf{GROUP2GROUP}$ 與 $\\textsf{MEMBER2GROUP}$ 來表示群組成員資格，此處我們將其表示為從集合 ID 映射到元素 ID 的函式："
  s3-2-4-sets:
    items:
      - "$\\textsf{GROUP2GROUP}(s) \\to \\{e\\}$，其中 $s$ 代表一個祖先群組，$e$ 代表一個*直接或間接*屬於該祖先群組之子群組的後代群組。"
      - "$\\textsf{MEMBER2GROUP}(s) \\to \\{e\\}$，其中 $s$ 代表一位個別使用者，$e$ 代表該使用者為其*直接*成員的上層群組。"
  s3-2-4-p4:
    text: "為了評估使用者 $U$ 是否為群組 $G$ 的成員，我們檢查是否滿足"
  s3-2-4-p5:
    text: "群組成員資格可視為圖中的可達性問題，其中節點代表群組與使用者，邊代表直接成員關係。將群組到群組的路徑扁平化，可讓 Leopard 高效率地評估可達性，不過也可以依資料模式的需求套用其他類型的反正規化。"
  s3-2-4-p6:
    text: "Leopard 系統由三個獨立部分組成：一套能跨集合執行一致且低延遲操作的服務系統；一套離線、定期執行的索引建構系統；以及一個線上即時層，能在元組變更發生時持續更新服務系統。"
  s3-2-4-p7:
    text: "索引元組以有序整數清單的形式，儲存在跳躍串列之類的結構中，從而能在集合之間高效率地進行聯集與交集。例如，評估兩個集合 $A$ 與 $B$ 的交集，只需要 $O(\\min(|A|, |B|))$ 次跳躍串列搜尋。索引依元素 ID 進行分片，並可分散到多台伺服器上。分片通常完全從記憶體提供服務，但也可以從分散於記憶體與遠端固態儲存裝置之間的冷熱混合資料提供服務。"
  s3-2-4-p8:
    text: "離線索引建構器從 Zanzibar 關係元組與設定的快照產生索引分片，並將分片複製到全球各地。它遵循使用者集合改寫規則，並遞迴展開 ACL 圖中的邊，以形成 Leopard 索引元組。Leopard 伺服器會持續監看新分片，並在新分片可用時以其替換舊分片。"
  s3-2-4-p9:
    text: "到目前為止所描述的 Leopard 系統能夠高效率地評估深層且廣泛巢狀的群組成員資格，但由於離線索引產生與分片替換，無法在新鮮且一致的快照上做到這一點。為了支援一致的 ACL 評估，Leopard 伺服器維護一個增量層，為自離線快照以來的所有更新建立索引，其中每次更新以一個 $(T, s, e, t, d)$ 元組表示，$t$ 為更新的時間戳記，$d$ 為刪除標記。在查詢處理期間，時間戳記小於或等於查詢時間戳記的更新會合併至離線索引之上。"
  s3-2-4-p10:
    text: "為了維護增量層，Leopard 增量索引器會呼叫 Zanzibar 的 Watch API，以接收依時間排序的 Zanzibar 元組修改串流，並將這些更新轉換為依時間排序的 Leopard 元組新增、更新與刪除串流。為 $\\textsf{GROUP2GROUP}$ 元組產生更新時，增量索引器需要維護群組到群組的成員關係，以便將一次關係元組更新的影響反正規化為可能多次的索引更新。"
  s3-2-4-p11:
    text: "實務上，單一 Zanzibar 元組的新增或刪除，可能產生多達數萬個個別的 Leopard 元組事件。每個 Leopard 服務實例都透過 Watch API 接收這些 Zanzibar 元組變更的完整串流。Leopard 服務系統的設計目標是持續攝取此串流，並在對查詢服務影響最小的情況下更新其各種倒排清單。"
  s3-2-5:
    text: "處理熱點"
  s3-2-5-p1:
    text: "ACL 讀取與檢查的工作負載經常呈突發性，且容易產生熱點。例如，回應一個搜尋查詢需要對所有候選結果執行 ACL 檢查，而這些結果的 ACL 經常共用相同的群組或間接 ACL。為了促進一致性，Zanzibar 避免儲存層的反正規化，僅依賴正規化資料（[§3.2.4](#s3-2-4) 所述的情況除外）。在正規化資料下，常見 ACL（例如熱門群組）上的熱點可能使底層資料庫伺服器過載。我們發現，熱點的處理是我們追求低延遲與高可用性過程中最關鍵的前線。"
  s3-2-5-p2:
    text: "每個叢集中的 Zanzibar 伺服器會為讀取與檢查評估形成一個分散式快取，其中包括在指標追蹤期間評估出的中間檢查結果。快取項目透過一致性雜湊 [[20](#ref-20)] 分散於各 Zanzibar 伺服器之間。為了處理檢查或讀取，我們透過內部 RPC 介面將請求扇出至對應的 Zanzibar 伺服器。為了盡量減少內部 RPC 的數量，對於大多數命名空間，我們以物件 ID 計算轉送鍵，因為處理 ⟨*object#relation*⟩ 上的檢查，往往涉及對同一物件其他關係的間接 ACL 檢查，以及讀取該物件的關係元組。由於這些檢查與讀取與上層檢查請求共用相同的轉送鍵，因此可以由同一台伺服器處理。為了處理熱門的轉送鍵，我們在內部 RPC 的呼叫端與被呼叫端都快取結果，實際上形成了快取樹。我們也使用 Slicer [[12](#ref-12)] 協助將熱門鍵分散至多台伺服器。"
  s3-2-5-p3:
    text: "我們透過將快照時間戳記編碼進快取鍵，避免重複使用從不同快照評估出的結果。我們選擇的評估時間戳記會向上取整至較粗的粒度，例如一秒或十秒，同時遵循請求 zookie 所施加的陳舊度限制。這種時間戳記量化讓絕大多數近期的檢查與讀取能在相同的時間戳記上評估並共用快取結果，儘管快取鍵中的時間戳記具有微秒解析度。值得注意的是，將時間戳記向上取整並不會影響 Zanzibar 的一致性特性，因為 Spanner 確保在時間戳記 $T$ 進行的快照讀取會觀察到直到 $T$ 為止的所有寫入——即使 $T$ 位於未來也是如此，此時讀取會等待，直到 TrueTime 越過 $T$ 為止。"
  s3-2-5-p4:
    text: "為了處理「快取踩踏」問題 [[3](#ref-3)]（亦即在快取填入結果之前，並行請求造成瞬間熱點），我們在每台伺服器上維護一個*鎖定表*，以追蹤未完成的讀取與檢查。在共用相同快取鍵的請求中，只有一個請求會開始處理；其餘請求則會阻塞，直到快取被填入為止。"
  s3-2-5-p5:
    text: "透過分散式快取與鎖定表，我們能有效處理絕大多數熱點。隨著時間推移，我們做了以下兩項改進。"
  s3-2-5-p6:
    text: "首先，針對某個物件與關係的使用者直接成員資格檢查（即 ⟨*object#relation@user*⟩）通常只需一次關係元組查找即可處理。然而，偶爾會有非常熱門的物件吸引大量針對不同使用者的並行檢查，導致託管該物件關係元組的儲存伺服器出現熱點。為了避免這些熱點，我們針對熱門物件讀取並快取 ⟨*object#relation*⟩ 的*所有*關係元組，以讀取頻寬換取可快取性。我們透過追蹤每個物件上未完成讀取的數量，動態偵測要套用此方法的熱門物件。"
  s3-2-5-p7:
    text: "其次，當上層 ACL 檢查的結果已經確定時，間接 ACL 檢查經常會被取消。這會使快取鍵維持未填入的狀態。雖然積極取消可大幅減少資源使用量，但它會對被鎖定表項目阻塞的並行請求的延遲造成負面影響。為了防止這種延遲影響，當對應的鎖定表項目上有等待者時，我們會延後積極取消。"
  s3-2-6:
    text: "效能隔離"
  s3-2-6-p1:
    text: "對於以低延遲與高可用性為目標的共用服務而言，效能隔離不可或缺。若 Zanzibar 或其某個客戶端偶爾未能配置足夠的資源來應付非預期的使用模式，以下的隔離機制可確保效能問題被隔離在有問題的使用情境中，而不會對其他客戶端造成不利影響。"
  s3-2-6-p2:
    text: "首先，為了確保 CPU 容量的妥善分配，Zanzibar 以通用的 *cpu-seconds*（一種與硬體無關的指標）來衡量每個 RPC 的成本。每個客戶端都有一個全域的每秒最大 CPU 使用量上限；若它超過此上限，*而且*整個系統沒有剩餘容量，其 RPC 便會被節流。"
  s3-2-6-p3:
    text: "每台 Zanzibar 伺服器也會限制未完成 RPC 的總數，以控制其記憶體使用量。同樣地，它也會限制每個客戶端未完成 RPC 的數量。"
  s3-2-6-p4:
    text: "Zanzibar 進一步在每台 Spanner 伺服器上，限制每個 *（物件、客戶端）* 及每個客戶端的最大並行讀取數。這可確保沒有任何單一物件或客戶端能獨占一台 Spanner 伺服器。"
  s3-2-6-p5:
    text: "最後，我們對來自不同客戶端的請求使用不同的鎖定表鍵，以防止 Spanner 對某個客戶端施加的節流影響到其他客戶端。"
  s3-2-7:
    text: "尾端延遲緩解"
  s3-2-7-p1:
    text: "Zanzibar 的分散式處理需要採取措施來因應緩慢的任務。對於呼叫 Spanner 與 Leopard 索引，我們仰賴請求對沖 [[16](#ref-16)]（亦即將同一請求傳送至多台伺服器，採用最先傳回的回應，並取消其他請求）。為了縮短往返時間，我們嘗試在每個設有 Zanzibar 伺服器的地理區域中，為這些後端服務放置至少兩個副本。為了避免不必要地使負載倍增，我們會先傳送一個請求，並延後傳送對沖請求，直到已知最初的請求很慢為止。"
  s3-2-7-p2:
    text: "為了決定適當的對沖延遲門檻，每台伺服器都維護一個延遲估計器，根據近期的量測結果動態計算第 *N* 百分位延遲。此機制讓我們能將對沖所產生的額外流量限制在總流量的一小部分。"
  s3-2-7-p3:
    text: "有效的對沖需要各請求具有相近的成本。以 Zanzibar 的授權檢查而言，有些檢查因為需要更多工作，本質上就比其他檢查更耗時。對沖檢查請求會導致成本最高的工作負載被重複執行，諷刺的是反而使延遲惡化。因此，我們不在 Zanzibar 伺服器之間對沖請求，而是仰賴先前討論過的多副本間分片，以及監控機制來偵測並避開緩慢的伺服器。"
  s4:
    text: "經驗"
  s4-p1:
    text: "Zanzibar 已在正式環境中使用超過 5 年。在這段期間，使用 Zanzibar 的客戶端數量及其對 Zanzibar 造成的負載都穩定成長。本節討論我們將 Zanzibar 作為全球分散式授權系統來營運的經驗。"
  s4-p2:
    text: "Zanzibar 管理由數百個客戶端應用程式所定義的超過 1,500 個命名空間。命名空間設定檔的大小可作為該命名空間所實作之存取控制政策複雜度的粗略指標。這些設定檔從數十行到數千行不等，中位數接近 500 行。"
  s4-p3:
    text: "這些命名空間包含超過 2 兆筆關係元組，佔用將近 100 TB。每個命名空間的元組數量橫跨多個數量級，從數十筆到一兆筆不等，中位數接近 15,000 筆。這些資料完整複製於全球超過 30 個地點，以同時維持與使用者的鄰近性及高可用性。"
  s4-p4:
    text: "Zanzibar 每秒處理超過 1,000 萬次客戶端查詢（QPS）。在 2018 年 12 月一段 7 天的取樣期間，Check 請求的尖峰約為 420 萬 QPS，Read 為 820 萬，Expand 為 76 萬，Write 為 2.5 萬。因此，讀取資料的查詢比寫入資料的查詢頻繁兩個數量級。"
  s4-p5:
    text: "Zanzibar 將此負載分散到超過 10,000 台伺服器上，這些伺服器組成分布於全球的數十個叢集。每個叢集的伺服器數量從不到 100 台到超過 1,000 台不等，中位數接近 500 台。各叢集的規模依其所在地理區域的負載比例配置。"
  s4-1:
    text: "請求"
  s4-1-p1:
    text: "我們依據所需的資料新鮮度將請求分為兩類，新鮮度可能對請求的延遲與可用性造成很大影響。具體而言，Check、Read 與 Expand 請求會攜帶 zookie，以指定評估時間戳記的下限。當 zookie 的時間戳記高於已複製到該區域之最新資料的時間戳記時，儲存讀取就需要跨區域往返至領導者副本，以取得較新的資料。由於我們的儲存設定為以 8 秒間隔進行複製心跳，我們將請求分為兩類：*Safe* 請求的 zookie 時齡超過 10 秒，大多數時候可在區域內提供服務；而 *Recent* 請求的 zookie 時齡未滿 10 秒，經常需要跨區域往返。我們分別報告兩者的統計數據。"
  fig-3:
    alt: "一週（星期日至星期六）的對數刻度折線圖。Safe QPS 每日在約 200 萬至 400 萬之間波動；Recent QPS 在約 2 萬至 8 萬之間波動，約低兩個數量級。"
    caption: "圖 3：2018 年 12 月一段 7 天期間內 Check Safe 與 Check Recent 請求的速率。"
  s4-1-p2:
    text: "[圖 3](#fig-3) 顯示 7 天內 Check Safe 與 Check Recent 請求的速率。兩者都呈現日週期變化。Safe 請求的速率約比 Recent 請求高兩個數量級，這讓 Zanzibar 能在本地處理絕大多數 ACL 檢查。"
  s4-2:
    text: "延遲"
  s4-2-p1:
    text: "客戶端必須在數百毫秒的總回應時間內完成回應，才能成為可行的互動式服務，而 Zanzibar 的延遲預算通常只佔其中一小部分。例如，試想一個客戶端必須先對多份文件執行授權檢查，才能顯示對這些文件的搜尋結果。"
  s4-2-p2:
    text: "我們使用即時流量在伺服器端量測延遲，原因是：（1）延遲受到我們的快取與去重複機制的嚴重影響，因此只有即時流量才能真實反映延遲；（2）從客戶端準確量測延遲需要行為良好的客戶端。客戶端工作的資源配置不在 Zanzibar 的掌控範圍內，而客戶端工作有時會過載。"
  fig-4:
    alt: "一週內 Check Safe 延遲的對數刻度折線圖。第 50 百分位維持在 3 ms 左右，第 95 百分位在 10 ms 左右，第 99 百分位約在 13 至 20 ms 之間，第 99.9 百分位約在 50 至 90 ms 之間。"
    caption: "圖 4：2018 年 12 月一段 7 天期間內 Check Safe 回應在不同百分位的延遲。"
  s4-2-p3:
    text: "[圖 4](#fig-4) 顯示 7 天內 Check Safe 回應的延遲。在第 50、95、99 與 99.9 百分位，其尖峰分別約為 3、11、20 與 93 毫秒。對於一項經常位於使用者互動關鍵路徑上的操作而言，此效能符合我們的延遲目標。"
  s4-2-p4:
    text: "[表 2](#tab-2) 總結了同樣 7 天內 Check、Read、Expand 與 Write 回應的延遲分布。如同設計所預期，較常使用的 Check、Read 與 Expand 的 Safe 版本，明顯比較少使用的 Recent 版本更快。在所有 API 中，Write 的使用頻率最低，速度也最慢，因為它們一律需要 Spanner 伺服器之間的分散式協調。"
