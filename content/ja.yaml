# ja translation of content/en.yaml. Translate the values; keep ids, keys and order.
lang: ja
meta:
  title: "Zanzibar: Google の一貫性を備えたグローバル認可システム"
blocks:
  author-note:
    text: "Google 在籍中に行った研究。"
  abstract:
    text: "概要"
  abstract-p1:
    text: "オンラインのユーザーがデジタルオブジェクトへのアクセスを認可されているかどうかを判定することは、プライバシーを守るうえで中核をなす。本論文では、アクセス制御リストを格納・評価するためのグローバルなシステムである Zanzibar の設計、実装、およびデプロイについて述べる。Zanzibar は統一されたデータモデルと設定言語を提供し、Calendar、Cloud、Drive、Maps、Photos、YouTube を含む Google の数百のクライアントサービスが求める多種多様なアクセス制御ポリシーを表現できるようにする。その認可判定はユーザーの操作の因果的順序を尊重し、それによってアクセス制御リストやオブジェクトの内容が変更される中でも外部一貫性を提供する。Zanzibar は数兆のアクセス制御リストと毎秒数百万の認可リクエストにまでスケールし、数十億人が利用するサービスを支えている。3 年間の本番運用を通じて、95 パーセンタイルレイテンシ 10 ミリ秒未満、可用性 99.999% 超を維持してきた。"
  s1:
    text: "はじめに"
  s1-p1:
    text: "多くのオンラインのやり取りでは、ユーザーがデジタルオブジェクトに対してある操作を行う権限を持っていることを確認するための認可チェックが必要となる。たとえば、Web ベースの写真保存サービスでは一般に、写真の所有者が一部の写真を友人と共有し、他の写真は非公開のままにしておくことができる。このようなサービスは、ユーザーに写真の閲覧を許可する前に、その写真がそのユーザーと共有されているかどうかをチェックしなければならない。堅牢な認可チェックは、オンラインのプライバシーを守るうえで中核をなす。"
  s1-p2:
    text: "本論文では、権限を格納し、格納された権限に基づいて認可チェックを行うシステムである Zanzibar を紹介する。Zanzibar は、Calendar、Cloud、Drive、Maps、Photos、YouTube を含む、Google が提供する幅広いサービスで利用されている。これらのサービスのうちいくつかは、10 億人を超えるユーザーに代わって数十億のオブジェクトを管理している。"
  s1-p3:
    text: "統一された認可システムには、個々のアプリケーションごとに別々のアクセス制御機構を維持するのに比べて重要な利点がある。第一に、アプリケーション間で一貫したセマンティクスとユーザー体験を確立しやすくなる。第二に、アプリケーション同士の相互運用が容易になる。たとえば、あるアプリケーションのオブジェクトが別のアプリケーションのオブジェクトを埋め込む場合に、アクセス制御を連携させることができる。第三に、統一されたアクセス制御システムの上に有用な共通基盤を構築できる。特に、アクセス制御を尊重し、アプリケーションをまたいで機能する検索インデックスがそれにあたる。最後に、以下で示すように、認可はデータの一貫性とスケーラビリティに関わる固有の課題を抱えている。それらにアプリケーション横断で一度だけ取り組むことで、エンジニアリングのリソースを節約できる。"
  s1-p4:
    text: "Zanzibar システムの目標は以下のとおりである。"
  s1-goals:
    items:
      - "*正確性*：ユーザーの意図を尊重するため、アクセス制御判定の一貫性を保証しなければならない。"
      - "*柔軟性*：コンシューマー向けとエンタープライズ向けの両方のアプリケーションが必要とする、豊富なアクセス制御ポリシーをサポートしなければならない。"
      - "*低レイテンシ*：認可チェックはしばしばユーザーとのやり取りのクリティカルパス上にあるため、迅速に応答しなければならない。テールにおける低レイテンシは、検索結果の提供において特に重要である。検索結果の提供には、しばしば数十から数百のチェックが必要となるからである。"
      - "*高可用性*：確実にリクエストに応答しなければならない。明示的な認可がなければ、クライアントサービスはユーザーのアクセスを拒否せざるを得なくなるからである。"
      - "*大規模性*：数十億のユーザーが共有する数十億のオブジェクトを保護する必要がある。クライアントとそのエンドユーザーの近くに置くため、世界中にデプロイされなければならない。"
  s1-p5:
    text: "Zanzibar は、いくつかの注目すべき機能を組み合わせることでこれらの目標を達成している。柔軟性を提供するため、Zanzibar はシンプルなデータモデルと強力な設定言語を組み合わせている。この言語により、クライアントはユーザーとオブジェクトの間に `owner`、`editor`、`commenter`、`viewer` といった任意の関係を定義できる。また、この言語は積集合や和集合といった集合演算子を備えており、それらのユーザーとオブジェクトの関係を用いて、潜在的に複雑なアクセス制御ポリシーを記述できる。たとえば、あるアプリケーションは、ドキュメントの編集権限を付与されたユーザーはそのドキュメントへのコメントも許可されるが、コメントできるユーザー全員に編集権限が与えられるわけではない、と指定できる。"
  s1-p6:
    text: "実行時には、Zanzibar はリモートプロシージャコール (RPC) インターフェースを通じて、クライアントがアクセス制御リスト (ACL) を作成、変更、評価できるようにする。単純な ACL は「ユーザー *U* はオブジェクト *O* に対して関係 *R* を持つ」という形をとる。より複雑な ACL は「ユーザーの集合 *S* はオブジェクト *O* に対して関係 *R* を持つ」という形をとり、ここで *S* 自体も別のオブジェクトと関係のペアによって指定される。このように ACL は他の ACL を参照できる。たとえば、ある動画にコメントできるユーザーの集合は、その特定の動画の閲覧権限を付与されたユーザーと、その動画のチャンネルの閲覧権限を持つユーザーから成る、と指定できる。"
  s1-p7:
    text: "グループメンバーシップは ACL の重要な一種であり、オブジェクトがグループで、関係が意味的に `member` と等価なものである。グループは他のグループを含むことができる。これは Zanzibar が直面する課題の一つを示している。すなわち、ユーザーがグループに属するかどうかを評価するには、入れ子になったグループメンバーシップの長い連鎖をたどる必要が生じうるという点である。"
  s1-p8:
    text: "認可チェックは「ユーザー *U* はオブジェクト *O* に対して関係 *R* を持つか？」という形をとり、分散したサーバー群によって評価される。チェックリクエストが Zanzibar に到着すると、そのチェックを評価する作業は複数のサーバーにファンアウトすることがある。たとえば、グループが個々のメンバーと他のグループの両方を含む場合である。それらの各サーバーはさらに他のサーバーに問い合わせることがある。グループメンバーシップの階層を再帰的にたどる場合がその例である。"
  s1-p9:
    text: "Zanzibar は複数の次元においてグローバルな規模で稼働している。2 兆を超える ACL を格納し、毎秒数百万の認可チェックを実行している。あらゆるオブジェクトに対する認可チェックが世界のどこからでも来うるため、ACL データは地理的な分割に向かない。そのため Zanzibar は、すべての ACL データを地理的に分散した数十のデータセンターに複製し、世界中の数千台のサーバーに負荷を分散している。"
  s1-p10:
    text: "Zanzibar は、相互に関連する 2 つの機能によって、アクセス制御判定のグローバルな一貫性をサポートする。一つは、ACL の変更が基盤となるデータストアにコミットされる順序を尊重することである。もう一つは、認可チェックが、クライアントが指定した変更よりも古くない ACL データに基づくことを保証できることである。したがって、たとえばクライアントはあるユーザーをグループから削除し、その後のメンバーシップチェックにその削除が反映されることを確信できる。Zanzibar は、外部一貫性を保証するグローバル分散データベースシステムに ACL を格納することで、これらの順序特性を提供している [[15](#ref-15), [18](#ref-18)]。"
  s1-p11:
    text: "Zanzibar は、このグローバルに分散した環境で低レイテンシと高可用性を達成するために、さまざまな技法を用いている。その一貫性プロトコルにより、リクエストの大部分はリージョンをまたぐラウンドトリップを必要とせず、ローカルに複製されたデータで処理できる。Zanzibar は一貫性のためにデータを正規化された形で格納している。正規化されたデータ上のホットスポットには、最終結果と中間結果のキャッシュ、および同時リクエストの重複排除によって対処している。また、リクエストのヘッジや、限定的な非正規化による深く入れ子になった集合上の計算の最適化といった技法も適用している。Zanzibar は認可チェックの 95% 超に 10 ミリ秒以内で応答しており、過去 3 年間にわたって 99.999% を超える可用性を維持してきた。"
  s1-p12:
    text: "本論文の主な貢献は、一貫性のある世界規模の認可システムを構築しデプロイする際のエンジニアリング上の課題を伝える点にある。Zanzibar の設計要素の大半は先行研究にルーツを持つが、本論文は、正確性、柔軟性、レイテンシ、可用性、スケーラビリティに対する厳しい要件を満たすために Zanzibar が組み合わせた機能と技法を記録するものである。また本論文では、多様で要求の厳しいクライアント群のために Zanzibar を運用して得た教訓にも焦点を当てる。"
  s2:
    text: "モデル、言語、API"
  s2-p1:
    text: "本節では、Zanzibar のデータモデル、設定言語、アプリケーションプログラミングインターフェース (API) について述べる。"
  s2-1:
    text: "リレーションタプル"
  s2-1-p1:
    text: "Zanzibar において、ACL はオブジェクトとユーザー、またはオブジェクトとオブジェクトの間の関係の集まりであり、*リレーションタプル* として表現される。グループは、単にメンバーシップのセマンティクスを持つ ACL である。リレーションタプルには効率的なバイナリエンコーディングがあるが、本論文では次のような便宜的なテキスト表記を用いて表す："
  s2-1-p2:
    text: "ここで ⟨*namespace*⟩ と ⟨*relation*⟩ はクライアントの設定で事前に定義され ([§2.3](#s2-3))、⟨*object_id*⟩ は文字列、⟨*user_id*⟩ は整数である。リレーションタプルを識別するのに必要な主キーは ⟨*namespace*⟩、⟨*object_id*⟩、⟨*relation*⟩、⟨*user*⟩ である。注目に値する機能の一つは、⟨*userset*⟩ によって ACL がグループを参照でき、それにより入れ子のグループメンバーシップを表現できることである。"
  s2-1-p3:
    text: "[表 1](#tab-1) に、いくつかのタプルの例と対応するセマンティクスを示す。一部の関係 (たとえば `viewer`) はアクセス制御を直接定義するが、他の関係 (たとえばフォルダを指す `parent`) はオブジェクト間の抽象的な関係を定義するだけである。これらの抽象的な関係は、名前空間設定で指定されたユーザーセット書き換えルール ([§2.3.1](#s2-3-1)) によって、間接的にアクセス制御に影響することがある。"
  tab-1:
    header:
      - "テキスト表記によるタプルの例"
      - "セマンティクス"
    rows:
      - - "`doc:readme#owner@10`"
        - "ユーザー 10 は `doc:readme` の所有者である"
      - - "`group:eng#member@11`"
        - "ユーザー 11 は `group:eng` のメンバーである"
      - - "`doc:readme#viewer@group:eng#member`"
        - "`group:eng` のメンバーは `doc:readme` の閲覧者である"
      - - "`doc:readme#parent@folder:A#...`"
        - "`doc:readme` は `folder:A` の中にある"
    caption: "表 1: リレーションタプルの例。「#...」はタプルのセマンティクスに影響しない関係を表す。"
  s2-1-p4:
    text: "データモデルをオブジェクトごとの ACL ではなくタプルを中心に定義することで、ACL とグループの概念を統一でき、また [§2.4](#s2-4) で見るように、効率的な読み取りと差分更新をサポートできる。"
  s2-2:
    text: "一貫性モデル"
  s2-2-p1:
    text: "予期しない共有の挙動を避けるため、ACL チェックはユーザーが ACL やオブジェクトの内容を変更した順序を尊重しなければならない。具体的には、クライアントは「new enemy」問題の防止を重視している。この問題は、ACL 更新間の順序を尊重しそこねた場合や、古い ACL を新しい内容へ適用した場合に生じうる。次の 2 つの例を考える："
  s2-2-exa:
    title: "例 A：ACL 更新の順序の無視"
    items:
      - "Alice がフォルダの ACL から Bob を削除する。"
      - "次に Alice が Charlie に、新しいドキュメントをそのフォルダに移動するよう依頼する。ドキュメントの ACL はフォルダの ACL を継承する。"
      - "Bob は新しいドキュメントを見られないはずだが、ACL チェックが 2 つの ACL 変更間の順序を無視すると、見えてしまう可能性がある。"
  s2-2-exb:
    title: "例 B：古い ACL の新しい内容への誤適用"
    items:
      - "Alice がドキュメントの ACL から Bob を削除する。"
      - "次に Alice が Charlie に、そのドキュメントに新しい内容を追加するよう依頼する。"
      - "Bob は新しい内容を見られないはずだが、Bob が削除される前の古い ACL で ACL チェックが評価されると、見えてしまう可能性がある。"
  s2-2-p2:
    text: "「new enemy」問題を防ぐには、Zanzibar が ACL や内容の更新間の因果的順序を理解し尊重する必要がある。これには、異なる ACL やオブジェクトに対する更新や、Zanzibar からは見えない経路を介して調整された更新も含まれる。そのため Zanzibar は、2 つの重要な一貫性特性、すなわち *外部一貫性* [[18](#ref-18)] と *有界な古さを伴うスナップショット読み取り* を提供しなければならない。"
  s2-2-p3:
    text: "外部一貫性により、Zanzibar は各 ACL 更新や内容更新にタイムスタンプを割り当てることができ、因果的に関連する 2 つの更新 $x \\prec y$ には、因果的順序を反映したタイムスタンプ $T_x < T_y$ が割り当てられる。因果的に意味のあるタイムスタンプがあれば、タイムスタンプ $T$ における ACL データベースのスナップショット読み取りは、タイムスタンプが $\\le T$ であるすべての更新を観測するので、ACL 更新間の順序を尊重することになる。つまり、読み取りが更新 $x$ を観測するなら、因果的に $x$ より前に起きたすべての更新も観測する。"
  s2-2-p4:
    text: "さらに、古い ACL を新しい内容に適用することを避けるため、ACL チェックの評価スナップショットは、内容更新に割り当てられた因果的タイムスタンプよりも古くてはならない。タイムスタンプ $T_c$ における内容更新があるとき、タイムスタンプ $\\ge T_c$ でのスナップショット読み取りにより、内容更新より因果的に前に起きたすべての ACL 更新が ACL チェックで観測されることが保証される。"
  s2-2-p5:
    text: "外部一貫性と有界な古さを伴うスナップショット読み取りを提供するため、我々は ACL を Spanner グローバルデータベースシステム [[15](#ref-15)] に格納する。Spanner の TrueTime 機構は各 ACL 書き込みにマイクロ秒分解能のタイムスタンプを割り当て、書き込みのタイムスタンプが書き込み間の因果的順序を反映するようにし、それによって外部一貫性を提供する。各 ACL チェックは、複数のデータベース読み取りにまたがって単一のスナップショットタイムスタンプで評価する。これにより、チェックのスナップショットまでのタイムスタンプを持つすべての書き込み、かつそれらの書き込みのみが ACL チェックから見えるようになる。"
  s2-2-p6:
    text: "新しい内容に対するチェックを古い ACL で評価することを避けるため、常に最新のスナップショットで評価し、チェック呼び出し時点までのすべての ACL 書き込みをチェック結果に反映させる、という方法も考えられる。しかし、そのような評価には、高レイテンシのラウンドトリップを伴うグローバルなデータ同期が必要となり、可用性も制限される。そこで我々は、Zanzibar クライアントの協力のもとで、ほとんどのチェックを既に複製済みのデータで評価できるよう、次のプロトコルを設計した："
  s2-2-protocol:
    items:
      - "Zanzibar クライアントは、内容の変更が保存されようとするときに、*コンテンツ変更* ACL チェック ([§2.4.4](#s2-4-4)) を通じて、各コンテンツバージョンに対して *zookie* と呼ばれる不透明な一貫性トークンを要求する。Zanzibar は現在のグローバルタイムスタンプを zookie にエンコードし、それ以前のすべての ACL 書き込みがより小さいタイムスタンプを持つことを保証する。クライアントは、クライアントストレージへのアトミックな書き込みで、内容の変更とともに zookie を格納する。なお、コンテンツ変更チェックは、アプリケーションの内容変更と同一のトランザクション内で評価する必要はなく、ユーザーが内容を変更したときにトリガーされさえすればよい。"
      - "クライアントはその後の ACL チェックリクエストでこの zookie を送信し、チェックのスナップショットが少なくともそのコンテンツバージョンのタイムスタンプと同じだけ新しいことを保証する。"
  s2-2-p7:
    text: "外部一貫性と、zookie によって古さが制限されたスナップショット読み取りによって、「new enemy」問題は防がれる。例 A では、ACL 更新 A1 と A2 にそれぞれタイムスタンプ $T_{A1} < T_{A2}$ が割り当てられる。Bob は Charlie が追加した新しいドキュメントを見ることはできない。チェックが $T < T_{A2}$ で評価される場合、ドキュメントの ACL にはフォルダの ACL が含まれない。チェックが $T \\ge T_{A2} > T_{A1}$ で評価される場合、チェックは Bob をフォルダの ACL から削除した更新 A1 を観測する。例 B では、Bob はドキュメントに追加された新しい内容を見ることはない。Bob が新しい内容を見るには、内容更新に割り当てられたタイムスタンプ以上の zookie、すなわち $\\ge T_{B2}$ の zookie でチェックを評価しなければならない。$T_{B2} > T_{B1}$ であるため、そのようなチェックは Bob を ACL から削除した ACL 更新 B1 も観測することになる。"
  s2-2-p8:
    text: "zookie プロトコルは Zanzibar の一貫性モデルの重要な機能である。これにより、Zanzibar が ACL 更新と内容更新の間の因果的順序を尊重することが保証される一方、それ以外の点では、レイテンシと可用性の目標を満たすように評価タイムスタンプを選ぶ自由が Zanzibar に与えられる。この自由は、プロトコルの「少なくとも同じだけ新しい」というセマンティクスから生じ、これにより Zanzibar は zookie にエンコードされたものより新しい任意のタイムスタンプを選択できる。この自由によってさらに、Zanzibar はほとんどのチェックを既に複製済みのデータを用いてデフォルトの古さで処理し ([§3.2.1](#s3-2-1))、ホットスポットを避けるために評価タイムスタンプを量子化する ([§3.2.5](#s3-2-5)) ことができる。"
  s2-3:
    text: "名前空間の設定"
  s2-3-p1:
    text: "クライアントは Zanzibar にリレーションタプルを格納する前に、名前空間を設定しなければならない。名前空間設定は、その関係とストレージパラメータを指定する。各関係は、名前とリレーション設定を持つ。名前は `viewer` や `editor` のようなクライアント定義の文字列である。ストレージパラメータには、シャーディングの設定と、オブジェクト ID のエンコーディングが含まれる。後者は、Zanzibar が整数、文字列、その他のオブジェクト ID 形式のストレージを最適化するのに役立つ。"
  s2-3-1:
    text: "リレーション設定とユーザーセット書き換え"
  s2-3-1-p1:
    text: "リレーションタプルはオブジェクトとユーザーの関係を反映するが、実効的な ACL を完全に定義するわけではない。たとえば、一部のクライアントは、各オブジェクトに対して `editor` 権限を持つユーザーは同じオブジェクトに対して `viewer` 権限も持つべきだと指定する。このような関係同士の関係はオブジェクトごとのリレーションタプルで表現することもできるが、名前空間内のオブジェクトごとにタプルを格納するのは無駄であり、全オブジェクトにまたがる変更も困難になる。そこで、クライアントがリレーション設定内の *ユーザーセット書き換えルール* によって、オブジェクトに依存しない関係を定義できるようにしている。[図 1](#fig-1) は同心円状の関係を持つ単純な名前空間設定を示しており、`viewer` は `editor` を含み、`editor` は `owner` を含む。"
  fig-1:
    caption: "図 1: ドキュメントに対する同心円状の関係を持つ単純な名前空間設定。すべての所有者は編集者であり、すべての編集者は閲覧者である。さらに、親フォルダの閲覧者はそのドキュメントの閲覧者でもある。"
  s2-3-1-p2:
    text: "ユーザーセット書き換えルールは、名前空間内の関係ごとに定義される。各ルールは、オブジェクト ID を入力として受け取り、ユーザーセット式の木を出力する関数を指定する。木の各葉ノードは、以下のいずれかである："
  s2-3-1-leaves:
    items:
      - "`_this`：格納されたリレーションタプルから、⟨*object#relation*⟩ ペアに対するすべてのユーザーを返す。これには、タプル中のユーザーセットが参照する間接 ACL も含まれる。これは、書き換えルールが指定されていない場合のデフォルトの挙動である。"
      - "`computed_userset`：入力オブジェクトについて、新しいユーザーセットを計算する。たとえばこれにより、`viewer` 関係のユーザーセット式が同じオブジェクトの `editor` ユーザーセットを参照でき、関係間での ACL 継承機能が提供される。"
      - "`tuple_to_userset`：入力オブジェクトからタプルセット ([§2.4.1](#s2-4-1)) を計算し、そのタプルセットにマッチするリレーションタプルを取得して、取得した各リレーションタプルからユーザーセットを計算する。この柔軟なプリミティブにより、クライアントは「ドキュメントの親フォルダを調べて、その閲覧者を継承する」といった複雑なポリシーを表現できる。"
  s2-3-1-p3:
    text: "ユーザーセット式は、和集合、積集合、除外といった演算で組み合わされた複数の部分式から構成することもできる。"
  s2-4:
    text: "API"
  s2-4-p1:
    text: "Zanzibar は ACL チェックのサポートに加えて、クライアントがリレーションタプルを読み書きし、タプルの更新を監視し、実効的な ACL を調べるための API も提供している。"
  s2-4-p2:
    text: "これらの API メソッド全体を通じて用いられる概念が *zookie* である。zookie は、ACL の書き込み、クライアントのコンテンツバージョン、または読み取りスナップショットを反映する、グローバルに意味を持つタイムスタンプをエンコードした不透明なバイト列である。ACL の読み取りリクエストやチェックリクエストに含まれる zookie は、スナップショット読み取りの古さの上限を指定し、それによって Zanzibar の中核的な一貫性特性の一つを提供する。実際のタイムスタンプではなく不透明な cookie を用いることにしたのは、クライアントが任意のタイムスタンプを選ぶのを抑止し、将来の拡張を可能にするためである。"
  s2-4-1:
    text: "Read"
  s2-4-1-p1:
    text: "クライアントは、ユーザーに ACL やグループメンバーシップを表示するため、あるいは後続の書き込みの準備のためにリレーションタプルを読み取る。読み取りリクエストは、1 つまたは複数の *タプルセット* と、省略可能な zookie を指定する。"
  s2-4-1-p2:
    text: "各 *タプルセット* は、リレーションタプルの集合のキーを指定する。この集合には、単一のタプルキー、あるいは名前空間内の特定のオブジェクト ID またはユーザーセットを持つすべてのタプルを含めることができ、オプションで関係名によって絞り込むこともできる。タプルセットを用いて、クライアントは特定のメンバーシップエントリを調べたり、ACL やグループのすべてのエントリを読み取ったり、特定のユーザーを直接のメンバーとするすべてのグループを調べたりできる。読み取りリクエスト内のすべてのタプルセットは、単一のスナップショットで処理される。"
  s2-4-1-p3:
    text: "zookie を用いることで、クライアントは、書き込みレスポンスの zookie を読み取りリクエストに与えれば以前の書き込みより前でない読み取りスナップショットを、以前の読み取りレスポンスの zookie を後続のリクエストに与えればその読み取りと同じスナップショットを要求できる。リクエストに zookie が含まれていない場合、Zanzibar は適度に新しいスナップショットを選択し、zookie が与えられた場合よりも低レイテンシな応答を返せる可能性がある。"
  s2-4-1-p4:
    text: "読み取り結果はリレーションタプルの内容のみに依存し、ユーザーセット書き換えルールは反映されない。たとえば、`viewer` ユーザーセットが常に `owner` ユーザーセットを含むとしても、`viewer` 関係のタプルを読み取って `owner` 関係のタプルが返されることはない。実効的なユーザーセットを把握する必要があるクライアントは、Expand API ([§2.4.5](#s2-4-5)) を使用できる。"
  s2-4-2:
    text: "Write"
  s2-4-2-p1:
    text: "クライアントは、ACL を追加または削除するために単一のリレーションタプルを変更できる。また、読み取り RPC の後に書き込み RPC を用いる、楽観的並行性制御 [[21](#ref-21)] による read-modify-write 処理によって、あるオブジェクトに関連するすべてのタプルを変更することもできる："
  s2-4-2-steps:
    items:
      - "オブジェクトのすべてのリレーションタプルを読み取る。これにはオブジェクトごとの「ロック」タプルも含まれる。"
      - "書き込みまたは削除するタプルを生成する。ロックタプルへの touch とともに書き込みを Zanzibar に送信する。その際、読み取り以降にロックタプルが変更されていない場合にのみ書き込みがコミットされる、という条件を付ける。"
      - "書き込み条件が満たされなかった場合は、ステップ 1 に戻る。"
  s2-4-2-p2:
    text: "ロックタプルは、クライアントが書き込みの競合を検出するために用いる、ごく普通のリレーションタプルにすぎない。"
  s2-4-3:
    text: "Watch"
  s2-4-3-p1:
    text: "一部のクライアントは、Zanzibar 内のリレーションタプルの二次インデックスを維持している。これは Watch API を用いて実現できる。Watch リクエストは、1 つ以上の名前空間と、監視を開始する時刻を表す zookie を指定する。Watch レスポンスは、要求された開始タイムスタンプから、Watch レスポンス内の *ハートビート zookie* にエンコードされたタイムスタンプまでの、すべてのタプル変更イベントをタイムスタンプの昇順で含む。クライアントはハートビート zookie を用いて、前回の Watch レスポンスが終わったところから監視を再開できる。"
  s2-4-4:
    text: "Check"
  s2-4-4-p1:
    text: "チェックリクエストは、⟨*object#relation*⟩ で表されるユーザーセット、多くの場合は認証トークンで表されるチェック対象のユーザー、および目的のオブジェクトバージョンに対応する zookie を指定する。読み取りと同様に、チェックは常に、与えられた zookie より前でない一貫性のあるスナップショットで評価される。"
  s2-4-4-p2:
    text: "アプリケーションの内容変更を認可するために、クライアントは特別な種類のチェックリクエストである *コンテンツ変更* チェックを送信する。コンテンツ変更チェックのリクエストは zookie を持たず、最新のスナップショットで評価される。内容変更が認可された場合、チェックレスポンスには zookie が含まれ、クライアントはそれをオブジェクトの内容とともに格納し、そのコンテンツバージョンに対する後続のチェックで使用する。zookie は評価スナップショットをエンコードしており、ACL の変更から内容の変更へのあらゆる因果関係を捕捉する。zookie のタイムスタンプは、新しい内容を保護する ACL 更新のタイムスタンプよりも大きくなるからである ([§2.2](#s2-2))。"
  s2-4-5:
    text: "Expand"
  s2-4-5-p1:
    text: "Expand API は、⟨*object#relation*⟩ ペアと省略可能な zookie を与えると、実効的なユーザーセットを返す。Read API とは異なり、Expand はユーザーセット書き換えルールによって表現された間接参照をたどる。結果は *ユーザーセット木* で表される。その葉ノードはユーザー ID か、他の ⟨*object#relation*⟩ ペアを指すユーザーセットであり、中間ノードは和集合、積集合、除外の演算子を表す。Expand は、クライアントが自身のオブジェクトにアクセスできるユーザーとグループの完全な集合を把握するうえで不可欠であり、これによりアクセス制御されたコンテンツのための効率的な検索インデックスを構築できる。"
  s3:
    text: "アーキテクチャと実装"
  s3-p1:
    text: "[図 2](#fig-2) に Zanzibar システムのアーキテクチャを示す。`aclservers` は主要なサーバー種別である。これらはクラスタとして編成され、Check、Read、Expand、Write の各リクエストに応答する。リクエストはクラスタ内の任意のサーバーに到着し、そのサーバーは必要に応じてクラスタ内の他のサーバーに作業をファンアウトする。それらのサーバーはさらに、中間結果を計算するために他のサーバーに問い合わせることがある。最初のサーバーが最終結果を集約し、クライアントに返す。"
  s3-p2:
    text: "Zanzibar は ACL とそのメタデータを Spanner データベースに格納する。クライアントの名前空間ごとにリレーションタプルを格納するデータベースが 1 つ、すべての名前空間設定を保持するデータベースが 1 つ、そしてすべての名前空間で共有される変更ログ (changelog) データベースが 1 つある。`aclservers` は、クライアントリクエストに応答する過程でこれらのデータベースを読み書きする。"
  s3-p3:
    text: "`watchservers` は、Watch リクエストに応答する特化したサーバー種別である。変更ログを末尾から追跡し、名前空間の変更のストリームをほぼリアルタイムでクライアントに提供する。"
  s3-p4:
    text: "Zanzibar は定期的にデータ処理パイプラインを実行し、Spanner 内のすべての Zanzibar データに対してさまざまなオフライン処理を行う。その一つは、既知のスナップショットタイムスタンプにおける各名前空間のリレーションタプルのダンプを生成することである。もう一つは、名前空間ごとに設定されたしきい値より古いタプルのバージョンをガベージコレクションすることである。"
  fig-2:
    alt: "アーキテクチャ図。クライアントは Check、Read、Expand、Write を、相互接続された aclservers から成る Zanzibar のサービングクラスタに送る。aclservers は、Spanner グローバルデータベースシステム内の名前空間設定と名前空間ごとのリレーションタプルを読み書きし、変更ログに追記する。watchserver は変更ログを追跡し、クライアントと Leopard インデックスシステムに Watch を提供する。定期的なオフラインパイプラインは Spanner を読み書きして名前空間のスナップショットをダンプし、Leopard がそれを読み取る。Leopard は aclservers に最適化された集合計算を提供する。"
    caption: "図 2: Zanzibar のアーキテクチャ。矢印はデータの流れの方向を示す。"
  s3-p5:
    text: "Leopard は、大規模で深く入れ子になった集合に対する操作を最適化するために用いられるインデックスシステムである。ACL データの定期的なスナップショットを読み取り、スナップショット間の変更を監視する。そのデータに対して非正規化などの変換を行い、`aclservers` からのリクエストに応答する。"
  s3-p6:
    text: "本節の残りでは、これらのアーキテクチャ要素の実装をより詳細に説明する。"
  s3-1:
    text: "ストレージ"
  s3-1-1:
    text: "リレーションタプルのストレージ"
  s3-1-1-p1:
    text: "各名前空間のリレーションタプルは個別のデータベースに格納し、各行は主キー *(シャード ID, オブジェクト ID, 関係, ユーザー, コミットタイムスタンプ)* で識別される。複数のタプルバージョンは別々の行に格納されるため、ガベージコレクションのウィンドウ内であれば任意のタイムスタンプでチェックや読み取りを評価できる。主キーの順序により、特定のオブジェクト ID または *(オブジェクト ID, 関係)* ペアに対するすべてのリレーションタプルを検索できる。"
  s3-1-1-p2:
    text: "クライアントは、名前空間のデータパターンに応じてそのシャーディングを設定する。通常、シャード ID はオブジェクト ID のみによって決定される。場合によっては、たとえば非常に多数のメンバーを持つグループを格納する名前空間では、シャード ID はオブジェクト ID とユーザーの両方から計算される。"
  s3-1-2:
    text: "変更ログ"
  s3-1-2-p1:
    text: "Zanzibar はまた、Watch API のためにタプル更新の履歴を格納する変更ログデータベースも維持している。主キーは *(変更ログシャード ID, タイムスタンプ, 一意な更新 ID)* であり、変更ログシャードは各書き込みでランダムに選択される。"
  s3-1-2-p2:
    text: "Zanzibar のすべての書き込みは、単一のトランザクションでタプルストレージと変更ログシャードの両方にコミットされる。保留中のトランザクションによって変更ログの読み取りがブロックされるのを最小限に抑えるため、変更ログシャードをホストする Spanner サーバーをトランザクションコーディネーターに指定している。"
  s3-1-3:
    text: "名前空間設定のストレージ"
  s3-1-3-p1:
    text: "名前空間設定は、2 つのテーブルを持つデータベースに格納される。一方のテーブルは設定を保持し、名前空間 ID をキーとする。もう一方は設定更新の変更ログであり、コミットタイムスタンプをキーとする。この構造により、Zanzibar サーバーは起動時にすべての設定を読み込み、変更ログを監視して設定を継続的に更新できる。"
  s3-1-4:
    text: "レプリケーション"
  s3-1-4-p1:
    text: "レイテンシを削減するため、Zanzibar のデータはクライアントの近くに置かれるよう複製される。レプリカは世界中の数十か所に存在し、リージョンごとに複数のレプリカがある。5 つの投票レプリカは米国東部および中部にある。これらは障害を分離するため 3 つの異なる都市圏に置かれているが、Paxos トランザクションが迅速にコミットされるよう、互いの距離は 25 ミリ秒以内である。"
  s3-2:
    text: "サービング"
  s3-2-1:
    text: "評価タイムスタンプ"
  s3-2-1-p1:
    text: "[§2.4](#s2-4) で述べたように、クライアントは zookie を提供することで、リクエスト評価の最小スナップショットタイムスタンプを保証できる。zookie が提供されない場合、サーバーはデフォルトの古さを用いる。これは、レイテンシに影響を与えない限りできるだけ新しいタイムスタンプですべてのトランザクションが評価されるよう選ばれる。"
  s3-2-1-p2:
    text: "Spanner に対して行う各読み取りリクエストで、Zanzibar は、そのタイムスタンプのデータがゾーン外読み取りを必要とし、したがって追加のレイテンシが発生したかどうかについてのヒントを受け取る。各サーバーは、デフォルトの古さのデータ、およびそれより新しいデータと古いデータについて、こうしたゾーン外読み取りの頻度を追跡し、これらの頻度を用いて、各古さにおいて任意のデータがローカルで利用可能である確率の二項比率信頼区間を計算する。"
  s3-2-1-p3:
    text: "十分なデータが集まると、サーバーは各古さの値について、ゾーン外読み取りの発生確率が十分に低く、したがって低レイテンシになるかどうかを確認する。そうであれば、デフォルトの古さの上限を最も低い「安全な」値に更新する。既知の古さの値がいずれも安全でない場合は、2 標本比率の z 検定を用いて、デフォルトを増やすことで安全性が統計的に有意な程度まで高まるかどうかを調べる。その場合、レイテンシの改善を期待してデフォルト値を増やす。このデフォルトの古さの機構は純粋に性能最適化である。Zanzibar は zookie が提供された場合、常にそれを尊重するので、一貫性のセマンティクスに違反することはない。"
  s3-2-2:
    text: "設定の一貫性"
  s3-2-2-p1:
    text: "名前空間設定の変更は ACL 評価の結果、ひいてはその正しさを変えうるため、Zanzibar は各クライアントリクエストを評価する際に、設定メタデータに対して単一のスナップショットタイムスタンプを選択する。クラスタ内のすべての `aclservers` は、同じリクエストに対しては、元のクライアントリクエストからファンアウトするあらゆるサブリクエストも含めて、同じタイムスタンプを使用する。"
  s3-2-2-p2:
    text: "各サーバーは、名前空間設定が変更されるたびに、それをストレージから独立して継続的に読み込む ([§3.1.3](#s3-1-3))。そのため、再起動やネットワークレイテンシによって、クラスタ内の各サーバーが利用できる設定タイムスタンプの範囲は異なりうる。Zanzibar は、それらすべてで利用可能なタイムスタンプを選ばなければならない。これを容易にするため、監視ジョブがすべてのサーバーで利用可能なタイムスタンプ範囲を追跡・集約し、グローバルに利用可能な範囲を他のすべてのサーバーに報告する。各受信リクエストに対し、サーバーはこの範囲から時刻を選ぶ。これにより、設定ストレージから読み取れなくなった場合でも、すべてのサーバーがサービスを継続できる。"
  s3-2-3:
    text: "チェックの評価"
  s3-2-3-p1:
    text: "Zanzibar は、チェックリクエストをブール式に変換することで ACL チェックを評価する。ユーザーセット書き換えルールがない単純な場合、ユーザーセット ⟨*object#relation*⟩ に対するユーザー $U$ のチェックは次のように表せる："
  s3-2-3-p2:
    text: "有効な $U' = \\langle \\mathit{object}'\\#\\mathit{relation}' \\rangle$ を見つけるには、すべての間接 ACL やグループのメンバーシップを再帰的に評価する必要がある。この種の「ポインタ追跡」はほとんどの種類の ACL やグループではうまく機能するが、間接 ACL やグループが深い、あるいは幅広い場合にはコストが高くなりうる。[§3.2.4](#s3-2-4) で、この問題への対処方法を説明する。ユーザーセット書き換えルールも、チェック評価の一環としてブール式に変換される。"
  s3-2-3-p3:
    text: "チェックのレイテンシを最小化するため、ブール式の木のすべての葉ノードを並行に評価する。あるノードの結果が部分木の結果を決定した時点で、その部分木内の他のノードの評価はキャンセルされる。"
  s3-2-3-p4:
    text: "葉ノードの評価には通常、データベースからのリレーションタプルの読み取りが伴う。Spanner への読み取り RPC の数を最小化するため、同一の ACL チェックに対する読み取りをまとめるプーリング機構を適用している。"
  s3-2-4:
    text: "Leopard インデックスシステム"
  s3-2-4-p1:
    text: "チェック評価中の再帰的なポインタ追跡では、深く入れ子になったグループや、多数の子グループを持つグループに対して低レイテンシを維持するのが難しい。そのような構造を示す選ばれた名前空間については、Zanzibar は効率的な集合計算をサポートする特化したインデックスである Leopard を用いてチェックを処理する。"
  s3-2-4-p2:
    text: "Leopard インデックスは、名前付き集合の集まりを $(T, s, e)$ タプルを用いて表現する。ここで $T$ は集合の種類を表す列挙型であり、$s$ と $e$ はそれぞれ集合 ID と要素 ID を表す 64 ビット整数である。クエリは名前付き集合の和集合、積集合、除外から成る式を評価し、結果の集合を要素 ID 順に、指定された件数まで返す。"
  s3-2-4-p3:
    text: "グループメンバーシップをインデックス化して評価するため、Zanzibar はグループメンバーシップを $\\textsf{GROUP2GROUP}$ と $\\textsf{MEMBER2GROUP}$ の 2 つの集合種別で表現する。ここではそれらを、集合 ID から要素 ID への写像を行う関数として示す："
  s3-2-4-sets:
    items:
      - "$\\textsf{GROUP2GROUP}(s) \\to \\{e\\}$：ここで $s$ は祖先グループを表し、$e$ はその祖先グループの *直接または間接の* サブグループである子孫グループを表す。"
      - "$\\textsf{MEMBER2GROUP}(s) \\to \\{e\\}$：ここで $s$ は個々のユーザーを表し、$e$ はそのユーザーが *直接の* メンバーである親グループを表す。"
  s3-2-4-p4:
    text: "ユーザー $U$ がグループ $G$ のメンバーであるかどうかを評価するには、次が成り立つかどうかをチェックする："
  s3-2-4-p5:
    text: "グループメンバーシップは、ノードがグループとユーザーを、エッジが直接のメンバーシップを表すグラフにおける到達可能性問題とみなせる。グループからグループへのパスを平坦化することで、Leopard は到達可能性を効率的に評価できる。ただし、データパターンの必要に応じて他の種類の非正規化を適用することもできる。"
  s3-2-4-p6:
    text: "Leopard システムは 3 つの独立した部分から成る。集合をまたいで一貫性のある低レイテンシな操作を行えるサービングシステム、オフラインで定期的にインデックスを構築するシステム、そしてタプルの変更が発生するにつれてサービングシステムを継続的に更新できるオンラインのリアルタイム層である。"
  s3-2-4-p7:
    text: "インデックスタプルは、スキップリストのような構造に整数の順序付きリストとして格納され、これにより集合間の和集合や積集合を効率的に計算できる。たとえば、2 つの集合 $A$ と $B$ の積集合の評価には、$O(\\min(|A|, |B|))$ 回のスキップリストのシークしか必要としない。インデックスは要素 ID によってシャーディングされ、複数のサーバーに分散できる。シャードは通常すべてメモリから提供されるが、メモリとリモートのソリッドステートデバイスにまたがって配置されたホットデータとコールドデータの組み合わせから提供することもできる。"
  s3-2-4-p8:
    text: "オフラインインデックスビルダーは、Zanzibar のリレーションタプルと設定のスナップショットからインデックスシャードを生成し、そのシャードをグローバルに複製する。ユーザーセット書き換えルールを尊重し、ACL グラフのエッジを再帰的に展開して Leopard のインデックスタプルを形成する。Leopard サーバーは新しいシャードを継続的に監視し、新しいシャードが利用可能になると古いシャードと入れ替える。"
  s3-2-4-p9:
    text: "ここまで述べた Leopard システムは、深くかつ広く入れ子になったグループメンバーシップを効率的に評価できるが、オフラインでのインデックス生成とシャードの入れ替えのため、新しく一貫性のあるスナップショットでそれを行うことはできない。一貫性のある ACL 評価をサポートするため、Leopard サーバーはオフラインスナップショット以降のすべての更新をインデックス化するインクリメンタル層を維持する。各更新は $(T, s, e, t, d)$ タプルで表され、$t$ は更新のタイムスタンプ、$d$ は削除マーカーである。クエリ処理中に、クエリのタイムスタンプ以下のタイムスタンプを持つ更新がオフラインインデックスの上にマージされる。"
  s3-2-4-p10:
    text: "インクリメンタル層を維持するため、Leopard のインクリメンタルインデクサは Zanzibar の Watch API を呼び出して、時間順に並んだ Zanzibar のタプル変更のストリームを受け取り、その更新を時間順に並んだ Leopard のタプルの追加、更新、削除のストリームに変換する。$\\textsf{GROUP2GROUP}$ タプルの更新を生成するには、インクリメンタルインデクサがグループ間のメンバーシップを維持し、1 つのリレーションタプル更新の影響を潜在的に複数のインデックス更新へと非正規化する必要がある。"
  s3-2-4-p11:
    text: "実際には、Zanzibar のタプルの追加または削除 1 件が、潜在的に数万件の個別の Leopard タプルイベントを生み出すことがある。各 Leopard サービングインスタンスは、こうした Zanzibar のタプル変更の完全なストリームを Watch API を通じて受け取る。Leopard サービングシステムは、このストリームを継続的に取り込み、クエリ処理への影響を最小限に抑えながら各種ポスティングリストを更新するよう設計されている。"
  s3-2-5:
    text: "ホットスポットへの対処"
  s3-2-5-p1:
    text: "ACL の読み取りとチェックのワークロードは、しばしばバースト的であり、ホットスポットが生じやすい。たとえば、検索クエリに答えるにはすべての候補結果に対して ACL チェックを行う必要があり、それらの ACL は共通のグループや間接 ACL を共有していることが多い。一貫性を確保しやすくするため、Zanzibar はストレージの非正規化を避け、正規化されたデータのみに依存している ([§3.2.4](#s3-2-4) で述べた場合を除く)。正規化されたデータでは、共通の ACL (人気のあるグループなど) 上のホットスポットが、基盤となるデータベースサーバーを過負荷にすることがある。我々は、ホットスポットへの対処が、低レイテンシと高可用性を追求するうえで最も重要な最前線であることを見出した。"
  s3-2-5-p2:
    text: "各クラスタの Zanzibar サーバーは、読み取りとチェック評価の両方のための分散キャッシュを形成する。これにはポインタ追跡中に評価された中間的なチェック結果も含まれる。キャッシュエントリは、コンシステントハッシュ [[20](#ref-20)] によって Zanzibar サーバー間に分散される。チェックや読み取りを処理するため、内部 RPC インターフェースを介して対応する Zanzibar サーバーにリクエストをファンアウトする。内部 RPC の数を最小化するため、ほとんどの名前空間ではオブジェクト ID から転送キーを計算する。⟨*object#relation*⟩ に対するチェックの処理は、同じオブジェクトの他の関係に対する間接 ACL チェックや、そのオブジェクトのリレーションタプルの読み取りを伴うことが多いからである。これらのチェックと読み取りは、親のチェックリクエストと同じ転送キーを共有するため、同じサーバーで処理できる。ホットな転送キーに対処するため、内部 RPC の呼び出し側と呼び出される側の両方で結果をキャッシュし、実質的にキャッシュツリーを形成している。また、Slicer [[12](#ref-12)] を用いて、ホットなキーを複数のサーバーに分散させている。"
  s3-2-5-p3:
    text: "スナップショットタイムスタンプをキャッシュキーにエンコードすることで、異なるスナップショットで評価された結果の再利用を避けている。リクエストの zookie による古さの制約を尊重しつつ、評価タイムスタンプを 1 秒や 10 秒といった粗い粒度に切り上げて選択する。このタイムスタンプの量子化により、キャッシュキーにマイクロ秒分解能のタイムスタンプを持ちながらも、最近のチェックと読み取りの大部分を同じタイムスタンプで評価し、キャッシュ結果を共有できる。注目すべきは、タイムスタンプの切り上げが Zanzibar の一貫性特性に影響しないことである。Spanner は、タイムスタンプ $T$ でのスナップショット読み取りが $T$ までのすべての書き込みを観測することを保証するからである。これは $T$ が未来であっても成り立ち、その場合、読み取りは TrueTime が $T$ を過ぎるまで待機する。"
  s3-2-5-p4:
    text: "キャッシュが結果で埋まる前に同時リクエストが瞬間的なホットスポットを生み出す「キャッシュスタンピード」問題 [[3](#ref-3)] に対処するため、各サーバーに *ロックテーブル* を保持し、処理中の読み取りとチェックを追跡する。同じキャッシュキーを共有するリクエストのうち、処理を開始するのは 1 つのリクエストだけであり、残りはキャッシュが埋まるまでブロックされる。"
  s3-2-5-p5:
    text: "分散キャッシュとロックテーブルによって、ホットスポットの大部分に効果的に対処できる。時間をかけて、我々は次の 2 つの改良を行った。"
  s3-2-5-p6:
    text: "第一に、あるオブジェクトと関係に対するユーザーの直接メンバーシップチェック (すなわち ⟨*object#relation@user*⟩) は、通常 1 回のリレーションタプル検索で処理される。しかし、ときに非常に人気のあるオブジェクトが、異なるユーザーに対する多数の同時チェックを招き、そのオブジェクトのリレーションタプルをホストするストレージサーバー上にホットスポットを生じさせる。こうしたホットスポットを避けるため、ホットなオブジェクトについて ⟨*object#relation*⟩ の *すべての* リレーションタプルを読み取ってキャッシュし、読み取り帯域幅と引き換えにキャッシュ可能性を得ている。この手法を適用するホットなオブジェクトは、各オブジェクトに対する処理中の読み取りの数を追跡することで動的に検出する。"
  s3-2-5-p7:
    text: "第二に、間接 ACL チェックは、親の ACL チェックの結果が既に決定している場合に頻繁にキャンセルされる。これにより、キャッシュキーが埋まらないまま残る。積極的なキャンセルはリソース使用量を大幅に削減するが、ロックテーブルのエントリでブロックされている同時リクエストのレイテンシに悪影響を与える。このレイテンシへの影響を防ぐため、対応するロックテーブルのエントリに待機者がいる場合には積極的なキャンセルを遅延させる。"
  s3-2-6:
    text: "性能分離"
  s3-2-6-p1:
    text: "低レイテンシと高可用性を目指す共有サービスにとって、性能分離は不可欠である。Zanzibar またはそのクライアントの一つが、予期しない利用パターンへの対処に十分なリソースをときにプロビジョニングできなかった場合でも、以下の分離機構によって、性能問題は問題のあるユースケースに隔離され、他のクライアントに悪影響を与えない。"
  s3-2-6-p2:
    text: "第一に、CPU 容量を適切に割り当てるため、Zanzibar は各 RPC のコストを、ハードウェアに依存しない指標である汎用的な *cpu-seconds* で測定する。各クライアントには、1 秒あたりの最大 CPU 使用量に関するグローバルな上限がある。クライアントがその上限を超え、*かつ* システム全体に余剰容量がない場合、その RPC はスロットリングされる。"
  s3-2-6-p3:
    text: "各 Zanzibar サーバーはまた、メモリ使用量を制御するために、処理中の RPC の総数を制限する。同様に、クライアントごとの処理中の RPC の数も制限する。"
  s3-2-6-p4:
    text: "Zanzibar はさらに、各 Spanner サーバー上で、*(オブジェクト, クライアント)* ごと、およびクライアントごとの同時読み取りの最大数を制限する。これにより、単一のオブジェクトやクライアントが Spanner サーバーを独占することがないようにしている。"
  s3-2-6-p5:
    text: "最後に、異なるクライアントからのリクエストには異なるロックテーブルキーを用いることで、Spanner があるクライアントに適用したスロットリングが他のクライアントに影響することを防いでいる。"
  s3-2-7:
    text: "テールレイテンシの緩和"
  s3-2-7-p1:
    text: "Zanzibar の分散処理では、遅いタスクに対応するための措置が必要となる。Spanner と Leopard インデックスへの呼び出しについては、リクエストのヘッジ [[16](#ref-16)] に依存している (すなわち、同じリクエストを複数のサーバーに送信し、最初に返ってきたレスポンスを使用して、他のリクエストをキャンセルする)。ラウンドトリップ時間を短縮するため、Zanzibar サーバーを置くすべての地理的リージョンに、これらのバックエンドサービスのレプリカを少なくとも 2 つ配置するよう努めている。不必要に負荷を増やさないよう、まず 1 つのリクエストを送信し、最初のリクエストが遅いと判明するまでヘッジリクエストの送信を遅らせる。"
  s3-2-7-p2:
    text: "適切なヘッジの遅延しきい値を決定するため、各サーバーは、最近の計測に基づいて *N* パーセンタイルのレイテンシを動的に計算する遅延推定器を維持している。この機構により、ヘッジによって生じる追加トラフィックを総トラフィックのごく一部に抑えることができる。"
  s3-2-7-p3:
    text: "効果的なヘッジを行うには、リクエストのコストが同程度でなければならない。Zanzibar の認可チェックの場合、一部のチェックはより多くの作業を必要とするため、本質的に他のチェックより時間がかかる。チェックリクエストをヘッジすると、最もコストの高いワークロードが重複し、皮肉にもレイテンシが悪化することになる。そのため、Zanzibar サーバー間ではリクエストをヘッジせず、前述の複数レプリカ間でのシャーディングと、遅いサーバーを検出して回避する監視機構に依存している。"
  s4:
    text: "運用経験"
  s4-p1:
    text: "Zanzibar は 5 年以上にわたって本番環境で利用されてきた。その間、Zanzibar を利用するクライアントの数と、それらが Zanzibar にかける負荷は着実に増加してきた。本節では、グローバルに分散した認可システムとして Zanzibar を運用してきた経験について述べる。"
  s4-p2:
    text: "Zanzibar は、数百のクライアントアプリケーションによって定義された 1,500 を超える名前空間を管理している。名前空間設定ファイルのサイズは、その名前空間が実装するアクセス制御ポリシーの複雑さの大まかな尺度となる。これらの設定ファイルは数十行から数千行に及び、中央値は 500 行前後である。"
  s4-p3:
    text: "これらの名前空間には、100 テラバイト近くを占める 2 兆を超えるリレーションタプルが含まれている。名前空間あたりのタプル数は、数十から 1 兆まで何桁にもわたり、中央値は 15,000 前後である。このデータは、ユーザーへの近さと高可用性の両方を維持するため、世界中の 30 を超える拠点に完全に複製されている。"
  s4-p4:
    text: "Zanzibar は毎秒 1,000 万を超えるクライアントクエリ (QPS) を処理している。2018 年 12 月の 7 日間のサンプル期間において、ピーク時のリクエストは Check が約 4.2M QPS、Read が 8.2M、Expand が 760K、Write が 25K であった。したがって、データを読み取るクエリはデータを書き込むクエリより 2 桁多い。"
  s4-p5:
    text: "Zanzibar はこの負荷を、世界中の数十のクラスタに編成された 10,000 台を超えるサーバーに分散している。クラスタあたりのサーバー数は 100 台未満から 1,000 台超まで幅があり、中央値は 500 台前後である。クラスタの規模は、それぞれの地理的リージョンの負荷に比例している。"
  s4-1:
    text: "リクエスト"
  s4-1-p1:
    text: "我々はリクエストを、必要とされるデータの鮮度に応じて 2 つのカテゴリに分ける。鮮度はリクエストのレイテンシと可用性に大きな影響を与えうる。具体的には、Check、Read、Expand の各リクエストは、評価タイムスタンプの下限を指定する zookie を持つ。zookie のタイムスタンプが、そのリージョンに複製された最新のデータのタイムスタンプより大きい場合、ストレージの読み取りには、より新しいデータを取得するためにリーダーレプリカへのリージョン間ラウンドトリップが必要となる。ストレージは 8 秒間隔のレプリケーションハートビートで構成されているため、リクエストを 2 つのカテゴリに分ける。*Safe* リクエストは 10 秒より古い zookie を持ち、ほとんどの場合リージョン内で処理できる。一方 *Recent* リクエストは経過時間が 10 秒未満の zookie を持ち、しばしばリージョン間のラウンドトリップを必要とする。それぞれについて別々に統計を報告する。"
  fig-3:
    alt: "日曜日から土曜日までの 1 週間を対象とした対数スケールの折れ線グラフ。Safe の QPS は 1 日周期で約 200 万から 400 万の間を変動し、Recent の QPS は約 2 万から 8 万の間を変動しており、およそ 2 桁低い。"
    caption: "図 3: 2018 年 12 月の 7 日間における Check Safe リクエストと Check Recent リクエストのレート。"
  s4-1-p2:
    text: "[図 3](#fig-3) に、7 日間にわたる Check Safe リクエストと Check Recent リクエストのレートを示す。どちらも日周期を示している。Safe リクエストのレートは Recent リクエストのレートより約 2 桁大きく、これにより Zanzibar は ACL チェックの大部分をローカルで処理できる。"
  s4-2:
    text: "レイテンシ"
  s4-2-p1:
    text: "Zanzibar のレイテンシ予算は一般に、クライアントが実用的な対話型サービスであるために提供しなければならない数百ミリ秒の総応答時間のうち、ごく一部である。たとえば、複数のドキュメントに対する検索結果を表示する前に、それらのドキュメントに対して認可チェックを行うクライアントを考えるとよい。"
  s4-2-p2:
    text: "我々はレイテンシをライブトラフィックを用いてサーバー側で計測している。その理由は、(1) レイテンシはキャッシュと重複排除の機構に大きく左右されるため、ライブトラフィックでしか現実的に反映されないこと、そして (2) クライアントからレイテンシを正確に計測するには、行儀のよいクライアントが必要となることである。クライアントジョブのプロビジョニングは Zanzibar の管理外であり、クライアントジョブが過負荷になっていることもある。"
  fig-4:
    alt: "1 週間にわたる Check Safe のレイテンシを示す対数スケールの折れ線グラフ。50 パーセンタイルは 3 ms 付近、95 パーセンタイルは 10 ms 付近、99 パーセンタイルは約 13〜20 ms、99.9 パーセンタイルは約 50〜90 ms の間にとどまる。"
    caption: "図 4: 2018 年 12 月の 7 日間における、各パーセンタイルでの Check Safe レスポンスのレイテンシ。"
  s4-2-p3:
    text: "[図 4](#fig-4) に、7 日間にわたる Check Safe レスポンスのレイテンシを示す。50、95、99、99.9 パーセンタイルにおけるピークは、それぞれ約 3、11、20、93 ミリ秒である。この性能は、ユーザーとのやり取りのクリティカルパス上にしばしば置かれる操作に対するレイテンシ目標を満たしている。"
  s4-2-p4:
    text: "[表 2](#tab-2) に、同じ 7 日間における Check、Read、Expand、Write のレスポンスのレイテンシ分布をまとめる。意図したとおり、より頻繁に使われる Check、Read、Expand の Safe 版は、あまり使われない Recent 版よりも大幅に高速である。Write はすべての API の中で最も使用頻度が低く、また Spanner サーバー間での分散協調を常に必要とするため最も遅い。"
