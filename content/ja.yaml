  s4-3:
    text: "可用性"
  s4-3-p1:
    text: "我々は可用性を、サービスがレイテンシしきい値内に正常に応答した「適格な」RPC の割合として定義する。しきい値は、Safe リクエストでは 5 秒、Recent リクエストでは 15 秒である。後者は、Spanner におけるリーダーの再選出に最大 10 秒かかることがあるためである。RPC が適格であるためには、リクエストが正しい形式であり、レイテンシしきい値より長いデッドラインを持っていなければならない。加えて、クライアントがそのリソースクォータの範囲内にとどまっていなければならない。"
  s4-3-p2:
    text: "こうした理由から、ライブトラフィックで可用性を直接計測することはできない。クライアントはときに短いデッドラインで RPC を送信したり、処理中の RPC をキャンセルしたりするからである。代わりに、ライブトラフィックから有効なリクエストのごく一部をサンプリングし、後で独自のプローバで再生する。リクエストを再生する際には、タイムアウトを可用性のしきい値より長く設定する。また、リクエストの zookie が指定されている場合は、zookie の相対的な経過時間がライブトラフィックでリクエストを受信したときと同じになるよう、それを調整する。最後に、クラスタごとに 3 つのプローバを実行し、まれなプローバの障害による誤警報を排除するために外れ値を除外する。"
  s4-3-p3:
    text: "可用性を算出するため、90 日間のウィンドウで成功率を集計し、クラスタ間で平均する。[図 5](#fig-5) に、これらのプローバで計測した Zanzibar の可用性を示す。可用性は、Google における過去 3 年間の運用を通じて 99.999% を上回り続けている。言い換えれば、どの四半期においても、Zanzibar のグローバルなダウンタイムは 2 分未満であり、グローバルなエラー率が 10% を超える時間は 13 分未満である。"
  fig-5:
    alt: "2015 年 12 月から 2018 年 12 月までの Safe リクエストと Recent リクエストの可用性を示す折れ線グラフ。どちらもほぼ全期間にわたって 99.9995% から 100% の間にとどまり、99.999% の破線を大きく上回っている。"
    caption: "図 5: 過去 3 年間にわたり、Zanzibar の可用性は 99.999% を上回り続けている。"
  s4-4:
    text: "内部動作"
  s4-4-p1:
    text: "Zanzibar サーバーはコンシステントハッシュに基づいてチェックと読み取りを互いに委譲し、委譲された操作の呼び出し側と呼び出される側の両方が、ホットスポットを防ぐために結果をキャッシュする ([§3.2.5](#s3-2-5))。ピーク時、Zanzibar は毎秒 2,200 万件の内部「委譲」RPC を処理しており、その内訳は読み取りとチェックでほぼ半々である。インメモリキャッシュはピーク時に毎秒約 2 億件のルックアップを処理しており、そのうち 1 億 5,000 万件がチェックから、5,000 万件が読み取りからのものである。チェックのキャッシュは、委譲先側で 10% のヒット率があり、さらにロックテーブルによって 12% が節約される。一方、委譲元側のキャッシュのヒット率は 2% で、ロックテーブルによってさらに 3% が加わる。これらのヒット率は低く見えるが、毎秒 50 万件の内部 RPC がホットスポットを生み出すのを防いでいる。"
  s4-4-p2:
    text: "委譲された読み取りでは、委譲先側でより高いヒット率 (キャッシュ 24%、ロックテーブル 9%) が見られる。しかし委譲元のキャッシュがヒットするのは 1% 未満である。超ホットなグループについては、Zanzibar はメンバーの全集合を事前に読み取ってキャッシュすることでさらに最適化している。これはグループの 0.1% で行われているが、ホットスポットをさらに防いでいる。"
  s4-4-p3:
    text: "このキャッシュと、読み取りリクエストの積極的なプーリングによって、Zanzibar が Spanner に発行する読み取り RPC は毎秒 2,000 万件にとどまっている。これらのリクエストの中央値は RPC あたり 1.5 行を読み取るが、99 パーセンタイルではそれぞれ 1,000 行近くを読み取る。"
  s4-4-p4:
    text: "Zanzibar の Spanner 読み取りは、中央値で 0.5 ミリ秒、95 パーセンタイルで 2 ミリ秒かかる。Spanner 読み取りの 1%、すなわち毎秒 20 万件の読み取りがヘッジの恩恵を受けていることがわかった。なお、Zanzibar が使用しているのは Google 内部で稼働する Spanner のインスタンスであり、Cloud Spanner [[6](#ref-6)] のインスタンスではない。"
  s4-4-p5:
    text: "7 日間にわたって集計したデータに基づくと、Leopard インデックスは中央値で 1.56M QPS、99 パーセンタイルで 2.22M QPS を処理している。同じ 7 日間において、Leopard サーバーの応答時間は中央値で 150 マイクロ秒未満、99 パーセンタイルで 1 ミリ秒未満である。その 7 日間、Leopard のインクリメンタル層は、中央値で毎秒約 500 件、99 パーセンタイルで毎秒約 1.5K 件のインデックス更新を書き込んでいる。"
  s4-5:
    text: "得られた教訓"
  s4-5-p1:
    text: "Zanzibar は、Google Calendar、Google Cloud、Google Drive、Google Maps、Google Photos、YouTube を含む、増え続けるクライアント群の多様で重い要求を満たすために進化してきた。本節では、この経験から得られた教訓を取り上げる。"
  s4-5-p2:
    text: "共通するテーマの一つは、クライアント間の違いに対応するための柔軟性の重要性である。たとえば："
  s4-5-flex:
    items:
      - "*アクセス制御のパターンは多種多様である*：時間をかけて、特定のクライアントをサポートするための機能を追加してきた。たとえば、オブジェクト ID のプレフィックスからオブジェクトの所有者 ID を推論できるよう `computed_userset` を追加した。これにより、多数の非公開オブジェクトを管理する Drive や Photos などのクライアントの所要容量が削減される。同様に、ホップあたり 1 つのリレーションタプルだけでオブジェクト階層を表現できるよう `tuple_to_userset` を追加した。その利点は、容量の削減と柔軟性の両方である。これにより、Cloud などのクライアントは、ACL 継承をコンパクトに表現できるとともに、大量のタプルを更新することなく ACL 継承ルールを変更できる。[§2.3.1](#s2-3-1) を参照。"
      - "*鮮度の要件は緩いことが多いが、常にそうとは限らない*：クライアントは ACL 評価において、明示されない適度な古さを許容することが多いが、より厳密に指定された鮮度を必要とすることもある。我々はこの特性を中心に zookie プロトコルを設計し、ほとんどのリクエストをデフォルトの既に複製済みのスナップショットから処理しつつ、必要に応じてクライアントが古さの上限を指定できるようにした。また、スナップショットタイムスタンプの粒度を、クライアントの鮮度要件に合わせて調整した。その結果得られた粗いタイムスタンプの量子により、認可チェックの大部分を少数のスナップショット上で実行でき、データベース読み取りの頻度を大幅に削減できる。[§3.2.1](#s3-2-1) を参照。"
  s4-5-p3:
    text: "もう一つのテーマは、本番環境で観測されたクライアントの挙動をサポートするために性能最適化を追加する必要性である。たとえば："
  s4-5-perf:
    items:
      - "*リクエストのヘッジはテールレイテンシの削減の鍵である*：Drive のように、ユーザーに検索機能を提供するクライアントは、1 組の検索結果を提供するために数十から数百の認可チェックを発行することが多い。我々は、ときおり発生する遅い操作がユーザーとのやり取り全体を遅らせるのを防ぐため、Spanner と Leopard へのリクエストのヘッジを導入した。[§3.2.7](#s3-2-7) を参照。"
      - "*ホットスポットの緩和は高可用性にとって極めて重要である*：一部のワークロードは ACL データにホットスポットを生み出し、基盤となるデータベースサーバーを圧倒しうる。よくあるパターンは、多数の異なるオブジェクトの ACL から間接的に参照されるオブジェクトに対する ACL チェックのバーストである。具体的な事例としては、前述の検索のユースケースで、検索対象のドキュメントが大規模なソーシャルグループや職場グループの ACL を間接的に共有している場合や、Cloud のユースケースで、多数のオブジェクトが階層の上位にある同じオブジェクトの ACL を間接的に共有している場合がある。Zanzibar はほとんどのホットスポットを分散キャッシュやロックテーブルといった汎用的な機構で処理しているが、特定のユースケースを最適化する必要性も見出した。たとえば、ホットなオブジェクトのすべてのリレーションタプルをキャッシュにプリフェッチする機能を追加した。また、同じ ACL データに対する同時リクエストがある場合に、二次的な ACL チェックのキャンセルを遅延させるようにした。[§3.2.5](#s3-2-5) を参照。"
      - "*性能分離は行儀の悪いクライアントから守るために不可欠である*：ホットスポットの緩和策をもってしても、予期しない、ときには意図しないクライアントの挙動が、システムやその基盤インフラを過負荷にする可能性は残る。たとえば、クライアントが予想外に人気を集める新機能をリリースした場合や、Zanzibar を意図しない方法で使用した場合である。時間をかけて、クライアント間や同一クライアントのオブジェクト間で連鎖的な障害が起きないよう、分離のための安全策を追加してきた。こうした安全策には、きめ細かいコスト計上、クォータ、スロットリングが含まれる。[§3.2.6](#s3-2-6) を参照。"
  s5:
    text: "関連研究"
  s5-p1:
    text: "Zanzibar は、惑星規模の分散 ACL ストレージおよび評価システムである。その認可の概念の多くは、アクセス制御やソーシャルグラフの分野で以前から探究されており、そのスケーリングの課題は分散システムの分野で研究されてきた。"
  s5-p2:
    text: "アクセス制御は、マルチユーザーオペレーティングシステムの中核をなす部分である。Multics [[23](#ref-23)] は、セグメントとディレクトリに対する ACL をサポートしている。ACL エントリは、プリンシパル識別子と権限ビットの集合から成る。UNIX の初版 [[9](#ref-9)] では、ファイルフラグによって、所有者と非所有者がファイルを読み書きできるかどうかが示されていた。第 4 版までに、権限ビットは所有者、グループ、その他それぞれに対する読み取り/書き込み/実行ビットへと拡張された。POSIX ACL [[4](#ref-4)] は、それぞれ最大 32 個の権限ビットを持つ、任意のユーザーとグループのリストを追加している。VMS [[7](#ref-7), [8](#ref-8)] は、ディレクトリツリー内に作成されたファイルに対する ACL 継承をサポートしている。Zanzibar のデータモデルは、上記のシステムに見られる権限、ユーザー、グループ、継承をサポートしている。"
  s5-p3:
    text: "Taos [[24](#ref-24), [10](#ref-10)] は、アイデンティティが分散システムを通過する際にどのように変換されたかを組み込んだ複合プリンシパルをサポートしている。たとえば、ユーザー $U$ がワークステーション $W$ にログインしてファイルサーバー $S$ にアクセスした場合、$S$ からは、リクエストが単なる $U$ ではなく「$U$ の代理としての $W$」として認証されて見える。これにより、ユーザーの電子メールに対して、そのユーザーだけが、しかもメールサーバー経由でアクセスされる場合にのみアクセスできる ACL を記述できる。Abadi らは [[11](#ref-11)] において、複合アイデンティティをサポートするグループベースの ACL のモデルを論じている。彼らの「blessing」という概念は Zanzibar のタプルに類似している。しかし、Zanzibar はユーザーセットを用いて ACL とグループを統一的に表現するのに対し、[[11](#ref-11)] ではそれらは別々の概念である。"
  s5-p4:
    text: "ロールベースアクセス制御 (RBAC) は、[[17](#ref-17)] で最初に提案され、Zanzibar の関係に類似したロールの概念を導入した。ロールは互いに継承でき、権限を含意する。多くの Zanzibar クライアントは、Zanzibar の名前空間設定言語の上に RBAC ポリシーを実装している。"
  s5-p5:
    text: "2019 年に ACL ストアを論じるにあたって、Amazon [[1](#ref-1)]、Google [[5](#ref-5)]、Microsoft [[2](#ref-2)] などが商用で提供している Identity and Access Management (IAM) システムに触れないのは手落ちであろう。これらのシステムにより、各社のクラウド製品の顧客は、ユーザーをロールやグループに割り当てること、ドメイン固有のポリシー言語、ACL の作成と変更を可能にする API といった、さまざまな機能に基づいて柔軟なアクセス制御を設定できる。これらすべてのシステムに共通するのは、統一された ACL ストレージと RPC ベースの API であり、これは Zanzibar の設計の中核をなす思想でもある。Google の Cloud IAM システム [[5](#ref-5)] は、Zanzibar の ACL ストレージおよび評価システムの上の層として構築されている。"
  s5-p6:
    text: "TAO [[13](#ref-13)] は、Facebook のソーシャルグラフのための分散データストアである。いくつかの Zanzibar クライアントも、Zanzibar を用いて自身のソーシャルグラフを格納している。Zanzibar と TAO はいずれも、クライアントに認可チェックを提供する。両者とも単一インスタンスのサービスとしてデプロイされ、大規模に稼働し、読み取り専用の操作に最適化されている。TAO は、非同期レプリケーションによる結果的なグローバル一貫性と、同期的なキャッシュ更新によるベストエフォートの read-after-write 一貫性を提供する。これに対して Zanzibar は、外部一貫性と有界な古さを伴うスナップショット読み取りを提供し、それによって ACL 更新と内容更新の間の因果的順序を尊重し、「new enemy」問題を防ぐ。"
  s5-p7:
    text: "Lamport クロック [[22](#ref-22)] は、イベントの順序を決定するのに使用できる半順序のベクトルタイムスタンプを提供する。しかし、Lamport クロックはすべての「プロセス」の明示的な参加を必要とする一方、Zanzibar のユースケースでは「プロセス」の一部は外部のクライアントや、さらには人間のユーザーでありうる。これに対して Zanzibar は、外部一貫性と有界な古さを伴うスナップショット読み取りの両方を提供するために、基盤となるデータベースシステムである Spanner [[15](#ref-15)] に依存している。特に、Zanzibar は Spanner の TrueTime 抽象化 [[15](#ref-15)] の上に構築されており、zookie としてエンコードされる線形化可能なコミットタイムスタンプを提供する。"
  s5-p8:
    text: "同時に、Zanzibar は Spanner が提供する機能の上にいくつもの機能を追加している。一つには、zookie プロトコルはクライアントが任意のスナップショットで ACL を読み取ったり評価したりすることを *許さない*。この制約により、Zanzibar は高速な ACL 評価を容易にするスナップショットを選択できる。加えて、Zanzibar はデータベースのホットスポット (たとえば、突然人気を集めた動画への認可チェック) に対する耐性と、潜在的に深い再帰があっても安全なポインタ追跡 (たとえば、階層的なグループに対するメンバーシップチェック) を提供する。"
  s5-p9:
    text: "Chubby 分散ロックサービス [[14](#ref-14)] は、信頼性の高いストレージを提供し、書き込みを線形化し、アクセス制御を提供するが、Zanzibar のユースケースをサポートするのに必要な機能を欠いている。特に、大量のデータ、効率的な範囲読み取り、クライアントが指定したスナップショットでの有界な古さを伴う読み取りをサポートしていない。また、そのキャッシュ無効化機構によって書き込みスループットも制限される。"
  s5-p10:
    text: "最後に、ZooKeeper は高性能な協調サービス [[19](#ref-19)] を提供するが、やはり Zanzibar が必要とする機能を欠いている。Chubby と比べると、より緩いキャッシュ一貫性によって、より高い読み取りレートと書き込みレートを処理できる。しかし、線形化可能性がノード単位であるため、異なるノードにまたがる更新に対して外部一貫性を提供しない。また、有界な古さを伴うスナップショット読み取りも提供しない。"
  s6:
    text: "結論"
  s6-p1:
    text: "Zanzibar 認可システムは、Google のアクセス制御のデータとロジックを統一する。そのシンプルでありながら柔軟なデータモデルと設定言語は、コンシューマー向けとエンタープライズ向けの両方のアプリケーションによる多様なアクセス制御ポリシーをサポートする。"
  s6-p2:
    text: "Zanzibar の外部一貫性モデルは、その最も顕著な特徴の一つである。ユーザーの操作の順序を尊重しつつ、同時に、グローバルな同期なしに分散した拠点で認可チェックを評価することを可能にする。"
  s6-p3:
    text: "Zanzibar は、スケーラビリティ、低レイテンシ、高可用性を提供するために、他にも重要な技法を用いている。たとえば、深くあるいは広く入れ子になったグループメンバーシップを、スナップショット一貫性を備えた集合演算を効率的に計算するための特化したインデックスである Leopard を用いて評価する。また別の例として、分散キャッシュと、処理中のリクエストを重複排除する機構とを組み合わせている。これによってホットスポットを緩和している。ホットスポットは、正規化された一貫性のあるストレージの上でデータを提供する際の、本番環境における重大な問題である。これらの施策が合わさって、数兆のアクセス制御ルールと毎秒数百万の認可リクエストにまでスケールするシステムが実現されている。"
  s7:
    text: "謝辞"
  s7-p1:
    text: "多くの人々が Zanzibar に技術的な貢献をしてくれた。Dan Barella、Miles Chaston、Daria Jung、Alex Mendes da Costa、Xin Pan、Scott Smith、Matthew Steffen、Riva Tropp、Yuliya Zabiyaka をはじめとする、開発チームの過去および最近のメンバーに感謝する。また、Randall Bosetti、Hannes Eder、Robert Geisberger、Tom Li、Massimo Maggi、Igor Oks、Aaron Peterson、Andrea Yu をはじめとする、Site Reliability Engineering チームの過去および現在のメンバーにも感謝する。"
  s7-p2:
    text: "加えて、多くの人々が本論文の改善に協力してくれた。David Bacon、Carolin Gäthke、Brad Krueger、Ari Shamash、Kai Shen、Lawrence You から洞察に富むコメントをいただいた。また、支援をいただいた Nadav Eiron と Royal Hansen にも感謝する。最後に、建設的なフィードバックをくださった匿名の査読者と、シェパードの Eric Eide に感謝する。"
