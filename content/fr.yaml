  s4-3:
    text: "Disponibilité"
  s4-3-p1:
    text: "Nous définissons la disponibilité comme la fraction des RPC « qualifiés » auxquels le service répond avec succès dans les seuils de latence : 5 secondes pour une requête Safe et 15 secondes pour une requête Recent, car la réélection du leader dans Spanner peut prendre jusqu’à 10 secondes. Pour qu’un RPC soit qualifié, la requête doit être bien formée et avoir une échéance plus longue que le seuil de latence. En outre, le client doit rester dans les limites de son quota de ressources."
  s4-3-p2:
    text: "Pour ces raisons, nous ne pouvons pas mesurer la disponibilité directement sur le trafic réel, car nos clients envoient parfois des RPC avec des échéances courtes ou annulent leurs RPC en cours. Nous échantillonnons plutôt une petite fraction des requêtes valides du trafic réel et les rejouons ultérieurement avec nos propres sondes. Lorsque nous rejouons les requêtes, nous fixons un délai d’expiration plus long que le seuil de disponibilité. Nous ajustons également le zookie de la requête, s’il est spécifié, afin que l’âge relatif du zookie reste le même qu’au moment où la requête a été reçue dans le trafic réel. Enfin, nous exécutons 3 sondes par cluster et excluons les valeurs aberrantes afin d’éliminer les fausses alertes causées par de rares défaillances des sondes."
  s4-3-p3:
    text: "Pour calculer la disponibilité, nous agrégeons les taux de succès sur des fenêtres de 90 jours, moyennés sur l’ensemble des clusters. La [figure 5](#fig-5) présente la disponibilité de Zanzibar telle que mesurée par ces sondes. La disponibilité est restée supérieure à 99.999% au cours des 3 dernières années d’exploitation chez Google. Autrement dit, pour chaque trimestre, Zanzibar connaît moins de 2 minutes d’indisponibilité globale et moins de 13 minutes pendant lesquelles le taux d’erreur global dépasse 10%."
  fig-5:
    alt: "Graphique linéaire de la disponibilité de décembre 2015 à décembre 2018 pour les requêtes Safe et Recent. Les deux restent presque constamment entre 99.9995% et 100%, bien au-dessus de la ligne pointillée à 99.999%."
    caption: "Figure 5 : La disponibilité de Zanzibar est restée supérieure à 99.999% au cours des trois dernières années."
  s4-4:
    text: "Fonctionnement interne"
  s4-4-p1:
    text: "Les serveurs Zanzibar se délèguent mutuellement des vérifications et des lectures selon un hachage cohérent, et les côtés appelant et appelé des opérations déléguées mettent tous deux en cache les résultats afin d’éviter les points chauds ([§3.2.5](#s3-2-5)). En pic, Zanzibar traite 22 millions de RPC internes « délégués » par seconde, répartis à peu près également entre lectures et vérifications. Le cache en mémoire traite environ 200 millions de recherches par seconde en pic, dont 150 millions issues des vérifications et 50 millions issues des lectures. La mise en cache des vérifications présente un taux de succès de 10% du côté du délégué, auquel s’ajoutent 12% épargnés grâce à la table de verrous. Par ailleurs, la mise en cache du côté du délégant présente un taux de succès de 2%, auquel s’ajoutent 3% grâce à la table de verrous. Bien que ces taux de succès paraissent faibles, ils empêchent 500K RPC internes par seconde de créer des points chauds."
  s4-4-p2:
    text: "Les lectures déléguées bénéficient de taux de succès plus élevés du côté du délégué — 24% sur le cache et 9% sur la table de verrous —, mais le cache du délégant est atteint moins de 1% du temps. Pour les groupes extrêmement chauds, Zanzibar optimise davantage en lisant et en mettant en cache à l’avance l’ensemble complet des membres — cela concerne 0.1% des groupes, mais permet d’éviter davantage de points chauds."
  s4-4-p3:
    text: "Cette mise en cache, conjuguée à un regroupement agressif des requêtes de lecture, permet à Zanzibar de n’émettre que 20 millions de RPC de lecture par seconde vers Spanner. La médiane de ces requêtes lit 1.5 ligne par RPC, mais au 99e centile, chacune lit près de 1 millier de lignes."
  s4-4-p4:
    text: "Les lectures Spanner de Zanzibar prennent 0.5 msec en médiane et 2 msec au 95e centile. Nous constatons que 1% des lectures Spanner, soit 200K lectures par seconde, bénéficient de la couverture (hedging). Notons que Zanzibar utilise une instance de Spanner exécutée en interne chez Google, et non une instance de Cloud Spanner [[6](#ref-6)]."
  s4-4-p5:
    text: "L’index Leopard traite 1.56M QPS en médiane, ou 2.22M QPS au 99e centile, d’après des données agrégées sur 7 jours. Sur ces mêmes 7 jours, les serveurs Leopard répondent en moins de 150 μsec en médiane, ou en moins de 1 msec au 99e centile. Au cours de ces 7 jours, la couche incrémentale de Leopard écrit environ 500 mises à jour d’index par seconde en médiane, et environ 1.5K mises à jour par seconde au 99e centile."
  s4-5:
    text: "Enseignements tirés"
  s4-5-p1:
    text: "Zanzibar a évolué pour répondre aux demandes variées et importantes d’un ensemble croissant de clients, dont Google Calendar, Google Cloud, Google Drive, Google Maps, Google Photos et YouTube. Cette section met en lumière les enseignements tirés de cette expérience."
  s4-5-p2:
    text: "Un thème récurrent a été l’importance de la flexibilité pour s’adapter aux différences entre clients. Par exemple :"
  s4-5-flex:
    items:
      - "*Les modèles de contrôle d’accès varient considérablement :* au fil du temps, nous avons ajouté des fonctionnalités pour répondre aux besoins de clients spécifiques. Par exemple, nous avons ajouté `computed_userset` pour permettre de déduire l’identifiant du propriétaire d’un objet à partir du préfixe de l’identifiant de l’objet, ce qui réduit les besoins en espace pour des clients tels que Drive et Photos, qui gèrent de nombreux objets privés. De même, nous avons ajouté `tuple_to_userset` pour représenter la hiérarchie des objets avec un seul tuple de relation par saut. Les avantages sont à la fois la réduction de l’espace et la flexibilité — cela permet à des clients tels que Cloud à la fois d’exprimer l’héritage d’ACL de manière compacte et de modifier les règles d’héritage d’ACL sans avoir à mettre à jour un grand nombre de tuples. Voir [§2.3.1](#s2-3-1)."
      - "*Les exigences de fraîcheur sont souvent, mais pas toujours, souples :* les clients tolèrent souvent une obsolescence modérée et non spécifiée lors de l’évaluation des ACL, mais exigent parfois une fraîcheur spécifiée plus précisément. Nous avons conçu notre protocole zookie autour de cette propriété, afin de pouvoir servir la plupart des requêtes à partir d’un instantané par défaut déjà répliqué, tout en permettant aux clients de borner l’obsolescence si nécessaire. Nous avons également ajusté la granularité de nos horodatages d’instantané pour correspondre aux exigences de fraîcheur des clients. Les quanta d’horodatage grossiers qui en résultent nous permettent d’effectuer la majorité des vérifications d’autorisation sur un petit nombre d’instantanés, réduisant ainsi considérablement la fréquence des lectures dans la base de données. Voir [§3.2.1](#s3-2-1)."
  s4-5-p3:
    text: "Un autre thème a été la nécessité d’ajouter des optimisations de performance pour prendre en charge les comportements des clients observés en production. Par exemple :"
  s4-5-perf:
    items:
      - "*Les requêtes de couverture sont essentielles pour réduire la latence de queue :* les clients qui offrent des capacités de recherche à leurs utilisateurs, comme Drive, émettent souvent des dizaines à des centaines de vérifications d’autorisation pour servir un seul ensemble de résultats de recherche. Nous avons introduit la couverture (hedging) des requêtes Spanner et Leopard pour éviter qu’une opération lente occasionnelle ne ralentisse l’ensemble de l’interaction de l’utilisateur. Voir [§3.2.7](#s3-2-7)."
      - "*L’atténuation des points chauds est cruciale pour la haute disponibilité :* certaines charges de travail créent dans les données d’ACL des points chauds susceptibles de submerger les serveurs de bases de données sous-jacents. Un schéma courant est une rafale de vérifications d’ACL portant sur un objet référencé indirectement par les ACL de nombreux objets différents. Des cas concrets proviennent du cas d’usage de recherche mentionné ci-dessus, où les documents de la recherche partagent indirectement les ACL d’un grand groupe social ou professionnel, et des cas d’usage de Cloud, où de nombreux objets partagent indirectement les ACL d’un même objet situé haut dans une hiérarchie. Zanzibar gère la plupart des points chauds avec des mécanismes généraux tels que son cache distribué et sa table de verrous, mais nous avons constaté la nécessité d’optimiser certains cas d’usage spécifiques. Par exemple, nous avons ajouté le préchargement en cache de tous les tuples de relation d’un objet chaud. Nous avons également retardé l’annulation des vérifications d’ACL secondaires lorsqu’il existe des requêtes concurrentes portant sur les mêmes données d’ACL. Voir [§3.2.5](#s3-2-5)."
      - "*L’isolation des performances est indispensable pour se protéger des clients au comportement anormal :* même avec des mesures d’atténuation des points chauds, des comportements de clients inattendus, et parfois involontaires, pourraient encore surcharger notre système ou son infrastructure sous-jacente. Citons par exemple le cas de clients qui lancent de nouvelles fonctionnalités dont la popularité s’avère inattendue, ou qui sollicitent Zanzibar de manière imprévue. Au fil du temps, nous avons ajouté des garde-fous d’isolation pour garantir l’absence de défaillances en cascade entre clients ou entre objets d’un même client. Ces garde-fous comprennent une comptabilisation fine des coûts, des quotas et du bridage (throttling). Voir [§3.2.6](#s3-2-6)."
  s5:
    text: "Travaux connexes"
  s5-p1:
    text: "Zanzibar est un système distribué de stockage et d’évaluation d’ACL à l’échelle planétaire. Nombre de ses concepts d’autorisation ont déjà été explorés dans les domaines du contrôle d’accès et des graphes sociaux, et ses défis de passage à l’échelle ont été étudiés dans le domaine des systèmes distribués."
  s5-p2:
    text: "Le contrôle d’accès est un élément central des systèmes d’exploitation multi-utilisateurs. Multics [[23](#ref-23)] prend en charge les ACL sur les segments et les répertoires. Les entrées d’ACL se composent d’un identifiant de principal et d’un ensemble de bits de permission. Dans la première édition d’UNIX [[9](#ref-9)], des indicateurs de fichier précisent si le propriétaire et les non-propriétaires peuvent lire ou écrire le fichier. Dès la 4e édition, les bits de permission avaient été étendus à des bits de lecture/écriture/exécution pour le propriétaire, le groupe et les autres. Les ACL POSIX [[4](#ref-4)] ajoutent une liste arbitraire d’utilisateurs et de groupes, chacun disposant d’au plus 32 bits de permission. VMS [[7](#ref-7), [8](#ref-8)] prend en charge l’héritage d’ACL pour les fichiers créés dans une arborescence de répertoires. Le modèle de données de Zanzibar prend en charge les permissions, les utilisateurs, les groupes et l’héritage tels qu’on les trouve dans les systèmes ci-dessus."
  s5-p3:
    text: "Taos [[24](#ref-24), [10](#ref-10)] prend en charge des principaux composés qui intègrent la manière dont une identité a été transformée lors de son passage à travers un système distribué. Par exemple, si l’utilisateur $U$ s’est connecté à la station de travail $W$ pour accéder au serveur de fichiers $S$, $S$ verrait des requêtes authentifiées comme « $W$ pour $U$ » plutôt que simplement $U$. Cela permettrait d’écrire, sur le courrier électronique d’un utilisateur, une ACL qui le rendrait accessible uniquement à cet utilisateur, et seulement s’il y est accédé via le serveur de messagerie. Abadi et al. examinent dans [[11](#ref-11)] un modèle d’ACL fondées sur les groupes, prenant en charge les identités composées. Leur notion de « bénédictions » (blessings) est similaire aux tuples de Zanzibar. Cependant, Zanzibar adopte une représentation unifiée des ACL et des groupes à l’aide des usersets, alors qu’il s’agit de concepts distincts dans [[11](#ref-11)]."
  s5-p4:
    text: "Le contrôle d’accès à base de rôles (RBAC), proposé pour la première fois dans [[17](#ref-17)], a introduit la notion de rôles, qui sont similaires aux relations de Zanzibar. Les rôles peuvent hériter les uns des autres et impliquer des permissions. Un certain nombre de clients de Zanzibar ont mis en œuvre des politiques RBAC au-dessus du langage de configuration des espaces de noms de Zanzibar."
  s5-p5:
    text: "Une discussion des systèmes de stockage d’ACL en 2019 serait incomplète sans mentionner les systèmes de gestion des identités et des accès (IAM) proposés commercialement par Amazon [[1](#ref-1)], Google [[5](#ref-5)], Microsoft [[2](#ref-2)] et d’autres. Ces systèmes permettent aux clients des produits cloud de ces entreprises de configurer des contrôles d’accès flexibles reposant sur diverses fonctionnalités telles que : l’affectation d’utilisateurs à des rôles ou à des groupes ; des langages de politiques propres à un domaine ; et des API permettant la création et la modification d’ACL. Ce que tous ces systèmes ont en commun, c’est un stockage unifié des ACL et une API fondée sur des RPC, une philosophie également au cœur de la conception de Zanzibar. Le système Cloud IAM de Google [[5](#ref-5)] est construit comme une couche au-dessus du système de stockage et d’évaluation d’ACL de Zanzibar."
  s5-p6:
    text: "TAO [[13](#ref-13)] est un magasin de données distribué pour le graphe social de Facebook. Plusieurs clients de Zanzibar utilisent également Zanzibar pour stocker leurs graphes sociaux. Zanzibar et TAO fournissent tous deux des vérifications d’autorisation à leurs clients. Tous deux sont déployés en tant que services à instance unique, tous deux fonctionnent à grande échelle et tous deux sont optimisés pour les opérations en lecture seule. TAO offre une cohérence globale à terme avec une réplication asynchrone, ainsi qu’une cohérence lecture-après-écriture au mieux (best-effort) avec des mises à jour synchrones du cache. En revanche, Zanzibar fournit la cohérence externe et des lectures d’instantané à obsolescence bornée, de sorte qu’il respecte l’ordre causal entre les mises à jour d’ACL et de contenu et protège ainsi contre le problème du « nouvel ennemi »."
  s5-p7:
    text: "Les horloges de Lamport [[22](#ref-22)] fournissent des horodatages vectoriels partiellement ordonnés qui peuvent servir à déterminer l’ordre des événements. Cependant, les horloges de Lamport exigent la participation explicite de tous les « processus », alors que, dans les cas d’usage de Zanzibar, certains de ces « processus » peuvent être des clients externes, voire des utilisateurs humains. En revanche, Zanzibar s’appuie sur son système de base de données sous-jacent, Spanner [[15](#ref-15)], pour offrir à la fois la cohérence externe et des lectures d’instantané à obsolescence bornée. En particulier, Zanzibar s’appuie sur l’abstraction TrueTime de Spanner [[15](#ref-15)] pour fournir des horodatages de validation linéarisables encodés sous forme de zookies."
  s5-p8:
    text: "Dans le même temps, Zanzibar ajoute un certain nombre de fonctionnalités à celles fournies par Spanner. Tout d’abord, le protocole zookie ne permet *pas* aux clients de lire ou d’évaluer des ACL sur un instantané arbitraire. Cette restriction permet à Zanzibar de choisir un instantané qui facilite une évaluation rapide des ACL. En outre, Zanzibar offre une résilience aux points chauds de la base de données (p. ex. des vérifications d’autorisation sur une vidéo soudainement populaire) et une poursuite de pointeurs sûre malgré une récursion potentiellement profonde (p. ex. des vérifications d’appartenance à des groupes hiérarchiques)."
  s5-p9:
    text: "Le service de verrous distribué Chubby [[14](#ref-14)] offre un stockage fiable, linéarise les écritures et fournit un contrôle d’accès, mais il ne dispose pas des fonctionnalités nécessaires pour prendre en charge les cas d’usage de Zanzibar. En particulier, il ne prend en charge ni de grands volumes de données, ni des lectures efficaces par plages, ni des lectures sur un instantané spécifié par le client avec une obsolescence bornée. Son mécanisme d’invalidation du cache limite également son débit d’écriture."
  s5-p10:
    text: "Enfin, ZooKeeper offre un service de coordination à hautes performances [[19](#ref-19)], mais ne dispose pas non plus des fonctionnalités requises par Zanzibar. Par rapport à Chubby, il peut gérer des débits de lecture et d’écriture plus élevés avec une cohérence de cache plus relâchée. Cependant, il ne fournit pas de cohérence externe pour les mises à jour portant sur différents nœuds, car sa linéarisabilité s’applique nœud par nœud. Il ne fournit pas non plus de lectures d’instantané à obsolescence bornée."
  s6:
    text: "Conclusion"
  s6-p1:
    text: "Le système d’autorisation Zanzibar unifie les données et la logique de contrôle d’accès pour Google. Son modèle de données et son langage de configuration, simples mais flexibles, prennent en charge une diversité de politiques de contrôle d’accès issues d’applications aussi bien grand public que d’entreprise."
  s6-p2:
    text: "Le modèle de cohérence externe de Zanzibar est l’une de ses caractéristiques les plus marquantes. Il respecte l’ordre des actions des utilisateurs tout en permettant d’évaluer les vérifications d’autorisation en des emplacements distribués, sans synchronisation globale."
  s6-p3:
    text: "Zanzibar emploie d’autres techniques clés pour assurer le passage à l’échelle, une faible latence et une haute disponibilité. Par exemple, il évalue les appartenances à des groupes imbriqués en profondeur ou en largeur avec Leopard, un index spécialisé permettant le calcul efficace d’opérations ensemblistes avec une cohérence d’instantané. Autre exemple, il combine un cache distribué avec un mécanisme de déduplication des requêtes en cours. Il atténue ainsi les points chauds, un problème critique en production lorsque l’on sert des données reposant sur un stockage normalisé et cohérent. Ensemble, ces mesures donnent un système qui passe à l’échelle de milliers de milliards de règles de contrôle d’accès et de millions de requêtes d’autorisation par seconde."
  s7:
    text: "Remerciements"
  s7-p1:
    text: "De nombreuses personnes ont apporté des contributions techniques à Zanzibar. Nous remercions les membres anciens et récents de l’équipe de développement, notamment Dan Barella, Miles Chaston, Daria Jung, Alex Mendes da Costa, Xin Pan, Scott Smith, Matthew Steffen, Riva Tropp et Yuliya Zabiyaka. Nous remercions également les membres anciens et actuels de l’équipe Site Reliability Engineering, notamment Randall Bosetti, Hannes Eder, Robert Geisberger, Tom Li, Massimo Maggi, Igor Oks, Aaron Peterson et Andrea Yu."
  s7-p2:
    text: "En outre, un certain nombre de personnes ont contribué à améliorer cet article. Nous avons reçu des commentaires éclairants de David Bacon, Carolin Gäthke, Brad Krueger, Ari Shamash, Kai Shen et Lawrence You. Nous sommes également reconnaissants à Nadav Eiron et Royal Hansen pour leur soutien. Enfin, nous remercions les relecteurs anonymes et notre rapporteur référent (shepherd), Eric Eide, pour leurs retours constructifs."
