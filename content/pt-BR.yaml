  s4-3:
    text: "Disponibilidade"
  s4-3-p1:
    text: "Definimos disponibilidade como a fração de RPCs “qualificadas” que o serviço responde com sucesso dentro dos limiares de latência: 5 segundos para uma requisição Safe e 15 segundos para uma requisição Recent, já que a reeleição do líder no Spanner pode levar até 10 segundos. Para que uma RPC seja qualificada, a requisição deve estar bem-formada e ter um prazo (deadline) maior do que o limiar de latência. Além disso, o cliente deve permanecer dentro de sua cota de recursos."
  s4-3-p2:
    text: "Por essas razões, não podemos medir a disponibilidade diretamente com o tráfego real, pois nossos clientes às vezes enviam RPCs com prazos curtos ou cancelam suas RPCs em andamento. Em vez disso, amostramos uma pequena fração das requisições válidas do tráfego real e as reproduzimos posteriormente com nossos próprios probers. Ao reproduzir as requisições, definimos o timeout como maior do que o limiar de disponibilidade. Também ajustamos o zookie da requisição, se houver um especificado, de modo que a idade relativa do zookie permaneça a mesma de quando a requisição foi recebida no tráfego real. Por fim, executamos 3 probers por cluster e excluímos os valores discrepantes para eliminar alarmes falsos causados por falhas raras dos probers."
  s4-3-p3:
    text: "Para calcular a disponibilidade, agregamos as taxas de sucesso em janelas de 90 dias, com média entre os clusters. A [Figura 5](#fig-5) mostra a disponibilidade do Zanzibar medida por esses probers. A disponibilidade permaneceu acima de 99,999% nos últimos 3 anos de operação no Google. Em outras palavras, a cada trimestre, o Zanzibar tem menos de 2 minutos de indisponibilidade global e menos de 13 minutos em que a taxa de erro global excede 10%."
  fig-5:
    alt: "Gráfico de linhas da disponibilidade de dezembro de 2015 a dezembro de 2018 para requisições Safe e Recent. Ambas permanecem entre 99,9995% e 100% quase o tempo todo, bem acima da linha tracejada de 99,999%."
    caption: "Figura 5: A disponibilidade do Zanzibar nos últimos três anos permaneceu acima de 99,999%."
  s4-4:
    text: "Detalhes internos"
  s4-4-p1:
    text: "Os servidores do Zanzibar delegam verificações e leituras uns aos outros com base em hashing consistente, e tanto o lado chamador quanto o lado chamado das operações delegadas armazenam os resultados em cache para evitar pontos quentes ([§3.2.5](#s3-2-5)). No pico, o Zanzibar processa 22 milhões de RPCs internas “delegadas” por segundo, divididas de forma aproximadamente igual entre leituras e verificações. O cache em memória processa aproximadamente 200 milhões de consultas por segundo no pico, 150 milhões provenientes de verificações e 50 milhões de leituras. O cache de verificações tem uma taxa de acerto de 10% no lado do delegado, com mais 12% poupados pela tabela de bloqueios. Enquanto isso, o cache no lado do delegante tem uma taxa de acerto de 2%, com mais 3% provenientes da tabela de bloqueios. Embora essas taxas de acerto pareçam baixas, elas impedem que 500K RPCs internas por segundo criem pontos quentes."
  s4-4-p2:
    text: "As leituras delegadas apresentam taxas de acerto mais altas no lado do delegado — 24% no cache e 9% na tabela de bloqueios —, mas o cache do delegante registra acertos em menos de 1% das vezes. Para grupos super quentes, o Zanzibar otimiza ainda mais lendo e armazenando em cache antecipadamente o conjunto completo de membros — isso acontece para 0,1% dos grupos, mas evita ainda mais pontos quentes."
  s4-4-p3:
    text: "Esse cache, junto com o agrupamento agressivo de requisições de leitura, permite que o Zanzibar emita apenas 20 milhões de RPCs de leitura por segundo ao Spanner. A mediana dessas requisições lê 1,5 linha por RPC, mas no 99º percentil cada uma lê cerca de mil linhas."
  s4-4-p4:
    text: "As leituras do Zanzibar no Spanner levam 0,5 ms na mediana e 2 ms no 95º percentil. Constatamos que 1% das leituras do Spanner, ou 200K leituras por segundo, se beneficiam do hedging. Observamos que o Zanzibar usa uma instância do Spanner que roda internamente no Google, e não uma instância do Cloud Spanner [[6](#ref-6)]."
  s4-4-p5:
    text: "O índice Leopard processa 1,56M QPS na mediana, ou 2,22M QPS no 99º percentil, com base em dados agregados ao longo de 7 dias. Ao longo dos mesmos 7 dias, os servidores Leopard respondem em menos de 150 μs na mediana, ou abaixo de 1 ms no 99º percentil. A camada incremental do Leopard, durante esses 7 dias, escreve aproximadamente 500 atualizações de índice por segundo na mediana e aproximadamente 1,5K atualizações por segundo no 99º percentil."
  s4-5:
    text: "Lições aprendidas"
  s4-5-p1:
    text: "O Zanzibar evoluiu para atender às demandas variadas e intensas de um conjunto crescente de clientes, incluindo Google Calendar, Google Cloud, Google Drive, Google Maps, Google Photos e YouTube. Esta seção destaca as lições aprendidas com essa experiência."
  s4-5-p2:
    text: "Um tema recorrente tem sido a importância da flexibilidade para acomodar as diferenças entre os clientes. Por exemplo:"
  s4-5-flex:
    items:
      - "*Os padrões de controle de acesso variam amplamente:* ao longo do tempo, adicionamos funcionalidades para atender a clientes específicos. Por exemplo, adicionamos `computed_userset` para permitir inferir o ID do dono de um objeto a partir do prefixo do ID do objeto, o que reduz os requisitos de espaço para clientes como Drive e Photos, que gerenciam muitos objetos privados. Da mesma forma, adicionamos `tuple_to_userset` para representar a hierarquia de objetos com apenas uma tupla de relação por salto. Os benefícios são tanto a redução de espaço quanto a flexibilidade — isso permite que clientes como o Cloud tanto expressem a herança de ACL de forma compacta quanto alterem as regras de herança de ACL sem precisar atualizar grandes quantidades de tuplas. Veja a [§2.3.1](#s2-3-1)."
      - "*Os requisitos de atualidade são frequentemente, mas nem sempre, flexíveis:* os clientes frequentemente admitem uma defasagem moderada e não especificada durante a avaliação de ACLs, mas às vezes exigem uma atualidade especificada com mais precisão. Projetamos nosso protocolo de zookie em torno dessa propriedade, de modo que possamos atender à maioria das requisições a partir de um snapshot padrão já replicado, permitindo ao mesmo tempo que os clientes limitem a defasagem quando necessário. Também ajustamos a granularidade de nossos timestamps de snapshot para corresponder aos requisitos de atualidade dos clientes. Os quanta de timestamp grossos resultantes nos permitem realizar a maioria das verificações de autorização sobre um pequeno número de snapshots, reduzindo assim enormemente a frequência de leituras do banco de dados. Veja a [§3.2.1](#s3-2-1)."
  s4-5-p3:
    text: "Outro tema tem sido a necessidade de adicionar otimizações de desempenho para dar suporte aos comportamentos dos clientes observados em produção. Por exemplo:"
  s4-5-perf:
    items:
      - "*O hedging de requisições é fundamental para reduzir a latência de cauda:* clientes que oferecem recursos de busca a seus usuários, como o Drive, frequentemente emitem de dezenas a centenas de verificações de autorização para servir um único conjunto de resultados de busca. Introduzimos o hedging de requisições ao Spanner e ao Leopard para evitar que uma operação lenta ocasional torne lenta toda a interação do usuário. Veja a [§3.2.7](#s3-2-7)."
      - "*A mitigação de pontos quentes é crítica para a alta disponibilidade:* algumas cargas de trabalho criam pontos quentes nos dados de ACL que podem sobrecarregar os servidores de banco de dados subjacentes. Um padrão comum é uma rajada de verificações de ACL para um objeto que é referenciado indiretamente pelas ACLs de muitos objetos diferentes. Casos específicos surgem do caso de uso de busca mencionado acima, em que os documentos da busca compartilham indiretamente ACLs de um grande grupo social ou de trabalho, e de casos de uso do Cloud em que muitos objetos compartilham indiretamente ACLs do mesmo objeto, situado no alto de uma hierarquia. O Zanzibar lida com a maioria dos pontos quentes com mecanismos gerais, como seu cache distribuído e sua tabela de bloqueios, mas constatamos a necessidade de otimizar casos de uso específicos. Por exemplo, adicionamos a pré-busca em cache de todas as tuplas de relação de um objeto quente. Também adiamos o cancelamento de verificações de ACL secundárias quando há requisições concorrentes para os mesmos dados de ACL. Veja a [§3.2.5](#s3-2-5)."
      - "*O isolamento de desempenho é indispensável para proteger contra clientes que se comportam mal:* mesmo com medidas de mitigação de pontos quentes, comportamentos inesperados e às vezes não intencionais dos clientes ainda podem sobrecarregar nosso sistema ou sua infraestrutura subjacente. Exemplos incluem quando os clientes lançam novas funcionalidades que se mostram inesperadamente populares ou que usam o Zanzibar de maneiras não previstas. Com o tempo, adicionamos salvaguardas de isolamento para garantir que não haja falhas em cascata entre clientes ou entre objetos do mesmo cliente. Essas salvaguardas incluem contabilização de custos de granularidade fina, cotas e limitação (throttling). Veja a [§3.2.6](#s3-2-6)."
  s5:
    text: "Trabalhos relacionados"
  s5-p1:
    text: "O Zanzibar é um sistema distribuído de armazenamento e avaliação de ACLs em escala planetária. Muitos de seus conceitos de autorização já foram explorados anteriormente nos domínios de controle de acesso e de grafos sociais, e seus desafios de escalabilidade foram investigados no campo de sistemas distribuídos."
  s5-p2:
    text: "O controle de acesso é uma parte central dos sistemas operacionais multiusuário. O Multics [[23](#ref-23)] oferece suporte a ACLs em segmentos e diretórios. As entradas de ACL consistem em um identificador de principal e um conjunto de bits de permissão. Na primeira edição do UNIX [[9](#ref-9)], flags de arquivo indicam se o dono e os não donos podem ler ou escrever o arquivo. Na 4ª edição, os bits de permissão já haviam sido expandidos para bits de leitura/escrita/execução para o dono, o grupo e os demais. As ACLs POSIX [[4](#ref-4)] adicionam uma lista arbitrária de usuários e grupos, cada um com até 32 bits de permissão. O VMS [[7](#ref-7), [8](#ref-8)] oferece suporte à herança de ACL para arquivos criados dentro de uma árvore de diretórios. O modelo de dados do Zanzibar oferece suporte a permissões, usuários, grupos e herança, tal como encontrados nos sistemas acima."
  s5-p3:
    text: "O Taos [[24](#ref-24), [10](#ref-10)] oferece suporte a principais compostos, que incorporam como uma identidade foi transformada ao passar por um sistema distribuído. Por exemplo, se o usuário $U$ fizesse login na estação de trabalho $W$ para acessar o servidor de arquivos $S$, $S$ veria requisições autenticadas como “$W$ em nome de $U$”, em vez de apenas $U$. Isso permitiria escrever uma ACL sobre o e-mail de um usuário que seria acessível apenas ao usuário, e apenas se acessado por meio do servidor de e-mail. Abadi et al. discutem em [[11](#ref-11)] um modelo de ACLs baseadas em grupos com suporte a identidades compostas. Sua noção de “bênçãos” (blessings) é semelhante às tuplas do Zanzibar. No entanto, o Zanzibar adota uma representação unificada para ACLs e grupos usando usersets, enquanto em [[11](#ref-11)] eles são conceitos separados."
  s5-p4:
    text: "O controle de acesso baseado em papéis (RBAC), proposto pela primeira vez em [[17](#ref-17)], introduziu a noção de papéis, que são semelhantes às relações do Zanzibar. Os papéis podem herdar uns dos outros e implicar permissões. Diversos clientes do Zanzibar implementaram políticas RBAC sobre a linguagem de configuração de namespace do Zanzibar."
  s5-p5:
    text: "Uma discussão sobre armazenamentos de ACL em 2019 estaria incompleta sem mencionar os sistemas de Gerenciamento de Identidade e Acesso (IAM) oferecidos comercialmente pela Amazon [[1](#ref-1)], pelo Google [[5](#ref-5)], pela Microsoft [[2](#ref-2)] e por outros. Esses sistemas permitem que os clientes dos produtos de nuvem dessas empresas configurem controles de acesso flexíveis com base em diversas funcionalidades, como: atribuição de usuários a papéis ou grupos; linguagens de política específicas de domínio; e APIs que permitem a criação e a modificação de ACLs. O que todos esses sistemas têm em comum é o armazenamento unificado de ACLs e uma API baseada em RPC, uma filosofia também central ao projeto do Zanzibar. O sistema Cloud IAM do Google [[5](#ref-5)] é construído como uma camada sobre o sistema de armazenamento e avaliação de ACLs do Zanzibar."
  s5-p6:
    text: "O TAO [[13](#ref-13)] é um armazenamento de dados distribuído para o grafo social do Facebook. Vários clientes do Zanzibar também usam o Zanzibar para armazenar seus grafos sociais. Tanto o Zanzibar quanto o TAO fornecem verificações de autorização aos clientes. Ambos são implantados como serviços de instância única, ambos operam em grande escala e ambos são otimizados para operações somente de leitura. O TAO oferece consistência global eventual com replicação assíncrona e consistência de leitura após escrita, em regime de melhor esforço, com atualizações síncronas de cache. Em contraste, o Zanzibar fornece consistência externa e leituras de snapshot com defasagem limitada, de modo que respeita a ordenação causal entre atualizações de ACL e de conteúdo e, assim, protege contra o problema do “novo inimigo”."
  s5-p7:
    text: "Os relógios de Lamport [[22](#ref-22)] fornecem timestamps vetoriais parcialmente ordenados que podem ser usados para determinar a ordem dos eventos. No entanto, os relógios de Lamport exigem a participação explícita de todos os “processos”, ao passo que, nos casos de uso do Zanzibar, alguns dos “processos” podem ser clientes externos ou até mesmo usuários humanos. Em contraste, o Zanzibar depende de seu sistema de banco de dados subjacente, o Spanner [[15](#ref-15)], para oferecer tanto consistência externa quanto leituras de snapshot com defasagem limitada. Em particular, o Zanzibar se apoia na abstração TrueTime do Spanner [[15](#ref-15)] para fornecer timestamps de commit linearizáveis codificados como zookies."
  s5-p8:
    text: "Ao mesmo tempo, o Zanzibar adiciona várias funcionalidades além das fornecidas pelo Spanner. Para começar, o protocolo de zookie *não* permite que os clientes leiam ou avaliem ACLs em um snapshot arbitrário. Essa restrição permite que o Zanzibar escolha um snapshot que facilite a avaliação rápida de ACLs. Além disso, o Zanzibar oferece resiliência a pontos quentes no banco de dados (por exemplo, verificações de autorização sobre um vídeo que repentinamente se tornou popular) e perseguição de ponteiros segura apesar de recursão potencialmente profunda (por exemplo, verificações de associação em grupos hierárquicos)."
  s5-p9:
    text: "O serviço de bloqueio distribuído Chubby [[14](#ref-14)] oferece armazenamento confiável, lineariza as escritas e fornece controle de acesso, mas carece de funcionalidades necessárias para dar suporte aos casos de uso do Zanzibar. Em particular, ele não oferece suporte a grandes volumes de dados, leituras de intervalo eficientes, nem leituras em um snapshot especificado pelo cliente com defasagem limitada. Seu mecanismo de invalidação de cache também limita sua vazão de escrita."
  s5-p10:
    text: "Por fim, o ZooKeeper oferece um serviço de coordenação de alto desempenho [[19](#ref-19)], mas também carece de funcionalidades exigidas pelo Zanzibar. Em relação ao Chubby, ele consegue lidar com taxas de leitura e escrita mais altas, com uma consistência de cache mais relaxada. No entanto, ele não fornece consistência externa para atualizações entre nós diferentes, já que sua linearizabilidade é por nó. Ele também não fornece leituras de snapshot com defasagem limitada."
  s6:
    text: "Conclusão"
  s6-p1:
    text: "O sistema de autorização Zanzibar unifica os dados e a lógica de controle de acesso do Google. Seu modelo de dados e sua linguagem de configuração, simples porém flexíveis, oferecem suporte a uma variedade de políticas de controle de acesso tanto de aplicações de consumo quanto de aplicações corporativas."
  s6-p2:
    text: "O modelo de consistência externa do Zanzibar é uma de suas características mais marcantes. Ele respeita a ordenação das ações dos usuários e, ao mesmo tempo, permite que as verificações de autorização sejam avaliadas em locais distribuídos sem sincronização global."
  s6-p3:
    text: "O Zanzibar emprega outras técnicas fundamentais para fornecer escalabilidade, baixa latência e alta disponibilidade. Por exemplo, ele avalia associações a grupos profunda ou amplamente aninhados com o Leopard, um índice especializado para a computação eficiente de operações sobre conjuntos com consistência de snapshot. Como outro exemplo, ele combina um cache distribuído com um mecanismo para deduplicar requisições em andamento. Assim, ele mitiga os pontos quentes, um problema crítico em produção ao servir dados sobre um armazenamento normalizado e consistente. Essas medidas, em conjunto, resultam em um sistema que escala para trilhões de regras de controle de acesso e milhões de requisições de autorização por segundo."
  s7:
    text: "Agradecimentos"
  s7-p1:
    text: "Muitas pessoas fizeram contribuições técnicas ao Zanzibar. Agradecemos aos membros antigos e recentes da equipe de desenvolvimento, incluindo Dan Barella, Miles Chaston, Daria Jung, Alex Mendes da Costa, Xin Pan, Scott Smith, Matthew Steffen, Riva Tropp e Yuliya Zabiyaka. Agradecemos também aos membros antigos e atuais da equipe de Site Reliability Engineering, incluindo Randall Bosetti, Hannes Eder, Robert Geisberger, Tom Li, Massimo Maggi, Igor Oks, Aaron Peterson e Andrea Yu."
  s7-p2:
    text: "Além disso, várias pessoas ajudaram a melhorar este artigo. Recebemos comentários perspicazes de David Bacon, Carolin Gäthke, Brad Krueger, Ari Shamash, Kai Shen e Lawrence You. Também somos gratos a Nadav Eiron e Royal Hansen pelo apoio. Por fim, agradecemos aos revisores anônimos e ao nosso shepherd, Eric Eide, pelo feedback construtivo."
