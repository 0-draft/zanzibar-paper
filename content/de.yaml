  s4-3:
    text: "Verfügbarkeit"
  s4-3-p1:
    text: "Wir definieren Verfügbarkeit als den Anteil „qualifizierter“ RPCs, die der Dienst innerhalb der Latenzschwellen erfolgreich beantwortet: 5 Sekunden für eine Safe-Anfrage und 15 Sekunden für eine Recent-Anfrage, da eine Neuwahl des Leaders in Spanner bis zu 10 Sekunden dauern kann. Damit ein RPC qualifiziert ist, muss die Anfrage wohlgeformt sein und eine Deadline haben, die länger als die Latenzschwelle ist. Außerdem muss der Client innerhalb seines Ressourcenkontingents bleiben."
  s4-3-p2:
    text: "Aus diesen Gründen können wir die Verfügbarkeit nicht direkt anhand des Live-Datenverkehrs messen, da unsere Clients manchmal RPCs mit kurzen Deadlines senden oder laufende RPCs abbrechen. Stattdessen ziehen wir eine kleine Stichprobe gültiger Anfragen aus dem Live-Datenverkehr und spielen sie später mit unseren eigenen Probern erneut ab. Beim erneuten Abspielen der Anfragen setzen wir das Timeout länger als die Verfügbarkeitsschwelle. Außerdem passen wir den zookie der Anfrage, sofern einer angegeben ist, so an, dass das relative Alter des zookie dasselbe bleibt wie zu dem Zeitpunkt, als die Anfrage im Live-Datenverkehr empfangen wurde. Schließlich betreiben wir 3 Prober pro Cluster und schließen Ausreißer aus, um Fehlalarme durch seltene Prober-Ausfälle zu eliminieren."
  s4-3-p3:
    text: "Zur Berechnung der Verfügbarkeit aggregieren wir Erfolgsquoten über 90-Tage-Fenster, gemittelt über die Cluster. [Abbildung 5](#fig-5) zeigt die von diesen Probern gemessene Verfügbarkeit von Zanzibar. Die Verfügbarkeit lag in den vergangenen 3 Betriebsjahren bei Google durchgehend über 99,999%. Mit anderen Worten: In jedem Quartal hat Zanzibar weniger als 2 Minuten globale Ausfallzeit und weniger als 13 Minuten, in denen die globale Fehlerquote 10% übersteigt."
  fig-5:
    alt: "Liniendiagramm der Verfügbarkeit von Dezember 2015 bis Dezember 2018 für Safe- und Recent-Anfragen. Beide liegen fast durchgehend zwischen 99,9995% und 100%, deutlich über der gestrichelten Linie bei 99,999%."
    caption: "Abbildung 5: Die Verfügbarkeit von Zanzibar lag in den vergangenen drei Jahren durchgehend über 99,999%."
  s4-4:
    text: "Interna"
  s4-4-p1:
    text: "Zanzibar-Server delegieren Prüfungen und Lesevorgänge auf Grundlage von Consistent Hashing aneinander, und sowohl die aufrufende als auch die aufgerufene Seite der delegierten Operationen cachen die Ergebnisse, um Hotspots zu verhindern ([§3.2.5](#s3-2-5)). In Spitzenzeiten verarbeitet Zanzibar 22 Millionen interne „delegierte“ RPCs pro Sekunde, die sich etwa gleichmäßig auf Lesevorgänge und Prüfungen verteilen. Das In-Memory-Caching verarbeitet in Spitzenzeiten etwa 200 Millionen Lookups pro Sekunde, 150 Millionen aus Prüfungen und 50 Millionen aus Lesevorgängen. Das Caching für Prüfungen hat auf der Seite des Delegierten eine Trefferquote von 10%, wobei zusätzlich 12% durch die Sperrtabelle eingespart werden. Das Caching auf der Seite des Delegierenden hat dagegen eine Trefferquote von 2%, mit zusätzlich 3% durch die Sperrtabelle. Auch wenn diese Trefferquoten niedrig erscheinen, verhindern sie, dass 500K interne RPCs pro Sekunde Hotspots erzeugen."
  s4-4-p2:
    text: "Delegierte Lesevorgänge erzielen auf der Seite des Delegierten höhere Trefferquoten – 24% im Cache und 9% in der Sperrtabelle –, doch der Cache des Delegierenden wird in weniger als 1% der Fälle getroffen. Für extrem heiße Gruppen optimiert Zanzibar zusätzlich, indem es die vollständige Mitgliedermenge im Voraus liest und cacht – dies geschieht bei 0,1% der Gruppen, verhindert aber zusätzlich Hotspots."
  s4-4-p3:
    text: "Dieses Caching erlaubt es Zanzibar zusammen mit aggressivem Pooling von Leseanfragen, nur 20 Millionen Lese-RPCs pro Sekunde an Spanner zu stellen. Im Median liest jede dieser Anfragen 1,5 Zeilen pro RPC, im 99. Perzentil liest jedoch jede nahezu tausend Zeilen."
  s4-4-p4:
    text: "Die Spanner-Lesevorgänge von Zanzibar dauern im Median 0,5 ms und im 95. Perzentil 2 ms. Wir stellen fest, dass 1% der Spanner-Lesevorgänge, also 200K Lesevorgänge pro Sekunde, von Hedging profitieren. Wir merken an, dass Zanzibar eine Spanner-Instanz verwendet, die intern bei Google läuft, und keine Instanz von Cloud Spanner [[6](#ref-6)]."
  s4-4-p5:
    text: "Der Leopard-Index verarbeitet im Median 1,56M QPS bzw. im 99. Perzentil 2,22M QPS, basierend auf über 7 Tage aggregierten Daten. Über dieselben 7 Tage antworten Leopard-Server im Median in weniger als 150 μs bzw. im 99. Perzentil in unter 1 ms. Die inkrementelle Schicht von Leopard schreibt während dieser 7 Tage im Median etwa 500 Indexaktualisierungen pro Sekunde und im 99. Perzentil etwa 1,5K Aktualisierungen pro Sekunde."
  s4-5:
    text: "Gewonnene Erkenntnisse"
  s4-5-p1:
    text: "Zanzibar hat sich weiterentwickelt, um die vielfältigen und hohen Anforderungen einer wachsenden Menge von Clients zu erfüllen, darunter Google Calendar, Google Cloud, Google Drive, Google Maps, Google Photos und YouTube. Dieser Abschnitt hebt die aus dieser Erfahrung gewonnenen Erkenntnisse hervor."
  s4-5-p2:
    text: "Ein wiederkehrendes Thema war die Bedeutung von Flexibilität, um Unterschieden zwischen Clients gerecht zu werden. Zum Beispiel:"
  s4-5-flex:
    items:
      - "*Zugriffskontrollmuster variieren stark:* Im Laufe der Zeit haben wir Funktionen hinzugefügt, um bestimmte Clients zu unterstützen. So haben wir beispielsweise `computed_userset` hinzugefügt, um die Eigentümer-ID eines Objekts aus dem Präfix der Objekt-ID ableiten zu können, was den Speicherbedarf für Clients wie Drive und Photos verringert, die viele private Objekte verwalten. Ebenso haben wir `tuple_to_userset` hinzugefügt, um Objekthierarchien mit nur einem Relationstupel pro Hop darzustellen. Die Vorteile sind sowohl Platzersparnis als auch Flexibilität – es erlaubt Clients wie Cloud, ACL-Vererbung kompakt auszudrücken und ACL-Vererbungsregeln zu ändern, ohne große Mengen von Tupeln aktualisieren zu müssen. Siehe [§2.3.1](#s2-3-1)."
      - "*Aktualitätsanforderungen sind oft, aber nicht immer locker:* Clients erlauben während der ACL-Auswertung oft eine nicht näher spezifizierte, moderate Veraltung, verlangen aber manchmal eine genauer spezifizierte Aktualität. Wir haben unser zookie-Protokoll um diese Eigenschaft herum entworfen, sodass wir die meisten Anfragen von einem standardmäßigen, bereits replizierten Snapshot bedienen können und Clients dennoch erlauben, die Veraltung bei Bedarf zu begrenzen. Außerdem haben wir die Granularität unserer Snapshot-Zeitstempel auf die Aktualitätsanforderungen der Clients abgestimmt. Die daraus resultierenden groben Zeitstempelquanten erlauben es uns, die Mehrheit der Autorisierungsprüfungen auf einer kleinen Anzahl von Snapshots durchzuführen, was die Häufigkeit von Datenbank-Lesevorgängen stark reduziert. Siehe [§3.2.1](#s3-2-1)."
  s4-5-p3:
    text: "Ein weiteres Thema war die Notwendigkeit, Leistungsoptimierungen hinzuzufügen, um im Produktivbetrieb beobachtetes Client-Verhalten zu unterstützen. Zum Beispiel:"
  s4-5-perf:
    items:
      - "*Request-Hedging ist der Schlüssel zur Verringerung der Tail-Latenz:* Clients, die ihren Benutzern Suchfunktionen anbieten, wie etwa Drive, führen oft Dutzende bis Hunderte von Autorisierungsprüfungen durch, um eine einzige Menge von Suchergebnissen auszuliefern. Wir haben Hedging von Spanner- und Leopard-Anfragen eingeführt, um zu verhindern, dass eine gelegentliche langsame Operation die gesamte Benutzerinteraktion verlangsamt. Siehe [§3.2.7](#s3-2-7)."
      - "*Die Abmilderung von Hotspots ist entscheidend für hohe Verfügbarkeit:* Manche Arbeitslasten erzeugen Hotspots in ACL-Daten, die die zugrunde liegenden Datenbankserver überlasten können. Ein häufiges Muster ist eine Häufung von ACL-Prüfungen für ein Objekt, auf das die ACLs vieler verschiedener Objekte indirekt verweisen. Konkrete Fälle ergeben sich aus dem oben erwähnten Suchanwendungsfall, bei dem die Dokumente in der Suche indirekt ACLs für eine große soziale oder Arbeitsgruppe teilen, sowie aus Cloud-Anwendungsfällen, in denen viele Objekte indirekt ACLs für dasselbe, in einer Hierarchie weit oben liegende Objekt teilen. Zanzibar behandelt die meisten Hotspots mit allgemeinen Mechanismen wie seinem verteilten Cache und seiner Sperrtabelle, doch wir haben festgestellt, dass bestimmte Anwendungsfälle optimiert werden müssen. Beispielsweise haben wir Cache-Prefetching aller Relationstupel für ein heißes Objekt hinzugefügt. Außerdem haben wir den Abbruch sekundärer ACL-Prüfungen verzögert, wenn es nebenläufige Anfragen für dieselben ACL-Daten gibt. Siehe [§3.2.5](#s3-2-5)."
      - "*Leistungsisolation ist unverzichtbar zum Schutz vor sich fehlverhaltenden Clients:* Selbst mit Maßnahmen zur Abmilderung von Hotspots könnte unerwartetes und manchmal unbeabsichtigtes Client-Verhalten unser System oder die zugrunde liegende Infrastruktur dennoch überlasten. Beispiele sind Fälle, in denen Clients neue Funktionen einführen, die sich als unerwartet populär erweisen, oder Zanzibar auf unbeabsichtigte Weise nutzen. Im Laufe der Zeit haben wir Isolationsschutzmaßnahmen hinzugefügt, um sicherzustellen, dass es keine kaskadierenden Ausfälle zwischen Clients oder zwischen Objekten desselben Clients gibt. Zu diesen Schutzmaßnahmen gehören feingranulare Kostenerfassung, Kontingente und Drosselung. Siehe [§3.2.6](#s3-2-6)."
  s5:
    text: "Verwandte Arbeiten"
  s5-p1:
    text: "Zanzibar ist ein verteiltes System zur Speicherung und Auswertung von ACLs im planetaren Maßstab. Viele seiner Autorisierungskonzepte wurden bereits zuvor in den Bereichen Zugriffskontrolle und soziale Graphen untersucht, und seine Skalierungsherausforderungen wurden auf dem Gebiet der verteilten Systeme erforscht."
  s5-p2:
    text: "Zugriffskontrolle ist ein Kernbestandteil von Mehrbenutzer-Betriebssystemen. Multics [[23](#ref-23)] unterstützt ACLs auf Segmenten und Verzeichnissen. ACL-Einträge bestehen aus einem Principal-Bezeichner und einer Menge von Berechtigungsbits. In der ersten Ausgabe von UNIX [[9](#ref-9)] geben Datei-Flags an, ob Eigentümer und Nicht-Eigentümer die Datei lesen oder schreiben dürfen. Bis zur 4. Ausgabe waren die Berechtigungsbits auf Lese-/Schreib-/Ausführungsbits für Eigentümer, Gruppe und andere erweitert worden. POSIX-ACLs [[4](#ref-4)] fügen eine beliebige Liste von Benutzern und Gruppen hinzu, jeweils mit bis zu 32 Berechtigungsbits. VMS [[7](#ref-7), [8](#ref-8)] unterstützt ACL-Vererbung für Dateien, die innerhalb eines Verzeichnisbaums erstellt werden. Das Datenmodell von Zanzibar unterstützt Berechtigungen, Benutzer, Gruppen und Vererbung, wie sie in den oben genannten Systemen zu finden sind."
  s5-p3:
    text: "Taos [[24](#ref-24), [10](#ref-10)] unterstützt zusammengesetzte Principals, die abbilden, wie eine Identität beim Durchlaufen eines verteilten Systems transformiert wurde. Wenn sich beispielsweise Benutzer $U$ an Workstation $W$ angemeldet hat, um auf Dateiserver $S$ zuzugreifen, würde $S$ Anfragen sehen, die als „$W$ für $U$“ statt nur als $U$ authentifiziert sind. Dies würde es ermöglichen, für die E-Mail eines Benutzers eine ACL zu schreiben, die nur für den Benutzer zugänglich wäre, und nur dann, wenn der Zugriff über den Mailserver erfolgt. Abadi et al. erörtern in [[11](#ref-11)] ein Modell gruppenbasierter ACLs mit Unterstützung für zusammengesetzte Identitäten. Ihr Begriff der „Blessings“ ähnelt den Zanzibar-Tupeln. Zanzibar verwendet jedoch mithilfe von Usersets eine einheitliche Darstellung für ACLs und Gruppen, während diese in [[11](#ref-11)] getrennte Konzepte sind."
  s5-p4:
    text: "Rollenbasierte Zugriffskontrolle (RBAC), erstmals in [[17](#ref-17)] vorgeschlagen, führte den Begriff der Rollen ein, die den Relationen von Zanzibar ähneln. Rollen können voneinander erben und Berechtigungen implizieren. Eine Reihe von Zanzibar-Clients hat RBAC-Richtlinien auf Basis der Namespace-Konfigurationssprache von Zanzibar implementiert."
  s5-p5:
    text: "Eine Diskussion von ACL-Speichern im Jahr 2019 wäre unvollständig ohne die Erwähnung der Identity-and-Access-Management-Systeme (IAM), die kommerziell von Amazon [[1](#ref-1)], Google [[5](#ref-5)], Microsoft [[2](#ref-2)] und anderen angeboten werden. Diese Systeme erlauben es Kunden der Cloud-Produkte dieser Unternehmen, flexible Zugriffskontrollen auf Basis verschiedener Funktionen zu konfigurieren, etwa: Zuweisung von Benutzern zu Rollen oder Gruppen; domänenspezifische Richtliniensprachen; und APIs, die das Erstellen und Ändern von ACLs ermöglichen. Allen diesen Systemen gemeinsam sind eine einheitliche ACL-Speicherung und eine RPC-basierte API, eine Philosophie, die auch für das Design von Zanzibar zentral ist. Das Cloud-IAM-System von Google [[5](#ref-5)] ist als Schicht auf dem ACL-Speicher- und Auswertungssystem von Zanzibar aufgebaut."
  s5-p6:
    text: "TAO [[13](#ref-13)] ist ein verteilter Datenspeicher für den sozialen Graphen von Facebook. Mehrere Zanzibar-Clients nutzen Zanzibar ebenfalls, um ihre sozialen Graphen zu speichern. Sowohl Zanzibar als auch TAO stellen Clients Autorisierungsprüfungen bereit. Beide werden als Single-Instance-Dienste betrieben, beide arbeiten in großem Maßstab, und beide sind für reine Leseoperationen optimiert. TAO bietet letztendliche globale Konsistenz (Eventual Consistency) mit asynchroner Replikation und Read-after-Write-Konsistenz nach dem Best-Effort-Prinzip mit synchronen Cache-Aktualisierungen. Im Gegensatz dazu bietet Zanzibar externe Konsistenz und Snapshot-Lesevorgänge mit begrenzter Veraltung, sodass es die kausale Reihenfolge zwischen ACL- und Inhaltsaktualisierungen respektiert und damit vor dem „New Enemy“-Problem schützt."
  s5-p7:
    text: "Lamport-Uhren [[22](#ref-22)] liefern teilweise geordnete Vektor-Zeitstempel, mit denen sich die Reihenfolge von Ereignissen bestimmen lässt. Lamport-Uhren erfordern jedoch die explizite Beteiligung aller „Prozesse“, wobei in den Anwendungsfällen von Zanzibar einige der „Prozesse“ externe Clients oder sogar menschliche Benutzer sein können. Im Gegensatz dazu stützt sich Zanzibar auf sein zugrunde liegendes Datenbanksystem Spanner [[15](#ref-15)], um sowohl externe Konsistenz als auch Snapshot-Lesevorgänge mit begrenzter Veraltung zu bieten. Insbesondere baut Zanzibar auf der TrueTime-Abstraktion von Spanner [[15](#ref-15)] auf, um linearisierbare Commit-Zeitstempel bereitzustellen, die als zookies kodiert sind."
  s5-p8:
    text: "Zugleich fügt Zanzibar den von Spanner bereitgestellten Funktionen eine Reihe weiterer Funktionen hinzu. Zum einen lässt das zookie-Protokoll Clients ACLs *nicht* auf einem beliebigen Snapshot lesen oder auswerten. Diese Einschränkung erlaubt es Zanzibar, einen Snapshot zu wählen, der eine schnelle ACL-Auswertung begünstigt. Darüber hinaus bietet Zanzibar Widerstandsfähigkeit gegenüber Datenbank-Hotspots (z. B. Autorisierungsprüfungen für ein plötzlich populäres Video) und sicheres Pointer-Chasing trotz potenziell tiefer Rekursion (z. B. Mitgliedschaftsprüfungen auf hierarchischen Gruppen)."
  s5-p9:
    text: "Der verteilte Lock-Dienst Chubby [[14](#ref-14)] bietet zuverlässige Speicherung, linearisiert Schreibvorgänge und stellt Zugriffskontrolle bereit, doch ihm fehlen Funktionen, die zur Unterstützung der Anwendungsfälle von Zanzibar erforderlich sind. Insbesondere unterstützt er keine großen Datenmengen, keine effizienten Bereichslesevorgänge und keine Lesevorgänge auf einem vom Client angegebenen Snapshot mit begrenzter Veraltung. Sein Mechanismus zur Cache-Invalidierung begrenzt zudem seinen Schreibdurchsatz."
  s5-p10:
    text: "Schließlich bietet ZooKeeper einen hochperformanten Koordinationsdienst [[19](#ref-19)], dem jedoch ebenfalls Funktionen fehlen, die Zanzibar benötigt. Im Vergleich zu Chubby kann er höhere Lese- und Schreibraten bei gelockerter Cache-Konsistenz bewältigen. Er bietet jedoch keine externe Konsistenz für Aktualisierungen über verschiedene Knoten hinweg, da seine Linearisierbarkeit pro Knoten gilt. Außerdem bietet er keine Snapshot-Lesevorgänge mit begrenzter Veraltung."
  s6:
    text: "Fazit"
  s6-p1:
    text: "Das Autorisierungssystem Zanzibar vereinheitlicht Zugriffskontrolldaten und -logik für Google. Sein einfaches und zugleich flexibles Datenmodell und seine Konfigurationssprache unterstützen eine Vielfalt von Zugriffskontrollrichtlinien sowohl von Verbraucher- als auch von Unternehmensanwendungen."
  s6-p2:
    text: "Das Modell der externen Konsistenz von Zanzibar ist eines seiner herausragendsten Merkmale. Es respektiert die Reihenfolge von Benutzeraktionen und erlaubt es zugleich, Autorisierungsprüfungen an verteilten Standorten ohne globale Synchronisation auszuwerten."
  s6-p3:
    text: "Zanzibar setzt weitere zentrale Techniken ein, um Skalierbarkeit, niedrige Latenz und hohe Verfügbarkeit zu bieten. Beispielsweise wertet es tief oder breit verschachtelte Gruppenmitgliedschaften mit Leopard aus, einem spezialisierten Index für die effiziente Berechnung von Mengenoperationen mit Snapshot-Konsistenz. Als weiteres Beispiel kombiniert es einen verteilten Cache mit einem Mechanismus zur Deduplizierung laufender Anfragen. Damit mildert es Hotspots ab, ein kritisches Problem im Produktivbetrieb, wenn Daten auf Basis eines normalisierten, konsistenten Speichers ausgeliefert werden. Zusammen ergeben diese Maßnahmen ein System, das auf Billionen von Zugriffskontrollregeln und Millionen von Autorisierungsanfragen pro Sekunde skaliert."
  s7:
    text: "Danksagungen"
  s7-p1:
    text: "Viele Menschen haben technische Beiträge zu Zanzibar geleistet. Wir danken früheren und aktuellen Mitgliedern des Entwicklungsteams, darunter Dan Barella, Miles Chaston, Daria Jung, Alex Mendes da Costa, Xin Pan, Scott Smith, Matthew Steffen, Riva Tropp und Yuliya Zabiyaka. Wir danken außerdem früheren und aktuellen Mitgliedern des Site-Reliability-Engineering-Teams, darunter Randall Bosetti, Hannes Eder, Robert Geisberger, Tom Li, Massimo Maggi, Igor Oks, Aaron Peterson und Andrea Yu."
  s7-p2:
    text: "Darüber hinaus haben eine Reihe von Personen geholfen, dieses Paper zu verbessern. Wir haben aufschlussreiche Kommentare von David Bacon, Carolin Gäthke, Brad Krueger, Ari Shamash, Kai Shen und Lawrence You erhalten. Wir sind außerdem Nadav Eiron und Royal Hansen für ihre Unterstützung dankbar. Schließlich danken wir den anonymen Gutachtern und unserem Shepherd, Eric Eide, für ihr konstruktives Feedback."
