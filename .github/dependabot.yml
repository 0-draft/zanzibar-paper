version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      fonts:
        patterns: ["@fontsource/*", "@fontsource-variable/*"]
      test:
        patterns: ["vitest", "@vitest/*", "@playwright/test", "@axe-core/*"]
      textlint:
        patterns: ["textlint", "textlint-rule-*"]
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
